<!DOCTYPE html>
<html lang="en" data-theme="emerald">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Categories | Admin Modern</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@3.1.0/dist/full.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="min-h-screen bg-base-200">

    <div class="navbar bg-base-100 shadow-md px-4 md:px-20">
        <div class="flex-1"><a href="index.html"
                class="btn btn-ghost normal-case text-xl font-bold text-primary">LocalServe Admin</a></div>
    </div>

    <div class="flex flex-col lg:flex-row max-w-[1600px] mx-auto">
        <aside class="w-full lg:w-72 bg-base-100 border-r border-base-300 p-6 space-y-2 lg:min-h-screen">
            <a href="index.html" class="btn btn-ghost btn-md w-full justify-start gap-4"><i
                    class="fas fa-chart-pie"></i> Dashboard</a>
            <a href="providers.html" class="btn btn-ghost btn-md w-full justify-start gap-4"><i
                    class="fas fa-users"></i> Providers</a>
            <a href="categories.html"
                class="btn btn-ghost btn-md w-full justify-start gap-4 bg-primary/10 text-primary font-bold"><i
                    class="fas fa-th-large"></i> Categories</a>
            <a href="locations.html" class="btn btn-ghost btn-md w-full justify-start gap-4"><i
                    class="fas fa-map-marker-alt"></i> Locations</a>
        </aside>

        <main class="flex-1 p-8">
            <div class="flex items-center justify-between mb-8">
                <h1 class="text-3xl font-extrabold">Service Categories</h1>
                <div class="join shadow-sm">
                    <input class="input input-bordered join-item" placeholder="New Category Name" />
                    <button class="btn btn-primary join-item">+ Add</button>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Category Stat Card -->
                <div class="card bg-base-100 shadow-sm border border-base-300">
                    <div class="card-body">
                        <div class="flex justify-between items-start">
                            <div
                                class="w-12 h-12 bg-primary/10 flex items-center justify-center rounded-xl text-primary">
                                <i class="fas fa-faucet text-xl"></i></div>
                            <div class="dropdown dropdown-end">
                                <label tabindex="0" class="btn btn-ghost btn-xs opacity-50"><i
                                        class="fas fa-ellipsis-v"></i></label>
                                <ul tabindex="0"
                                    class="menu menu-sm dropdown-content mt-3 z-[1] p-2 shadow bg-base-100 rounded-box w-32">
                                    <li><a>Edit</a></li>
                                    <li><a class="text-error">Delete</a></li>
                                </ul>
                            </div>
                        </div>
                        <h3 class="text-xl font-bold mt-4">Plumbing</h3>
                        <p class="text-base-content/50 font-medium">124 Providers Registered</p>
                        <div class="card-actions justify-end mt-4">
                            <button class="btn btn-outline btn-xs font-bold">View Providers</button>
                        </div>
                    </div>
                </div>
                <!-- Category Stat Card -->
                <div class="card bg-base-100 shadow-sm border border-base-300">
                    <div class="card-body">
                        <div class="flex justify-between items-start">
                            <div
                                class="w-12 h-12 bg-primary/10 flex items-center justify-center rounded-xl text-primary">
                                <i class="fas fa-broom text-xl"></i></div>
                            <div class="dropdown dropdown-end">
                                <label tabindex="0" class="btn btn-ghost btn-xs opacity-50"><i
                                        class="fas fa-ellipsis-v"></i></label>
                                <ul tabindex="0"
                                    class="menu menu-sm dropdown-content mt-3 z-[1] p-2 shadow bg-base-100 rounded-box w-32">
                                    <li><a>Edit</a></li>
                                    <li><a class="text-error">Delete</a></li>
                                </ul>
                            </div>
                        </div>
                        <h3 class="text-xl font-bold mt-4">Cleaning</h3>
                        <p class="text-base-content/50 font-medium">86 Providers Registered</p>
                        <div class="card-actions justify-end mt-4">
                            <button class="btn btn-outline btn-xs font-bold">View Providers</button>
                        </div>
                    </div>
                </div>
                <!-- Category Stat Card -->
                <div class="card bg-base-100 shadow-sm border border-base-300">
                    <div class="card-body">
                        <div class="flex justify-between items-start">
                            <div
                                class="w-12 h-12 bg-primary/10 flex items-center justify-center rounded-xl text-primary">
                                <i class="fas fa-bolt text-xl"></i></div>
                            <div class="dropdown dropdown-end">
                                <label tabindex="0" class="btn btn-ghost btn-xs opacity-50"><i
                                        class="fas fa-ellipsis-v"></i></label>
                                <ul tabindex="0"
                                    class="menu menu-sm dropdown-content mt-3 z-[1] p-2 shadow bg-base-100 rounded-box w-32">
                                    <li><a>Edit</a></li>
                                    <li><a class="text-error">Delete</a></li>
                                </ul>
                            </div>
                        </div>
                        <h3 class="text-xl font-bold mt-4">Electrical</h3>
                        <p class="text-base-content/50 font-medium">42 Providers Registered</p>
                        <div class="card-actions justify-end mt-4">
                            <button class="btn btn-outline btn-xs font-bold">View Providers</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

</body>

</html>
