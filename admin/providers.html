<!DOCTYPE html>
<html lang="en" data-theme="emerald">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Providers | Admin Modern</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@3.1.0/dist/full.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="min-h-screen bg-base-200">

    <div class="navbar bg-base-100 shadow-md px-4 md:px-20">
        <div class="flex-1">
            <a href="index.html" class="btn btn-ghost normal-case text-xl font-bold text-primary">LocalServe Admin</a>
        </div>
        <div class="flex-none"><a href="../index.html" class="btn btn-ghost btn-sm">Website</a></div>
    </div>

    <div class="flex flex-col lg:flex-row max-w-[1600px] mx-auto">
        <!-- Sidebar -->
        <aside class="w-full lg:w-72 bg-base-100 border-r border-base-300 p-6 space-y-2 lg:min-h-screen">
            <a href="index.html" class="btn btn-ghost btn-md w-full justify-start gap-4"><i
                    class="fas fa-chart-pie"></i> Dashboard</a>
            <a href="providers.html"
                class="btn btn-ghost btn-md w-full justify-start gap-4 bg-primary/10 text-primary font-bold"><i
                    class="fas fa-users"></i> Providers</a>
            <a href="categories.html" class="btn btn-ghost btn-md w-full justify-start gap-4"><i
                    class="fas fa-th-large"></i> Categories</a>
            <a href="locations.html" class="btn btn-ghost btn-md w-full justify-start gap-4"><i
                    class="fas fa-map-marker-alt"></i> Locations</a>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-8">
            <div class="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4">
                <h1 class="text-3xl font-extrabold">Provider Management</h1>
                <button class="btn btn-primary" onclick="add_modal.showModal()"><i class="fas fa-plus"></i> Add New
                    Provider</button>
            </div>

            <div class="card bg-base-100 shadow-sm border border-base-300">
                <div class="overflow-x-auto">
                    <table class="table table-zebra">
                        <thead class="bg-base-200">
                            <tr>
                                <th>Name</th>
                                <th>Category</th>
                                <th>Location</th>
                                <th>Verification</th>
                                <th class="text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>
                                    <div class="flex items-center space-x-3">
                                        <div class="avatar placeholder">
                                            <div
                                                class="bg-blue-100 text-blue-600 mask mask-squircle w-10 h-10 flex items-center justify-center">
                                                <i class="fas fa-faucet text-sm"></i>
                                            </div>
                                        </div>
                                        <div>
                                            <div class="font-bold">Elite Plumbing Solutions</div>
                                            <div class="text-xs opacity-50">15 Years Experience</div>
                                        </div>
                                    </div>
                                </td>
                                <td>
                                    <div class="badge badge-outline font-bold">Plumbing</div>
                                </td>
                                <td>GEC Circle</td>
                                <td>
                                    <div class="badge badge-success text-white badge-sm font-bold">Verified</div>
                                </td>
                                <td class="text-right flex justify-end gap-2">
                                    <button class="btn btn-square btn-ghost btn-sm text-primary"><i
                                            class="fas fa-edit"></i></button>
                                    <button class="btn btn-square btn-ghost btn-sm text-error"><i
                                            class="fas fa-trash"></i></button>
                                </td>
                            </tr>
                            <tr>
                                <td>
                                    <div class="flex items-center space-x-3">
                                        <div class="avatar placeholder">
                                            <div
                                                class="bg-purple-100 text-purple-600 mask mask-squircle w-10 h-10 flex items-center justify-center">
                                                <i class="fas fa-broom text-sm"></i>
                                            </div>
                                        </div>
                                        <div>
                                            <div class="font-bold">Sparkle Clean Co.</div>
                                            <div class="text-xs opacity-50">Commercial Specialist</div>
                                        </div>
                                    </div>
                                </td>
                                <td>
                                    <div class="badge badge-outline font-bold">Cleaning</div>
                                </td>
                                <td>Agrabad</td>
                                <td>
                                    <div class="badge badge-success text-white badge-sm font-bold">Verified</div>
                                </td>
                                <td class="text-right flex justify-end gap-2">
                                    <button class="btn btn-square btn-ghost btn-sm text-primary"><i
                                            class="fas fa-edit"></i></button>
                                    <button class="btn btn-square btn-ghost btn-sm text-error"><i
                                            class="fas fa-trash"></i></button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal for Adding Provider -->
    <dialog id="add_modal" class="modal">
        <form method="dialog" class="modal-box max-w-2xl bg-base-100 p-8">
            <h3 class="font-extrabold text-2xl mb-6">Register New Provider</h3>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="form-control">
                    <label class="label"><span class="label-text font-bold uppercase tracking-wider text-xs">Business
                            Name</span></label>
                    <input type="text" placeholder="e.g. Master Gardeners" class="input input-bordered w-full" />
                </div>
                <div class="form-control">
                    <label class="label"><span
                            class="label-text font-bold uppercase tracking-wider text-xs">Category</span></label>
                    <select class="select select-bordered w-full">
                        <option>Plumbing</option>
                        <option>Cleaning</option>
                        <option>Electrical</option>
                        <option>Gardening</option>
                    </select>
                </div>
                <div class="form-control">
                    <label class="label"><span
                            class="label-text font-bold uppercase tracking-wider text-xs">Location</span></label>
                    <select class="select select-bordered w-full">
                        <option>GEC Circle</option>
                        <option>Agrabad</option>
                        <option>Nasirabad</option>
                        <option>Halishahar</option>
                        <option>Chawkbazar</option>
                    </select>
                </div>
                <div class="form-control">
                    <label class="label"><span class="label-text font-bold uppercase tracking-wider text-xs">Contact
                            Number</span></label>
                    <input type="tel" placeholder="+880 1XXX-XXXXXX" class="input input-bordered w-full" />
                </div>
                <div class="form-control md:col-span-2">
                    <label class="label"><span
                            class="label-text font-bold uppercase tracking-wider text-xs">Description</span></label>
                    <textarea class="textarea textarea-bordered h-24"
                        placeholder="Brief background of the service provider..."></textarea>
                </div>
            </div>

            <div class="modal-action mt-8">
                <button class="btn btn-ghost font-bold">Discard</button>
                <button class="btn btn-primary font-bold px-10">Add Provider</button>
            </div>
        </form>
    </dialog>

</body>

</html>
