<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | LocalServe Modern</title>
    
    <link href="https://cdn.jsdelivr.net/npm/daisyui@3.1.0/dist/full.css" rel="stylesheet" type="text/css" /><script>
        tailwind.config = {
            darkMode: 'class',
            daisyui: {
                themes: ['sky', 'light'],
                darkTheme: 'light'
            }
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --p: 221 70% 41%; /* Dark Blue (blue-700 equivalent) */
            --pf: 221 70% 31%; /* Darker focus */
            --success: 142 76% 36%;
            --error: 0 84% 60%;
            --neutral: 0 0% 10%;
        }
        .text-primary { color: hsl(var(--p)) !important; }
        .btn-primary { background-color: hsl(var(--p)) !important; border-color: hsl(var(--p)) !important; color: white !important; }
        .btn-primary:hover { background-color: hsl(var(--pf)) !important; }
        body { opacity: 0; transition: opacity 0.3s ease; }
        
        /* Consistent Navbar */
        .navbar {
            background-color: rgba(255, 255, 255, 0.8) !important;
            backdrop-filter: blur(12px) !important;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1) !important;
            position: sticky !important;
            top: 0 !important;
            z-index: 50 !important;
        }
    </style>
    

    <!-- Forcibly disable dark mode OS preferences -->
    <meta name="color-scheme" content="light">
    <style>
        @media (prefers-color-scheme: dark) {
            :root { color-scheme: light !important; }
        }
        html { theme-transition: none; }
    </style>
</head>

<body class="min-h-screen bg-base-200">

    <div class="navbar bg-base-100 shadow-md px-4 md:px-20">
        <div class="flex-1">
            <a href="index.html" class="btn btn-ghost normal-case text-xl font-bold text-primary">LocalServe Admin</a>
        </div>
        <div class="flex-none"><a href="../User-Website/index.html" class="btn btn-ghost btn-sm">Website</a></div>
    </div>

    <!-- Admin Wrapper -->
    <div class="flex flex-col lg:flex-row max-w-[1600px] mx-auto min-h-[calc(100vh-64px)] overflow-hidden">

        <!-- Sidebar (generated by js/sidebar.js) -->
                <aside id="admin-sidebar" class="w-full lg:w-72 bg-base-100 border-r border-base-300 p-6 space-y-2 lg:min-h-screen">
            <div class="text-xs font-bold text-base-content/40 uppercase px-4 mb-4 tracking-widest mt-4">Main Menu</div>
            <a href="index.html" class="btn btn-ghost btn-md w-full justify-start gap-4 ">
                <i class="fas fa-chart-pie"></i> Dashboard
            </a>
            <a href="manage-providers.html" class="btn btn-ghost btn-md w-full justify-start gap-4 ">
                <i class="fas fa-users"></i> Providers
            </a>
            <a href="manage-categories.html" class="btn btn-ghost btn-md w-full justify-start gap-4 ">
                <i class="fas fa-th-large"></i> Categories
            </a>
            <a href="manage-locations.html" class="btn btn-ghost btn-md w-full justify-start gap-4 ">
                <i class="fas fa-map-marker-alt"></i> Locations
            </a>
            <div class="divider"></div>
            <div class="text-xs font-bold text-base-content/40 uppercase px-4 mb-4 tracking-widest mt-4">System</div>
            <a href="settings.html" class="btn btn-ghost btn-md w-full justify-start gap-4 bg-primary/10 text-primary font-bold">
                <i class="fas fa-cog"></i> Settings
            </a>
            </aside>
        <!-- Main Dashboard Content -->
        
        <main class="flex-1 p-8 overflow-y-auto">
            <div class="mb-8 border-b border-base-300 pb-4">
                <h1 class="text-3xl font-bold mb-2">System Settings</h1>
                <p class="text-base-content/60">Manage your administrative preferences.</p>
            </div>

            <div class="card bg-base-100 shadow-md border border-base-300 max-w-xl">
                <div class="card-body">
                    <h2 class="card-title text-xl mb-4 border-b border-base-200 pb-2"><i class="fas fa-lock text-primary"></i> Change Admin Password</h2>
                    
                    <form onsubmit="handlePasswordChange(event)" class="space-y-4">
                        <div class="form-control">
                            <label class="label"><span class="label-text font-semibold">Current Password</span></label>
                            <input type="password" id="currentPass" class="input input-bordered w-full focus:outline-primary" placeholder="Enter current password" required />
                        </div>
                        <div class="form-control">
                            <label class="label"><span class="label-text font-semibold">New Password</span></label>
                            <input type="password" id="newPass" class="input input-bordered w-full focus:outline-primary" placeholder="Enter new password" required minlength="4" />
                        </div>
                        <div class="form-control">
                            <label class="label"><span class="label-text font-semibold">Confirm New Password</span></label>
                            <input type="password" id="confirmPass" class="input input-bordered w-full focus:outline-primary" placeholder="Re-enter new password" required minlength="4"/>
                            <label class="label hidden" id="passError"><span class="label-text-alt text-error font-medium">Passwords do not match!</span></label>
                        </div>
                        
                        <div class="mt-6 flex justify-end">
                            <button type="submit" class="btn btn-primary px-8">Save Password</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <script>
            function handlePasswordChange(e) {
                e.preventDefault();
                const newPass = document.getElementById('newPass').value;
                const confirmPass = document.getElementById('confirmPass').value;
                const errorLabel = document.getElementById('passError');
                
                if (newPass !== confirmPass) {
                    errorLabel.classList.remove('hidden');
                    return;
                }
                errorLabel.classList.add('hidden');
                
                // Simulate AJAX delay
                const btn = e.target.querySelector('button[type="submit"]');
                const origText = btn.innerHTML;
                btn.innerHTML = '<span class="loading loading-spinner loading-xs"></span> Saving...';
                btn.disabled = true;
                
                setTimeout(() => {
                    btn.innerHTML = origText;
                    btn.disabled = false;
                    Swal.fire({
                        title: 'Password Updated',
                        text: 'Your admin password has been changed successfully.',
                        icon: 'success',
                        confirmButtonText: 'OK',
                        customClass: { confirmButton: 'btn btn-primary text-white px-8' },
                        buttonsStyling: false
                    }).then(() => {
                        e.target.reset();
                    });
                }, 800);
            }
            
            // Basic Real-time Check
            document.getElementById('confirmPass').addEventListener('input', function() {
                const newPass = document.getElementById('newPass').value;
                const errorLabel = document.getElementById('passError');
                if (this.value && newPass !== this.value) {
                    errorLabel.classList.remove('hidden');
                } else {
                    errorLabel.classList.add('hidden');
                }
            });
        </script>

    </div>

    <script>document.body.style.opacity = "1";</script>
</body>

</html>
