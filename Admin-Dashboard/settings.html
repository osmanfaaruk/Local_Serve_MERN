<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | LocalServe Modern</title>
    
    <link href="https://cdn.jsdelivr.net/npm/daisyui@3.1.0/dist/full.css" rel="stylesheet" type="text/css" /><script>
        tailwind.config = {
            darkMode: 'class',
            daisyui: {
                themes: ['sky', 'light'],
                darkTheme: 'light'
            }
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="adminAuth.js"></script>
    <style>
        :root {
            --p: 221 70% 41%; /* Dark Blue (blue-700 equivalent) */
            --pf: 221 70% 31%; /* Darker focus */
            --success: 142 76% 36%;
            --error: 0 84% 60%;
            --neutral: 0 0% 10%;
        }
        .text-primary { color: hsl(var(--p)) !important; }
        .btn-primary { background-color: hsl(var(--p)) !important; border-color: hsl(var(--p)) !important; color: white !important; }
        .btn-primary:hover { background-color: hsl(var(--pf)) !important; }
        body { opacity: 0; transition: opacity 0.3s ease; }
        
        /* Consistent Navbar */
        .navbar {
            background-color: rgba(255, 255, 255, 0.8) !important;
            backdrop-filter: blur(12px) !important;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1) !important;
            position: sticky !important;
            top: 0 !important;
            z-index: 50 !important;
        }
    </style>
    

    
    <meta name="color-scheme" content="light">
    <style>
        @media (prefers-color-scheme: dark) {
            :root { color-scheme: light !important; }
        }
        html { theme-transition: none; }
    </style>
</head>

<body class="min-h-screen bg-base-200">

    <div class="navbar bg-base-100 shadow-md px-4 md:px-20">
        <div class="flex-1">
            <a href="index.html" class="btn btn-ghost normal-case text-xl font-bold text-primary">LocalServe Admin</a>
        </div>
        <div class="flex-none gap-2">
            <a href="../User-Website/index.html" class="btn btn-ghost btn-sm">Website</a>
            <button onclick="adminLogout()" class="btn btn-ghost btn-sm text-error font-bold">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </div>

    
    <div class="flex flex-col lg:flex-row max-w-[1600px] mx-auto min-h-[calc(100vh-64px)] overflow-hidden">

        
            <aside id="admin-sidebar" class="w-full lg:w-72 bg-base-100 border-r border-base-300 p-6 space-y-2 lg:min-h-screen">
            <div class="text-xs font-bold text-base-content/40 uppercase px-4 mb-4 tracking-widest mt-4">Main Menu</div>
            <a href="index.html" class="btn btn-ghost btn-md w-full justify-start gap-4 ">
                <i class="fas fa-chart-pie"></i> Dashboard
            </a>
            <a href="manage-providers.html" class="btn btn-ghost btn-md w-full justify-start gap-4 ">
                <i class="fas fa-users"></i> Providers
            </a>
            <a href="manage-categories.html" class="btn btn-ghost btn-md w-full justify-start gap-4 ">
                <i class="fas fa-th-large"></i> Categories
            </a>
            <a href="manage-locations.html" class="btn btn-ghost btn-md w-full justify-start gap-4 ">
                <i class="fas fa-map-marker-alt"></i> Locations
            </a>
            <div class="divider"></div>
            <div class="text-xs font-bold text-base-content/40 uppercase px-4 mb-4 tracking-widest mt-4">System</div>
            <a href="settings.html" class="btn btn-ghost btn-md w-full justify-start gap-4 bg-primary/10 text-primary font-bold">
                <i class="fas fa-cog"></i> Settings
            </a>
            </aside>
        
        
        <main class="flex-1 p-8 overflow-y-auto">
            <div class="mb-8 border-b border-base-300 pb-4">
                <h1 class="text-3xl font-bold mb-2">System Settings</h1>
                <p class="text-base-content/60">Manage your administrative preferences.</p>
            </div>

            <div class="card bg-base-100 shadow-xl border border-base-300 max-w-2xl">
                <div class="card-body p-6 md:p-10">
                    <h2 class="text-2xl font-extrabold mb-1 border-b pb-4 flex items-center gap-3">
                        <i class="fas fa-lock text-primary"></i> Change Admin Password
                    </h2>
                    
                    <form id="changePasswordForm" class="space-y-6 mt-4" onsubmit="handlePasswordChange(event)">
                        <div class="form-control">
                            <label class="label"><span class="label-text font-bold uppercase tracking-wider text-xs">Current Password <span class="text-error">*</span></span></label>
                            <input type="password" id="cp_current" class="input input-bordered w-full md:w-2/3" required />
                        </div>
                        <div class="form-control">
                            <label class="label"><span class="label-text font-bold uppercase tracking-wider text-xs">New Password <span class="text-error">*</span></span></label>
                            <input type="password" id="cp_new" class="input input-bordered w-full md:w-2/3" required />
                        </div>
                        <div class="form-control">
                            <label class="label"><span class="label-text font-bold uppercase tracking-wider text-xs">Confirm New Password <span class="text-error">*</span></span></label>
                            <input type="password" id="cp_confirm" class="input input-bordered w-full md:w-2/3" required />
                        </div>
                        
                        <div class="pt-4">
                            <button type="submit" class="btn btn-primary font-bold shadow-lg px-8">Save Password</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <script>
        window.onload = async () => {
            await requireAdminAuth();
            document.body.style.opacity = '1';
        };

        async function handlePasswordChange(e) {
            e.preventDefault();
            const currentPassword = document.getElementById('cp_current').value;
            const newPassword     = document.getElementById('cp_new').value;
            const confirmPassword = document.getElementById('cp_confirm').value;

            if (newPassword !== confirmPassword) {
                Swal.fire({ icon: 'error', title: 'Error', text: 'New passwords do not match!', customClass: { confirmButton: 'btn btn-primary text-white' }, buttonsStyling: false });
                return;
            }
            if (newPassword.length < 6) {
                Swal.fire({ icon: 'error', title: 'Error', text: 'New password must be at least 6 characters.', customClass: { confirmButton: 'btn btn-primary text-white' }, buttonsStyling: false });
                return;
            }

            try {
                const res = await fetch('http://localhost:5000/api/admin/auth/change-password', {
                    method: 'POST',
                    headers: adminAuthHeader(),
                    body: JSON.stringify({ currentPassword, newPassword })
                });

                const data = await res.json();

                if (!res.ok) {
                    Swal.fire({ icon: 'error', title: 'Error', text: data.error || 'Failed to change password.', customClass: { confirmButton: 'btn btn-primary text-white' }, buttonsStyling: false });
                    return;
                }

                Swal.fire({
                    icon: 'success',
                    title: 'Password Changed!',
                    text: 'Your admin password has been updated successfully.',
                    customClass: { confirmButton: 'btn btn-primary text-white' },
                    buttonsStyling: false
                }).then(() => {
                    document.getElementById('changePasswordForm').reset();
                });
            } catch (err) {
                Swal.fire({ icon: 'error', title: 'Error', text: 'Cannot connect to server.', customClass: { confirmButton: 'btn btn-primary text-white' }, buttonsStyling: false });
            }
        }
        </script>
    </div>
</body>
</html>
