<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Categories | Admin Modern</title>
    
    <link href="https://cdn.jsdelivr.net/npm/daisyui@3.1.0/dist/full.css" rel="stylesheet" type="text/css" /><script>
        tailwind.config = {
            darkMode: 'class',
            daisyui: {
                themes: ['sky', 'light'],
                darkTheme: 'light'
            }
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --p: 221 70% 41%; /* Dark Blue (blue-700 equivalent) */
            --pf: 221 70% 31%; /* Darker focus */
            --success: 142 76% 36%;
            --error: 0 84% 60%;
            --neutral: 0 0% 10%;
        }
        .btn-primary { background-color: hsl(var(--p)) !important; border-color: hsl(var(--p)) !important; color: white !important; }
        .btn-primary:hover { background-color: hsl(var(--pf)) !important; }
        .text-primary { color: hsl(var(--p)) !important; }
        
        /* Consistent Navbar */
        .navbar {
            background-color: rgba(255, 255, 255, 0.8) !important;
            backdrop-filter: blur(12px) !important;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1) !important;
            position: sticky !important;
            top: 0 !important;
            z-index: 50 !important;
        }
    </style>

    <!-- Forcibly disable dark mode OS preferences -->
    <meta name="color-scheme" content="light">
    <style>
        @media (prefers-color-scheme: dark) {
            :root { color-scheme: light !important; }
        }
        html { theme-transition: none; }
    </style>
</head>

<body class="min-h-screen bg-base-200">

    <div class="navbar bg-base-100 shadow-md px-4 md:px-20">
        <div class="flex-1">
            <a href="index.html" class="btn btn-ghost normal-case text-xl font-bold text-primary">LocalServe Admin</a>
        </div>
        <div class="flex-none"><a href="../User-Website/index.html" class="btn btn-ghost btn-sm">Website</a></div>
    </div>

    <div class="flex flex-col lg:flex-row max-w-[1600px] mx-auto">
        <!-- Sidebar (generated by js/sidebar.js) -->
                <aside id="admin-sidebar" class="w-full lg:w-72 bg-base-100 border-r border-base-300 p-6 space-y-2 lg:min-h-screen">
            <div class="text-xs font-bold text-base-content/40 uppercase px-4 mb-4 tracking-widest mt-4">Main Menu</div>
            <a href="index.html" class="btn btn-ghost btn-md w-full justify-start gap-4 ">
                <i class="fas fa-chart-pie"></i> Dashboard
            </a>
            <a href="manage-providers.html" class="btn btn-ghost btn-md w-full justify-start gap-4 ">
                <i class="fas fa-users"></i> Providers
            </a>
            <a href="manage-categories.html" class="btn btn-ghost btn-md w-full justify-start gap-4 bg-primary/10 text-primary font-bold">
                <i class="fas fa-th-large"></i> Categories
            </a>
            <a href="manage-locations.html" class="btn btn-ghost btn-md w-full justify-start gap-4 ">
                <i class="fas fa-map-marker-alt"></i> Locations
            </a>
            <div class="divider"></div>
            <div class="text-xs font-bold text-base-content/40 uppercase px-4 mb-4 tracking-widest mt-4">System</div>
            <a href="settings.html" class="btn btn-ghost btn-md w-full justify-start gap-4 ">
                <i class="fas fa-cog"></i> Settings
            </a>
            </aside>
        
        <main class="flex-1 p-8">
            <div class="flex items-center justify-between mb-8">
                <h1 class="text-3xl font-extrabold">Service Categories</h1>
                <div class="join shadow-sm">
                    <input id="newCategoryInput" class="input input-bordered join-item w-64" placeholder="New Category Name" />
                    <button onclick="promptNewCategory()" class="btn btn-primary join-item text-white px-8">+ Add</button>
                </div>
            </div>

            <div class="card bg-base-100 shadow-sm border border-base-300">
                <div class="overflow-x-auto">
                    <table class="table table-zebra font-medium">
                        <thead>
                            <tr class="bg-base-200">
                                <th>Icon</th>
                                <th>Category Name</th>
                                <th>Registered Providers</th>
                                <th class="text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="categories-table-body">
                            <!-- Rows generated dynamically by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        const SWAL_BUTTONS = {
            confirm: 'btn btn-primary text-white mx-3',
            cancel: 'btn btn-error text-white mx-3',
            success: 'btn btn-success text-white',
            warning: 'btn btn-warning text-white mx-3',
            delete: 'btn btn-error text-white mx-3',
        };

        function confirmAdd(inputFieldId, type, onSuccess) {
            const inputField = document.getElementById(inputFieldId);
            const itemName = inputField.value.trim();
            if (!itemName) {
                Swal.fire({
                    icon: 'warning', title: 'Empty Field!', text: `Please enter a ${type.toLowerCase()} name first!`,
                    customClass: { confirmButton: SWAL_BUTTONS.confirm }, buttonsStyling: false
                }).then(() => inputField.focus());
                return;
            }
            Swal.fire({
                title: 'Are you sure?', text: `Do you want to add "${itemName}" as a new ${type.toLowerCase()}?`,
                icon: 'question', showCancelButton: true,
                customClass: { confirmButton: SWAL_BUTTONS.confirm, cancelButton: SWAL_BUTTONS.cancel },
                buttonsStyling: false, confirmButtonText: 'Yes, Add it!', cancelButtonText: 'Cancel'
            }).then((result) => {
                if (result.isConfirmed) {
                    if (onSuccess) onSuccess(itemName);
                    Swal.fire({
                        title: 'Added!', text: `${type} "${itemName}" has been added successfully!`,
                        icon: 'success', customClass: { confirmButton: SWAL_BUTTONS.success }, buttonsStyling: false
                    });
                    inputField.value = '';
                }
            });
        }

        function confirmEdit(currentName, type, onSuccess) {
            Swal.fire({
                title: `Edit ${type} Name`, text: `Are you sure you want to edit "${currentName}"?`,
                icon: 'question', showCancelButton: true,
                customClass: { confirmButton: SWAL_BUTTONS.confirm, cancelButton: SWAL_BUTTONS.cancel },
                buttonsStyling: false, confirmButtonText: 'Yes, Edit', cancelButtonText: 'Cancel'
            }).then((result) => {
                if (result.isConfirmed) {
                    Swal.fire({
                        title: 'Enter New Name', input: 'text',
                        inputValue: currentName, showCancelButton: true,
                        customClass: { confirmButton: SWAL_BUTTONS.confirm, cancelButton: SWAL_BUTTONS.cancel },
                        buttonsStyling: false, confirmButtonText: 'Update', cancelButtonText: 'Cancel',
                        inputValidator: (value) => { if (!value.trim()) return `${type} name cannot be empty!`; }
                    }).then((result) => {
                        if (result.isConfirmed) {
                            if (onSuccess) onSuccess(result.value);
                            Swal.fire({
                                title: 'Updated!', text: `${type} renamed to "${result.value}" successfully!`,
                                icon: 'success', customClass: { confirmButton: SWAL_BUTTONS.success }, buttonsStyling: false
                            });
                        }
                    });
                }
            });
        }
    </script>
    <script>
        let categories = [];
        let nextId = 1;

        async function loadCategories() {
            try {
                const response = await fetch('data/categories.json');
                categories = await response.json();
                nextId = Math.max(...categories.map(c => c.id)) + 1;
                // Map providers statically or randomly for UI display
                categories.forEach(c => {
                    // Start everything static
                    c.providers = 1;
                });
                renderTable();
            } catch (error) {
                console.error('Failed to load categories:', error);
            }
        }

        function renderTable() {
            const tbody = document.getElementById('categories-table-body');
            if (categories.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center py-10 text-base-content/40">No categories found</td></tr>`;
                return;
            }
            tbody.innerHTML = categories.map(cat => `
                <tr>
                    <td>
                        <div class="w-10 h-10 bg-primary/10 flex items-center justify-center rounded-xl text-primary">
                            <i class="fas ${cat.icon || 'fa-tag'} text-lg"></i>
                        </div>
                    </td>
                    <td class="font-bold">${cat.name}</td>
                    <td class="font-bold text-primary">${cat.providers} <span class="text-xs font-normal text-base-content/60 ml-1">Providers</span></td>
                    <td class="text-right">
                        <button onclick="editCategory(${cat.id})" class="btn btn-ghost btn-xs font-bold text-primary"><i class="fas fa-edit mr-1"></i> Edit Name</button>
                    </td>
                </tr>
            `).join('');
        }

        function promptNewCategory() {
            confirmAdd('newCategoryInput', 'Category', (name) => {
                categories.unshift({ id: nextId++, name: name, icon: 'fa-tag', providers: 0 });
                renderTable();
            });
        }

        function editCategory(id) {
            const cat = categories.find(c => c.id === id);
            if (!cat) return;
            confirmEdit(cat.name, 'Category', (newName) => {
                cat.name = newName;
                renderTable();
            });
        }

        loadCategories();
    </script>
    <script>document.body.style.opacity = "1";</script>
</body>
</html>
