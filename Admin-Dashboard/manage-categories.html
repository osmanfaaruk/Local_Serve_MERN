<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Categories | LocalServe Admin</title>
        <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='100' fill='%231d4ed8'/><path fill='white' d='M448 176L256 88L64 176l192 88l192-88zm-192 112l160-73.3v60L256 348L96 274.7v-60l160 73.3zm0 96l160-73.3v60L256 444l-160-73.3v-60l160 73.3z'/></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/daisyui@3.1.0/dist/full.css" rel="stylesheet" type="text/css" />
    <script>
        tailwind.config = {
            darkMode: 'class',
            daisyui: {
                themes: ['sky', 'light'],
                darkTheme: 'light'
            }
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="adminAuth.js"></script>
    <style>
        body, html { font-family: 'Inter', sans-serif !important; }
        :root {
            --p: 221 70% 41%;
            --pf: 221 70% 31%;
            --success: 142 76% 36%;
            --error: 0 84% 60%;
            --neutral: 0 0% 10%;
        }
        .btn-primary { background-color: hsl(var(--p)) !important; border-color: hsl(var(--p)) !important; color: white !important; }
        .btn-primary:hover { background-color: hsl(var(--pf)) !important; }
        .text-primary { color: hsl(var(--p)) !important; }
        
        .navbar {
            background-color: rgba(255, 255, 255, 0.8) !important;
            backdrop-filter: blur(12px) !important;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1) !important;
            position: sticky !important;
            top: 0 !important;
            z-index: 50 !important;
        }
        body { opacity: 0; transition: opacity 0.3s ease; }
    </style>

    <meta name="color-scheme" content="light">
    <style>
        body, html { font-family: 'Inter', sans-serif !important; }
        @media (prefers-color-scheme: dark) {
            :root { color-scheme: light !important; }
        }
        html { theme-transition: none; }
    </style>
</head>

<body class="min-h-screen bg-base-200">

    <!-- navbar section start -->
    <div class="navbar bg-base-100 shadow-md px-4 md:px-20">
        <div class="flex-1">
            <a href="index.html" class="flex items-center gap-2 group px-4">
                <div class="w-8 h-8 bg-blue-700 rounded-lg flex items-center justify-center text-white shadow-lg shadow-blue-700/20 group-hover:scale-110 transition-transform">
                    <i class="fas fa-layer-group text-xs"></i>
                </div>
                <span class="text-xl font-black text-primary tracking-tighter">LocalServe Admin</span>
            </a>
        </div>
        <div class="flex-none gap-2">
            <a href="/" class="btn btn-ghost btn-sm">Website</a>
            <button onclick="adminLogout()" class="btn btn-ghost btn-sm text-error font-bold">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </div>
    <!-- navbar section end -->

    <!-- sidebar and main section start -->
    <div class="flex flex-col lg:flex-row max-w-[1600px] mx-auto">
        
        <!-- sidebar section start -->
        <aside id="admin-sidebar" class="w-full lg:w-72 bg-base-100 border-r border-base-300 p-6 space-y-2 lg:min-h-screen">
            <div class="text-xs font-bold text-slate-500 uppercase px-4 mb-4 mt-4">Main Menu</div>
            <a href="index.html" class="btn btn-ghost btn-md w-full justify-start gap-4 ">
                <i class="fas fa-chart-pie"></i> Dashboard
            </a>
            <a href="manage-providers.html" class="btn btn-ghost btn-md w-full justify-start gap-4 ">
                <i class="fas fa-users-cog"></i> Providers
            </a>
            <a href="add-provider.html" class="btn btn-ghost btn-md w-full justify-start gap-4 ">
                <i class="fas fa-user-plus"></i> Add Provider
            </a>
            <a href="manage-users.html" class="btn btn-ghost btn-md w-full justify-start gap-4 ">
                <i class="fas fa-users"></i> Users
            </a>
            <a href="manage-categories.html" class="btn btn-ghost btn-md w-full justify-start gap-4 bg-primary/10 text-primary font-bold">
                <i class="fas fa-th-large"></i> Categories
            </a>
            <a href="manage-locations.html" class="btn btn-ghost btn-md w-full justify-start gap-4 ">
                <i class="fas fa-map-marker-alt"></i> Locations
            </a>
            <div class="divider"></div>
            <div class="text-xs font-bold text-slate-500 uppercase px-4 mb-4 mt-4">System</div>
            <a href="settings.html" class="btn btn-ghost btn-md w-full justify-start gap-4 ">
                <i class="fas fa-cog"></i> Settings
            </a>
        </aside>
        <!-- sidebar section end -->
        
        <!-- main content section start -->
        <main class="flex-1 p-8">
            <div class="flex items-center justify-between mb-8">
                <h1 class="text-3xl font-extrabold">Service Categories</h1>
                <div class="join shadow-sm">
                    <input id="newCategoryInput" class="input input-bordered join-item w-64" placeholder="Enter Category Name" />
                    <button onclick="promptNewCategory()" class="btn btn-primary join-item text-white px-8">+ Add Category</button>
                </div>
            </div>

            <!-- categories table section start -->
            <div class="card bg-base-100 shadow-sm border border-base-300">
                <div class="overflow-x-auto">
                    <table class="table table-zebra font-medium">
                        <thead>
                            <tr class="bg-base-200">
                                <th>Category Name</th>
                                <th>Registered Providers</th>
                                <th class="text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="categories-table-body">
                        </tbody>
                    </table>
                </div>
            </div>
            <!-- categories table section end -->
        </main>
        <!-- main content section end -->
    </div>
    <!-- sidebar and main section end -->
    
    <!-- scripts section start -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        const SWAL_STYLE = {
            confirm: 'btn btn-primary text-white mx-3',
            cancel: 'btn btn-error text-white mx-3',
            success: 'btn btn-success text-white',
            warning: 'btn btn-warning text-white mx-3',
            delete: 'btn btn-error text-white mx-3'
        };

        function confirmAdd(inputFieldId, type, onSuccess) {
            const inputField = document.getElementById(inputFieldId);
            const itemName = inputField.value.trim();
            if (!itemName) {
                Swal.fire({
                    icon: 'warning', title: 'Empty Field!', text: `Please enter a ${type.toLowerCase()} name first!`,
                    customClass: { confirmButton: SWAL_STYLE.confirm }, buttonsStyling: false
                });
                return;
            }
            Swal.fire({
                title: 'Are you sure?', text: `Do you want to add "${itemName}"?`,
                icon: 'question', showCancelButton: true,
                customClass: { confirmButton: SWAL_STYLE.confirm, cancelButton: SWAL_STYLE.cancel },
                buttonsStyling: false, confirmButtonText: 'Yes, Add', cancelButtonText: 'Cancel'
            }).then((result) => {
                if (result.isConfirmed) {
                    if (onSuccess) onSuccess(itemName);
                    Swal.fire({
                        title: 'Added!', icon: 'success', customClass: { confirmButton: SWAL_STYLE.success }, buttonsStyling: false
                    });
                    inputField.value = '';
                }
            });
        }

        function confirmEdit(currentName, type, onSuccess) {
            Swal.fire({
                title: `Edit ${type}`, text: `Are you sure you want to rename "${currentName}"?`,
                icon: 'question', showCancelButton: true,
                customClass: { confirmButton: SWAL_STYLE.confirm, cancelButton: SWAL_STYLE.cancel },
                buttonsStyling: false, confirmButtonText: 'Yes, Edit', cancelButtonText: 'Cancel'
            }).then((result) => {
                if (result.isConfirmed) {
                    Swal.fire({
                        title: 'Enter New Name', input: 'text',
                        inputValue: currentName, showCancelButton: true,
                        customClass: { confirmButton: SWAL_STYLE.confirm, cancelButton: SWAL_STYLE.cancel },
                        buttonsStyling: false, confirmButtonText: 'Update', cancelButtonText: 'Cancel',
                        inputValidator: (value) => { if (!value.trim()) return `${type} name cannot be empty!`; }
                    }).then((result) => {
                        if (result.isConfirmed) {
                            if (onSuccess) onSuccess(result.value);
                            Swal.fire({
                                title: 'Updated!', icon: 'success', customClass: { confirmButton: SWAL_STYLE.success }, buttonsStyling: false
                            });
                        }
                    });
                }
            });
        }

        let categories = [];
        let providers = [];

        async function loadCategories() {
            try {
                const [catRes, provRes] = await Promise.all([
                    fetch('/api/categories'),
                    fetch('/api/providers')
                ]);
                categories = await catRes.json();
                providers = await provRes.json();
                renderTable();
            } catch (error) {
                console.error('Failed to load data:', error);
            }
        }

        function renderTable() {
            const tbody = document.getElementById('categories-table-body');
            if (categories.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="text-center py-10 opacity-40 italic">No categories found.</td></tr>`;
                return;
            }
            tbody.innerHTML = categories.map(cat => {
                const count = providers.filter(p => p.categories && p.categories.includes(cat.name)).length;
                return `
                    <tr>
                        <td class="font-bold">${cat.name}</td>
                        <td class="font-bold text-primary">${count} <span class="text-xs font-normal text-base-content/60 ml-1">Providers</span></td>
                        <td class="text-right">
                            <button onclick="editCategory('${cat._id}')" class="btn btn-ghost btn-xs font-bold text-primary">
                                <i class="fas fa-edit mr-1"></i> Edit Name
                            </button>
                            <button onclick="deleteCategory('${cat._id}', '${cat.name}')" class="btn btn-ghost btn-xs font-bold text-error">
                                <i class="fas fa-trash mr-1"></i> Delete
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function promptNewCategory() {
            confirmAdd('newCategoryInput', 'Category', async (name) => {
                try {
                    const res = await fetch('/api/categories', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: name, icon: 'fa-tag' })
                    });
                    if (res.ok) {
                        loadCategories();
                    }
                } catch (e) {
                    console.error(e);
                }
            });
        }

        function editCategory(id) {
            const cat = categories.find(c => c._id === id);
            if (!cat) return;
            confirmEdit(cat.name, 'Category', async (newName) => {
                try {
                    const res = await fetch(`/api/categories/${id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: newName })
                    });
                    if (res.ok) {
                        loadCategories();
                    }
                } catch (e) {
                    console.error(e);
                }
            });
        }
        
        function deleteCategory(id, name) {
            Swal.fire({
                title: `Delete Category?`,
                text: `Are you sure you want to delete "${name}"?`,
                icon: 'warning',
                showCancelButton: true,
                customClass: { confirmButton: SWAL_STYLE.delete, cancelButton: SWAL_STYLE.confirm },
                buttonsStyling: false, confirmButtonText: 'Yes, Delete', cancelButtonText: 'Cancel'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    try {
                        const res = await fetch(`/api/categories/${id}`, {
                            method: 'DELETE'
                        });
                        if (res.ok) {
                            Swal.fire({ title: 'Deleted!', icon: 'success', customClass: { confirmButton: SWAL_STYLE.success }, buttonsStyling: false });
                            loadCategories();
                        }
                    } catch (e) {
                        console.error(e);
                    }
                }
            });
        }
        
        window.onload = async () => {
            await requireAdminAuth();
            loadCategories();
            document.body.style.opacity = "1";
        };
    </script>
    <!-- scripts section end -->

</body>
</html>
