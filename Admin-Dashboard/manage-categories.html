<!DOCTYPE html>
<html lang="en" data-theme="sky">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Categories | Admin Modern</title>
    
    <link href="https://cdn.jsdelivr.net/npm/daisyui@3.1.0/dist/full.css" rel="stylesheet" type="text/css" /><script src="https://cdn.tailwindcss.com"></script><script>
        tailwind.config = {
            darkMode: 'class',
            daisyui: {
                themes: ['sky', 'light'],
                darkTheme: 'light'
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --p: 221 70% 41%; /* Dark Blue (blue-700 equivalent) */
            --pf: 221 70% 31%; /* Darker focus */
            --success: 142 76% 36%;
            --error: 0 84% 60%;
            --neutral: 0 0% 10%;
        }
        .btn-primary { background-color: hsl(var(--p)) !important; border-color: hsl(var(--p)) !important; color: white !important; }
        .btn-primary:hover { background-color: hsl(var(--pf)) !important; }
        .text-primary { color: hsl(var(--p)) !important; }
        
        /* Consistent Navbar */
        .navbar {
            background-color: rgba(255, 255, 255, 0.8) !important;
            backdrop-filter: blur(12px) !important;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1) !important;
            position: sticky !important;
            top: 0 !important;
            z-index: 50 !important;
        }
    </style>
</head>

<body class="min-h-screen bg-base-200">

    <div class="navbar bg-base-100 shadow-md px-4 md:px-20">
        <div class="flex-1">
            <a href="index.html" class="btn btn-ghost normal-case text-xl font-bold text-primary">LocalServe Admin</a>
        </div>
        <div class="flex-none"><a href="../User-Website/index.html" class="btn btn-ghost btn-sm">Website</a></div>
    </div>

    <div class="flex flex-col lg:flex-row max-w-[1600px] mx-auto">
        <!-- Sidebar (generated by js/sidebar.js) -->
        <aside id="admin-sidebar" class="w-full lg:w-72 bg-base-100 border-r border-base-300 p-6 space-y-2 lg:min-h-screen"></aside>
        <script src="js/sidebar.js"></script>

        <main class="flex-1 p-8">
            <div class="flex items-center justify-between mb-8">
                <h1 class="text-3xl font-extrabold">Service Categories</h1>
                <div class="join shadow-sm">
                    <input class="input input-bordered join-item" placeholder="New Category Name" />
                    <button class="btn btn-primary join-item">+ Add</button>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Category Stat Card -->
                <div class="card bg-base-100 shadow-sm border border-base-300">
                    <div class="card-body">
                        <div class="flex justify-between items-start">
                            <div
                                class="w-12 h-12 bg-primary/10 flex items-center justify-center rounded-xl text-primary">
                                <i class="fas fa-faucet text-xl"></i></div>
                            <div class="dropdown dropdown-end">
                                <label tabindex="0" class="btn btn-ghost btn-xs opacity-50"><i
                                        class="fas fa-ellipsis-v"></i></label>
                                <ul tabindex="0"
                                    class="menu menu-sm dropdown-content mt-3 z-[1] p-2 shadow bg-base-100 rounded-box w-32">
                                    <li><a>Edit</a></li>
                                    <li><a class="text-error">Delete</a></li>
                                </ul>
                            </div>
                        </div>
                        <h3 class="text-xl font-bold mt-4">Plumbing</h3>
                        <p class="text-base-content/50 font-medium">124 Providers Registered</p>
                        <div class="card-actions justify-end mt-4">
                            <button class="btn btn-outline btn-xs font-bold">View Providers</button>
                        </div>
                    </div>
                </div>
                <!-- Category Stat Card -->
                <div class="card bg-base-100 shadow-sm border border-base-300">
                    <div class="card-body">
                        <div class="flex justify-between items-start">
                            <div
                                class="w-12 h-12 bg-primary/10 flex items-center justify-center rounded-xl text-primary">
                                <i class="fas fa-broom text-xl"></i></div>
                            <div class="dropdown dropdown-end">
                                <label tabindex="0" class="btn btn-ghost btn-xs opacity-50"><i
                                        class="fas fa-ellipsis-v"></i></label>
                                <ul tabindex="0"
                                    class="menu menu-sm dropdown-content mt-3 z-[1] p-2 shadow bg-base-100 rounded-box w-32">
                                    <li><a>Edit</a></li>
                                    <li><a class="text-error">Delete</a></li>
                                </ul>
                            </div>
                        </div>
                        <h3 class="text-xl font-bold mt-4">Cleaning</h3>
                        <p class="text-base-content/50 font-medium">86 Providers Registered</p>
                        <div class="card-actions justify-end mt-4">
                            <button class="btn btn-outline btn-xs font-bold">View Providers</button>
                        </div>
                    </div>
                </div>
                <!-- Category Stat Card -->
                <div class="card bg-base-100 shadow-sm border border-base-300">
                    <div class="card-body">
                        <div class="flex justify-between items-start">
                            <div
                                class="w-12 h-12 bg-primary/10 flex items-center justify-center rounded-xl text-primary">
                                <i class="fas fa-bolt text-xl"></i></div>
                            <div class="dropdown dropdown-end">
                                <label tabindex="0" class="btn btn-ghost btn-xs opacity-50"><i
                                        class="fas fa-ellipsis-v"></i></label>
                                <ul tabindex="0"
                                    class="menu menu-sm dropdown-content mt-3 z-[1] p-2 shadow bg-base-100 rounded-box w-32">
                                    <li><a>Edit</a></li>
                                    <li><a class="text-error">Delete</a></li>
                                </ul>
                            </div>
                        </div>
                        <h3 class="text-xl font-bold mt-4">Electrical</h3>
                        <p class="text-base-content/50 font-medium">42 Providers Registered</p>
                        <div class="card-actions justify-end mt-4">
                            <button class="btn btn-outline btn-xs font-bold">View Providers</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>document.body.style.opacity = "1";</script>
</body>

</html>
