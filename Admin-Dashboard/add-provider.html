<script>

    let allAvailableAreas = [];
    let allAvailableCategories = [];



    function updateCharCount(inputId, labelId, maxChars = 300) {
        const input = document.getElementById(inputId);
        if (!input) return;
        const charCount = input.value.length;
        const label = document.getElementById(labelId);
        if (label) {
            label.innerText = `${charCount} / ${maxChars} characters`;
            if (charCount > maxChars) label.classList.add('text-error', 'font-bold');
            else label.classList.remove('text-error', 'font-bold');
        }
    }

    function setupAreaSearch() {
        const input = document.getElementById('areaSearchInput');
        const dropdown = document.getElementById('areaDropdown');
        const section = document.getElementById('areaSearchSection');
        if(!input || !dropdown || !section) return;
        input.onfocus = () => renderAreaDropdown(input.value);
        input.oninput = () => renderAreaDropdown(input.value);
        if (!window._hasAreaSearchListener) {
            document.addEventListener('click', (e) => {
                const d = document.getElementById('areaDropdown');
                const s = document.getElementById('areaSearchSection');
                if (d && s && !s.contains(e.target)) d.classList.add('hidden');
            });
            window._hasAreaSearchListener = true;
        }
    }
    function toggleAreaDropdown() { const d = document.getElementById('areaDropdown'); if (d) d.classList.toggle('hidden'); }
    function renderAreaDropdown(query = '') {
        const dropdown = document.getElementById('areaDropdown'); if (!dropdown) return;
        dropdown.innerHTML = '';
        const filtered = allAvailableAreas.filter(a => a.toLowerCase().includes(query.toLowerCase())).sort((a, b) => {
            const am = a.toLowerCase().startsWith(query.toLowerCase()), bm = b.toLowerCase().startsWith(query.toLowerCase());
            if (am && !bm) return -1; if (!am && bm) return 1; return a.localeCompare(b);
        });
        if (filtered.length === 0) { dropdown.innerHTML = '<div class="p-4 text-center text-sm opacity-50 italic">No locations found</div>'; } 
        else {
            filtered.slice(0, 6).forEach(area => {
                const isSel = selectedAreas.includes(area);
                const div = document.createElement('div');
                div.className = `dropdown-item ${isSel ? 'opacity-30 pointer-events-none' : 'cursor-pointer'}`;
                div.innerHTML = `<div class="px-1"><span class="${isSel ? 'line-through opacity-50' : 'font-medium'}">${area}</span></div>`;
                if (!isSel) div.onclick = () => selectArea(area);
                dropdown.appendChild(div);
            });
        }
        dropdown.classList.remove('hidden');
    }
    function selectArea(area) { if (!selectedAreas.includes(area)) { selectedAreas.push(area); refreshAreaSelection(); renderAreaDropdown(document.getElementById('areaSearchInput').value); } }
    function removeArea(area) { selectedAreas = selectedAreas.filter(a => a !== area); refreshAreaSelection(); if (document.getElementById('areaSearchInput')) renderAreaDropdown(document.getElementById('areaSearchInput').value); }
    function refreshAreaSelection() {
        const container = document.getElementById('selectedAreasContainer'); if (!container) return;
        container.innerHTML = '';
        if (selectedAreas.length === 0) { container.innerHTML = '<span class="text-xs opacity-50 italic py-2">No areas selected yet.</span>'; return; }
        selectedAreas.forEach(area => {
            const badge = document.createElement('div');
            badge.className = 'badge bg-blue-700 text-white border-none badge-lg py-4 px-4 gap-2 font-bold shadow-sm';
            badge.innerHTML = `<i class="fas fa-map-marker-alt text-xs opacity-70"></i> ${area} <i class="fas fa-times cursor-pointer hover:text-white/70 ml-1" onclick="removeArea('${area}')"></i>`;
            container.appendChild(badge);
        });
        if (typeof saveDraft === 'function') saveDraft();
    }

    function setupTagInput() {
        const input = document.getElementById('tagInput'); if(!input) return;
        input.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); processTagInput(); } });
    }
    function processTagInput() {
        const input = document.getElementById('tagInput'); if (!input) return;
        const values = input.value.split(','); let hasError = false;
        const errorLabel = document.getElementById('tagError');
        values.forEach(val => {
            val = val.trim(); if (!val) return;
            if (val.split(/\s+/).length > 6) hasError = true;
            else if (!offeredServicesTags.includes(val)) offeredServicesTags.push(val);
        });
        if (errorLabel) { if (hasError) errorLabel.classList.remove('hidden'); else errorLabel.classList.add('hidden'); }
        if (!hasError) input.value = '';
        refreshTags();
        if (typeof saveDraft === 'function') saveDraft();
    }
    function removeTag(index) { offeredServicesTags.splice(index, 1); refreshTags(); if (typeof saveDraft === 'function') saveDraft(); }
    function refreshTags() {
        const container = document.getElementById('tagContainer'); if (!container) return;
        container.innerHTML = '';
        if (offeredServicesTags.length === 0) { container.innerHTML = '<span class="text-sm opacity-50 italic py-2">No services added yet.</span>'; return; }
        offeredServicesTags.forEach((t, i) => {
            const badge = document.createElement('div');
            badge.className = 'badge bg-blue-700 text-white border-none badge-lg py-4 px-4 gap-2 font-bold shadow-sm';
            badge.innerHTML = `<i class="fas fa-tag text-[10px] opacity-70"></i> ${t} <i class="fas fa-times cursor-pointer hover:text-white/70 ml-1" onclick="removeTag(${i})"></i>`;
            container.appendChild(badge);
        });
    }

    async function fetchCategories() {
        if (allAvailableCategories && allAvailableCategories.length > 0) return allAvailableCategories;
        try {
            const response = await fetch(`/api/categories`);
            allAvailableCategories = await response.json();
            return allAvailableCategories;
        } catch (error) {
            allAvailableCategories = [{ name: "Home Repairs" }, { name: "Cleaning" }, { name: "Plumbing" }, { name: "Electrical" }];
            return allAvailableCategories;
        }
    }
    async function setupCategorySearch(pathPrefix = '') {
        const input = document.getElementById('categorySearchInput');
        const dropdown = document.getElementById('categoryDropdown');
        const section = document.getElementById('categorySearchSection');
        if(!input || !dropdown || !section) return;
        await fetchCategories(pathPrefix);
        input.onfocus = () => renderCategoryDropdown(input.value);
        input.oninput = () => renderCategoryDropdown(input.value);
        if (!window._hasCategorySearchListener) {
            document.addEventListener('click', (e) => {
                const d = document.getElementById('categoryDropdown');
                const s = document.getElementById('categorySearchSection');
                if (d && s && !s.contains(e.target)) d.classList.add('hidden');
            });
            window._hasCategorySearchListener = true;
        }
    }
    function toggleCategoryDropdown() { const d = document.getElementById('categoryDropdown'); if (d) d.classList.toggle('hidden'); }
    function renderCategoryDropdown(query = '') {
        const dropdown = document.getElementById('categoryDropdown'); if (!dropdown) return;
        dropdown.innerHTML = '';
        const filtered = allAvailableCategories.filter(c => c.name.toLowerCase().includes(query.toLowerCase())).sort((a, b) => a.name.localeCompare(b.name));
        if (filtered.length === 0) { dropdown.innerHTML = '<div class="p-4 text-center text-sm opacity-50 italic">No categories found</div>'; }
        else {
            filtered.slice(0, 6).forEach(cat => {
                const isSel = categoriesTags.includes(cat.name); const div = document.createElement('div');
                div.className = `dropdown-item ${isSel ? 'opacity-30 pointer-events-none' : 'cursor-pointer'}`;
                div.innerHTML = `<div class="px-1"><span class="${isSel ? 'line-through opacity-50' : 'font-medium'}">${cat.name}</span></div>`;
                if (!isSel) div.onclick = () => selectCategory(cat.name);
                dropdown.appendChild(div);
            });
        }
        dropdown.classList.remove('hidden');
    }
    function selectCategory(c) { if (!categoriesTags.includes(c)) { categoriesTags.push(c); refreshCategoryTags(); renderCategoryDropdown(document.getElementById('categorySearchInput').value); } }
    function removeCategoryTag(c) { categoriesTags = categoriesTags.filter(x => x !== c); refreshCategoryTags(); if (document.getElementById('categorySearchInput')) renderCategoryDropdown(document.getElementById('categorySearchInput').value); if (typeof saveDraft === 'function') saveDraft(); }
    function refreshCategoryTags() {
        const container = document.getElementById('categoryTagContainer'); if (!container) return;
        container.innerHTML = '';
        if (categoriesTags.length === 0) { container.innerHTML = '<span class="text-xs opacity-50 italic py-2">No categories selected yet.</span>'; return; }
        categoriesTags.forEach(t => {
            const badge = document.createElement('div');
            badge.className = 'badge bg-blue-700 text-white border-none badge-lg py-4 px-4 gap-2 font-bold shadow-sm';
            badge.innerHTML = `<i class="fas fa-th-large text-[10px] opacity-70"></i> ${t} <i class="fas fa-times cursor-pointer hover:text-white/70 ml-1" onclick="removeCategoryTag('${t}')"></i>`;
            container.appendChild(badge);
        });
        if (typeof saveDraft === 'function') saveDraft();
    }

    let offeredServicesTags = [];
    let categoriesTags = []; 
    let selectedAreas = []; 
    let formCache = {};

    window.onload = async () => {
        try {
            const locRes = await fetch('/api/locations');
            const locData = await locRes.json();
            allAvailableAreas = locData.map(l => l.name);
        } catch (e) {
            allAvailableAreas = ["Chittagong"];
        }

        setupTagInput();
        setupAreaSearch();
        setupCategorySearch(); 
        startApplication();
        document.body.style.opacity = "1";
    };

    async function startApplication() {
        const urlParams = new URLSearchParams(window.location.search);
        const editId = urlParams.get('edit');

        if (editId) {
            try {
                const res = await fetch(`/api/providers/${editId}`);
                if (res.ok) {
                    formCache = await res.json();
                    offeredServicesTags = [...(formCache.offeredServices || [])];
                    categoriesTags = [...(formCache.categories || [])];
                    selectedAreas = [...(formCache.areas || [])];
                }
            } catch (e) {
                console.error("Failed to load provider for editing", e);
            }
        } else {
            formCache = {};
            offeredServicesTags = [];
            categoriesTags = [];
            selectedAreas = [];
        }
        renderForm();
    }

    function renderForm() {
        const container = document.getElementById('main-container');
        container.innerHTML = '';
        container.appendChild(document.getElementById('tmpl-form').content.cloneNode(true));
        
        setupTagInput();
        setupAreaSearch();
        setupCategorySearch();

        if(Object.keys(formCache).length > 0) {

            const typeRadios = document.querySelectorAll('input[name="providerType"]');
            typeRadios.forEach(r => { if(r.value === formCache.type) r.checked = true; });
            document.getElementById('f_businessName').value = formCache.businessName || '';
            document.getElementById('f_phone').value = formCache.phone || '';
            document.getElementById('f_email').value = formCache.email || '';
            if (document.getElementById('f_experience')) document.getElementById('f_experience').value = formCache.experience || '';
            document.getElementById('f_about').value = formCache.about || '';
            updateCharCount('f_about', 'wordCountLabel', 300);

            if (formCache.workDays) {
                const dayChecks = document.querySelectorAll('input[name="workDay"]');
                dayChecks.forEach(chk => {
                    chk.checked = formCache.workDays.includes(chk.value);
                });
            }
            if (formCache.workTimeStart) document.getElementById('f_workTimeStart').value = formCache.workTimeStart;
            if (formCache.workTimeEnd) document.getElementById('f_workTimeEnd').value = formCache.workTimeEnd;
            document.getElementById('f_priceConsult').value = formCache.priceConsult || '';
            document.getElementById('f_priceHourly').value = formCache.priceHourly || '';

            selectedAreas = [...(formCache.areas || [])];
            refreshAreaSelection();

            categoriesTags = [...(formCache.categories || [])];
            refreshCategoryTags();

            if(formCache.whyChooseUs) {
                const checkboxes = document.querySelectorAll('input[name="chkWhy"]');
                checkboxes.forEach(chk => { chk.checked = formCache.whyChooseUs.includes(chk.value); });
            }
            
            refreshTags();
        }
    }


    function goToStep(step) {
        if(step === 2) {
            const biz = document.getElementById('f_businessName').value.trim();
            const phone = document.getElementById('f_phone').value.trim();
            const email = document.getElementById('f_email').value.trim();
            const experience = document.getElementById('f_experience').value.trim();
            const about = document.getElementById('f_about').value.trim();
            const aboutWordCount = about ? about.length : 0;

            if(!biz || !phone || !email || !experience || !about) {
                Swal.fire({icon:'warning', title:'Required Fields', text:'Please fill all required fields.', customClass: { confirmButton: 'btn btn-primary text-white' }, buttonsStyling: false});
                return;
            }
            if(aboutWordCount > 300) {
                 Swal.fire({icon:'warning', title:'Limit Exceeded', text:'About section cannot exceed 300 characters.', customClass: { confirmButton: 'btn btn-primary text-white' }, buttonsStyling: false});
                 return;
            }

            formCache.type = document.querySelector('input[name="providerType"]:checked').value;
            formCache.businessName = biz;
            formCache.phone = phone;
            formCache.email = email;
            formCache.experience = experience;
            formCache.about = about;

            document.getElementById('form-part-1').classList.add('hidden');
            document.getElementById('form-part-2').classList.remove('hidden');

            const steps = document.querySelectorAll('.step');
            steps[1].classList.add('step-primary');
            window.scrollTo(0,0);
        } else if (step === 1) {
            document.getElementById('form-part-2').classList.add('hidden');
            document.getElementById('form-part-1').classList.remove('hidden');
            const steps = document.querySelectorAll('.step');
            steps[1].classList.remove('step-primary');
            window.scrollTo(0,0);
        }
    }

    function goToReview() {
        const dayChecks = document.querySelectorAll('input[name="workDay"]:checked');
        const wStart = document.getElementById('f_workTimeStart').value;
        const wEnd = document.getElementById('f_workTimeEnd').value;
        const pc = document.getElementById('f_priceConsult').value.trim();
        const ph = document.getElementById('f_priceHourly').value.trim();
        const whyBoxes = document.querySelectorAll('input[name="chkWhy"]:checked');

        if(dayChecks.length === 0 || !wStart || !wEnd || !pc || !ph || selectedAreas.length === 0 || categoriesTags.length === 0) {
            Swal.fire({icon:'warning', title:'Required Fields', text:'Please fill all fields (Days, Hours, Pricing, Areas, Categories).', customClass: { confirmButton: 'btn btn-primary text-white' }, buttonsStyling: false});
            return;
        }

        if(offeredServicesTags.length === 0) {
            Swal.fire({icon:'warning', title:'No Services', text:'Add at least one offered service.', customClass: { confirmButton: 'btn btn-primary text-white' }, buttonsStyling: false});
            return;
        }

        formCache.workDays = Array.from(dayChecks).map(chk => chk.value);
        formCache.workTimeStart = wStart;
        formCache.workTimeEnd = wEnd;
        formCache.priceConsult = pc;
        formCache.priceHourly = ph;
        formCache.areas = [...selectedAreas];
        formCache.offeredServices = [...offeredServicesTags];
        formCache.categories = [...categoriesTags];
        formCache.whyChooseUs = Array.from(whyBoxes).map(chk => chk.value);

        const container = document.getElementById('main-container');
        container.innerHTML = '';
        container.appendChild(document.getElementById('tmpl-review').content.cloneNode(true));
        renderReviewContent();
        window.scrollTo(0,0);
    }

    function renderReviewContent() {
        const c = document.getElementById('review-content');
        const data = formCache;
        
        c.innerHTML = `
            <div class="space-y-6">
                <div>
                    <h3 class="text-xs font-bold uppercase tracking-widest opacity-40 mb-3">Business Information</h3>
                    <div class="space-y-4">
                        <div><p class="text-[10px] font-bold opacity-30 uppercase tracking-tighter">Entity Type</p><p class="font-bold text-lg">${data.type}</p></div>
                        <div><p class="text-[10px] font-bold opacity-30 uppercase tracking-tighter">Business Name</p><p class="font-bold text-lg">${data.businessName}</p></div>
                        <div><p class="text-[10px] font-bold opacity-30 uppercase tracking-tighter">Contact</p><p class="font-bold">${data.phone} | ${data.email}</p></div>
                        <div><p class="text-[10px] font-bold opacity-30 uppercase tracking-tighter">Experience</p><p class="font-bold">${data.experience}</p></div>
                        <div><p class="text-[10px] font-bold opacity-30 uppercase tracking-tighter mb-1">About</p><p class="text-sm bg-base-200 p-4 rounded-lg border border-base-300 italic">${data.about}</p></div>
                    </div>
                </div>
            </div>
            <div class="space-y-6">
                <div>
                    <h3 class="text-xs font-bold uppercase tracking-widest opacity-40 mb-3">Service Details</h3>
                    <div class="space-y-6">
                         <div><p class="text-[10px] font-bold opacity-30 uppercase tracking-tighter">Categories</p><div class="flex flex-wrap gap-2 mt-1">${data.categories.map(cat => `<span class="badge badge-primary text-white font-bold">${cat}</span>`).join('')}</div></div>
                         <div><p class="text-[10px] font-bold opacity-30 uppercase tracking-tighter">Areas</p><div class="flex flex-wrap gap-2 mt-1">${data.areas.map(a => `<span class="badge badge-outline font-bold border-base-300">${a}</span>`).join('')}</div></div>
                         <div><p class="text-[10px] font-bold opacity-30 uppercase tracking-tighter">Services</p><div class="flex flex-wrap gap-2 mt-1">${data.offeredServices.map(s => `<span class="badge badge-ghost font-bold border-base-300"># ${s}</span>`).join('')}</div></div>
                         <div><p class="text-[10px] font-bold opacity-30 uppercase tracking-tighter">Availability / Pricing</p><p class="font-bold mt-1">${data.workDays.join(', ')} (${data.workTimeStart}-${data.workTimeEnd})<br>${data.priceConsult} TK Consult / ${data.priceHourly} TK Hourly</p></div>
                    </div>
                </div>
            </div>
        `;
    }

    function goToFormFromReview() {
        renderForm();

        document.getElementById('form-part-1').classList.add('hidden');   
        document.getElementById('form-part-2').classList.remove('hidden');
        const steps = document.querySelectorAll('.step');
        steps[1].classList.add('step-primary');
        
    }

    async function finalSubmit() {
        const result = await Swal.fire({
            title: 'Verified Listing Publishing',
            text: "You are about to publish a pre-verified provider. It will be live immediately.",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonText: 'Yes, Publish Live',
            customClass: { confirmButton: 'btn btn-success text-white ml-2', cancelButton: 'btn btn-ghost' },
            buttonsStyling: false,
            reverseButtons: true
        });

        if (result.isConfirmed) {
            try {

                Swal.fire({
                    title: 'Publishing...',
                    didOpen: () => { Swal.showLoading() },
                    allowOutsideClick: false
                });

                const isEdit = !!formCache._id;
                const url = isEdit ? `/api/providers/${formCache._id}` : '/api/providers';
                const method = isEdit ? 'PUT' : 'POST';
                
                formCache.status = 'Approved';
                formCache.isApplied = false; // Explicitly mark as admin-added

                const response = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formCache)
                });

                if (response.ok) {
                    await Swal.fire({
                        title: 'Published Successfully!',
                        text: 'The provider is now auto-verified and live on the website.',
                        icon: 'success',
                        customClass: { confirmButton: 'btn btn-primary text-white' },
                        buttonsStyling: false
                    });
                    window.location.href = 'manage-providers.html';
                } else {
                    throw new Error('Failed to publish');
                }
            } catch (error) {
                Swal.fire({
                    title: 'Error!',
                    text: 'Something went wrong while publishing. Please try again.',
                    icon: 'error',
                    customClass: { confirmButton: 'btn btn-primary text-white' },
                    buttonsStyling: false
                });
            }
        }
    }

</script>
</body>
</html>
