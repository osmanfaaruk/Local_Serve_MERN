/**
 * LocalServe - Provider Form Core Logic
 * ------------------------------------
 * This file contains shared functionality between the User application form 
 * and the Admin "Add Provider" form to ensure consistency and maintainability.
 */

// --- SHARED DATA ---

const allAvailableAreas = [
    "CTG Metropolitan Area", "GEC Circle", "Agrabad", "Halishahar", "Nasirabad", 
    "Chawkbazar", "Panchlaish", "Bakalia", "Khulshi", 
    "Patenga", "Kotwali", "Double Mooring", "EPZ Area",
    "Muradpur", "Bahaddarhat", "Lalkhan Bazar"
];

// NOTE: These variables must be declared in the global scope of the HTML file
// as they are used to track state within the specific form session.
// Expected globals: selectedAreas (Array), offeredServicesTags (Array), categoriesTags (Array), formCache (Object)

// --- VALIDATION & UTILS ---

/**
 * Updates the character count display for a given textarea input.
 * It also applies an error warning class if the maximum length is exceeded.
 * @param {string} inputId - The HTML ID of the `<textarea>` element.
 * @param {string} labelId - The HTML ID of the `<span>` or `<label>` displaying the count.
 * @param {number} [maxChars=300] - The maximum allowed characters before showing an error state.
 */
function updateCharCount(inputId, labelId, maxChars = 300) {
    const input = document.getElementById(inputId);
    if (!input) return;
    
    const text = input.value;
    const charCount = text.length;
    const label = document.getElementById(labelId);
    
    if (label) {
        label.innerText = `${charCount} / ${maxChars} characters`;
        if (charCount > maxChars) {
            label.classList.add('text-error', 'font-bold');
        } else {
            label.classList.remove('text-error', 'font-bold');
        }
    }
}

// --- AREA SEARCH LOGIC ---

/**
 * Initializes the area (location) search input behavior.
 * Attaches event listeners for typing, focusing, and clicking outside the dropdown container.
 */
function setupAreaSearch() {
    const input = document.getElementById('areaSearchInput');
    const dropdown = document.getElementById('areaDropdown');
    const section = document.getElementById('areaSearchSection');
    if(!input || !dropdown || !section) return;

    // Use property assignment to avoid duplicate listeners on the elements themselves
    input.onfocus = () => { if(dropdown) renderAreaDropdown(input.value); };
    input.oninput = () => { if(dropdown) renderAreaDropdown(input.value); };
    
    // Global click handler to close dropdown when clicking outside
    // Only add once to the document
    if (!window._hasAreaSearchListener) {
        document.addEventListener('click', (e) => {
            const currentDropdown = document.getElementById('areaDropdown');
            const currentSection = document.getElementById('areaSearchSection');
            if (currentDropdown && currentSection && !currentSection.contains(e.target)) {
                currentDropdown.classList.add('hidden');
            }
        });
        window._hasAreaSearchListener = true;
    }
}

function toggleAreaDropdown() {
    const dropdown = document.getElementById('areaDropdown');
    if (dropdown) dropdown.classList.toggle('hidden');
}

function renderAreaDropdown(query = '') {
    const dropdown = document.getElementById('areaDropdown');
    if (!dropdown) return;
    
    dropdown.innerHTML = '';
    
    const filtered = allAvailableAreas
        .filter(a => a.toLowerCase().includes(query.toLowerCase()))
        .sort((a, b) => {
            const aMatch = a.toLowerCase().startsWith(query.toLowerCase());
            const bMatch = b.toLowerCase().startsWith(query.toLowerCase());
            if (aMatch && !bMatch) return -1;
            if (!aMatch && bMatch) return 1;
            return a.localeCompare(b);
        });

    if (filtered.length === 0) {
        dropdown.innerHTML = '<div class="p-4 text-center text-sm opacity-50 italic">No locations found</div>';
    } else {
        // Limit to 6 items as requested for a cleaner dropdown
        const displayLimit = 6;
        const visibleItems = filtered.slice(0, displayLimit);

        visibleItems.forEach(area => {
            const isSelected = selectedAreas.includes(area);
            const div = document.createElement('div');
            // Remove 'selected' class and use opacity/pointer-events for disabled look
            div.className = `dropdown-item ${isSelected ? 'opacity-30 pointer-events-none cursor-not-allowed mb-1' : 'cursor-pointer'}`;
            div.innerHTML = `
                <div class="flex justify-between items-center transition-all px-1">
                    <span class="${isSelected ? 'line-through decoration-1 text-base-content/50' : 'font-medium'}">${area}</span>
                </div>
            `;
            if (!isSelected) {
                div.onclick = () => selectArea(area);
            }
            dropdown.appendChild(div);
        });
    }
    dropdown.classList.remove('hidden');
}

function selectArea(area) {
    if (!selectedAreas.includes(area)) {
        selectedAreas.push(area);
        refreshAreaSelection();
        renderAreaDropdown(document.getElementById('areaSearchInput').value);
        // Trigger save if saveDraft exists (it will be checked inside the HTML file's listeners)
    }
}

function removeArea(area) {
    selectedAreas = selectedAreas.filter(a => a !== area);
    refreshAreaSelection();
    renderAreaDropdown(document.getElementById('areaSearchInput').value);
}

function refreshAreaSelection() {
    const container = document.getElementById('selectedAreasContainer');
    if (!container) return;
    
    container.innerHTML = '';
    if (selectedAreas.length === 0) {
        container.innerHTML = '<span class="text-sm opacity-40 italic py-2">No areas selected yet. Users will be more likely to find you if you select specific locations.</span>';
        return;
    }

    selectedAreas.forEach(area => {
        const badge = document.createElement('div');
        // Unified style: Dark Blue (bg-blue-700) with white text to match Working Days
        badge.className = 'badge bg-blue-700 text-white border-none badge-lg py-4 px-4 gap-2 font-bold shadow-sm transition-all hover:scale-105';
        badge.innerHTML = `
            <i class="fas fa-map-marker-alt text-xs opacity-70"></i>
            ${area}
            <i class="fas fa-times cursor-pointer hover:text-white/70 ml-1" onclick="removeArea('${area}')"></i>
        `;
        container.appendChild(badge);
    });
    
    // Global hook for draft saving (if exists in parent)
    if (typeof saveDraft === 'function') saveDraft();
}

// --- TAG INPUT LOGIC (Offered Services) ---

function setupTagInput() {
    const input = document.getElementById('tagInput');
    if(!input) return;

    input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ',') {
            e.preventDefault();
            processTagInput();
        }
    });
}

/**
 * Processes the input from the tag field (services offered).
 * Splits input by comma, enforces a 6-word limit per tag, and adds valid tags to the global array.
 */
function processTagInput() {
    const input = document.getElementById('tagInput');
    if (!input) return;
    
    // Split by comma to allow multiple at once
    const values = input.value.split(',');
    let hasError = false;
    const errorLabel = document.getElementById('tagError');

    values.forEach(val => {
        val = val.trim();
        if (!val) return;
        
        const wordCount = val.split(/\s+/).length;
        if (wordCount > 6) {
            hasError = true;
        } else {
            if (!offeredServicesTags.includes(val)) {
                offeredServicesTags.push(val);
            }
        }
    });

    if (errorLabel) {
        if (hasError) errorLabel.classList.remove('hidden');
        else errorLabel.classList.add('hidden');
    }
    
    if (!hasError) {
        input.value = '';
    }
    
    refreshTags();
    if (typeof saveDraft === 'function') saveDraft();
}

function removeTag(index) {
    offeredServicesTags.splice(index, 1);
    refreshTags();
    if (typeof saveDraft === 'function') saveDraft();
}

function refreshTags() {
    const container = document.getElementById('tagContainer');
    if (!container) return;
    
    container.innerHTML = ''; 
    
    if (offeredServicesTags.length === 0) {
        container.innerHTML = '<span class="text-sm opacity-50 italic py-2">No services added yet.</span>';
        return;
    }

    offeredServicesTags.forEach((tagText, index) => {
        const badge = document.createElement('div');
        // Unified style: Dark Blue (bg-blue-700) with white text
        badge.className = 'badge bg-blue-700 text-white border-none badge-lg py-4 px-4 gap-2 font-bold shadow-sm transition-all hover:scale-105';
        badge.innerHTML = `
            <i class="fas fa-tag text-[10px] opacity-70"></i>
            ${tagText}
            <i class="fas fa-times cursor-pointer hover:text-white/70 ml-1" onclick="removeTag(${index})"></i>
        `;
        container.appendChild(badge);
    });
}

// --- CATEGORY TAG LOGIC ---

// --- CATEGORY SEARCH LOGIC (UPGRADED) ---

let allAvailableCategories = [];

/**
 * Fetches the list of available categories from the local JSON file.
 * If fetching fails, it provides a fallback set of hardcoded categories.
 * @returns {Promise<Array>} A promise that resolves to an array of category objects.
 */
async function fetchCategories() {
    if (allAvailableCategories.length > 0) return allAvailableCategories;
    try {
        const response = await fetch('../Admin-Dashboard/data/categories.json');
        allAvailableCategories = await response.json();
        return allAvailableCategories;
    } catch (error) {
        console.error('Error fetching categories:', error);
        // Fallback
        allAvailableCategories = [
            { name: "Home Repairs" },
            { name: "Cleaning" },
            { name: "Plumbing" },
            { name: "Electrical" }
        ];
        return allAvailableCategories;
    }
}

async function setupCategorySearch() {
    const input = document.getElementById('categorySearchInput');
    const dropdown = document.getElementById('categoryDropdown');
    const section = document.getElementById('categorySearchSection');
    if(!input || !dropdown || !section) return;

    // Ensure categories are loaded
    await fetchCategories();

    input.onfocus = () => renderCategoryDropdown(input.value);
    input.oninput = () => renderCategoryDropdown(input.value);
    
    if (!window._hasCategorySearchListener) {
        document.addEventListener('click', (e) => {
            const currentDropdown = document.getElementById('categoryDropdown');
            const currentSection = document.getElementById('categorySearchSection');
            if (currentDropdown && currentSection && !currentSection.contains(e.target)) {
                currentDropdown.classList.add('hidden');
            }
        });
        window._hasCategorySearchListener = true;
    }
}

function toggleCategoryDropdown() {
    const dropdown = document.getElementById('categoryDropdown');
    if (dropdown) dropdown.classList.toggle('hidden');
}

function renderCategoryDropdown(query = '') {
    const dropdown = document.getElementById('categoryDropdown');
    if (!dropdown) return;
    
    dropdown.innerHTML = '';
    
    const filtered = allAvailableCategories
        .filter(c => c.name.toLowerCase().includes(query.toLowerCase()))
        .sort((a, b) => a.name.localeCompare(b.name));

    if (filtered.length === 0) {
        dropdown.innerHTML = '<div class="p-4 text-center text-sm opacity-50 italic">No categories found</div>';
    } else {
        const displayLimit = 6;
        const visibleItems = filtered.slice(0, displayLimit);

        visibleItems.forEach(cat => {
            const isSelected = categoriesTags.includes(cat.name);
            const div = document.createElement('div');
            div.className = `dropdown-item ${isSelected ? 'opacity-30 pointer-events-none cursor-not-allowed mb-1' : 'cursor-pointer'}`;
            div.innerHTML = `
                <div class="flex justify-between items-center transition-all px-1">
                    <span class="${isSelected ? 'line-through decoration-1 text-base-content/50' : 'font-medium'}">${cat.name}</span>
                </div>
            `;
            if (!isSelected) {
                div.onclick = () => selectCategory(cat.name);
            }
            dropdown.appendChild(div);
        });
    }
    dropdown.classList.remove('hidden');
}

function selectCategory(category) {
    if (!categoriesTags.includes(category)) {
        categoriesTags.push(category);
        refreshCategoryTags();
        renderCategoryDropdown(document.getElementById('categorySearchInput').value);
    }
}

function removeCategoryTag(category) {
    categoriesTags = categoriesTags.filter(c => c !== category);
    refreshCategoryTags();
    if (document.getElementById('categorySearchInput')) {
        renderCategoryDropdown(document.getElementById('categorySearchInput').value);
    }
    if (typeof saveDraft === 'function') saveDraft();
}

function refreshCategoryTags() {
    const container = document.getElementById('categoryTagContainer');
    if (!container) return;
    
    container.innerHTML = ''; 
    
    if (categoriesTags.length === 0) {
        container.innerHTML = '<span class="text-xs opacity-50 italic py-2">No categories selected yet. Click search bar to see options.</span>';
        return;
    }

    categoriesTags.forEach((tagText) => {
        const badge = document.createElement('div');
        badge.className = 'badge bg-blue-700 text-white border-none badge-lg py-4 px-4 gap-2 font-bold shadow-sm transition-all hover:scale-105';
        badge.innerHTML = `
            <i class="fas fa-th-large text-[10px] opacity-70"></i>
            ${tagText}
            <i class="fas fa-times cursor-pointer hover:text-white/70 ml-1" onclick="removeCategoryTag('${tagText}')"></i>
        `;
        container.appendChild(badge);
    });
    
    if (typeof saveDraft === 'function') saveDraft();
}

</script>

                                <label class="cursor-pointer">
                                    <input type="checkbox" name="workDay" value="Wed" class="peer sr-only" />
                                    <div class="badge badge-lg py-4 px-4 gap-2 font-bold bg-base-200 text-base-content/40 border-base-300 peer-checked:bg-blue-700 peer-checked:text-white peer-checked:border-blue-700 transition-all hover:bg-base-300">
                                        <i class="fas fa-calendar-alt text-[10px] opacity-70"></i>
                                        Wed
                                    </div>
                                </label>
                                <label class="cursor-pointer">
                                    <input type="checkbox" name="workDay" value="Thu" class="peer sr-only" />
                                    <div class="badge badge-lg py-4 px-4 gap-2 font-bold bg-base-200 text-base-content/40 border-base-300 peer-checked:bg-blue-700 peer-checked:text-white peer-checked:border-blue-700 transition-all hover:bg-base-300">
                                        <i class="fas fa-calendar-alt text-[10px] opacity-70"></i>
                                        Thu
                                    </div>
                                </label>
                                <label class="cursor-pointer">
                                    <input type="checkbox" name="workDay" value="Fri" class="peer sr-only" />
                                    <div class="badge badge-lg py-4 px-4 gap-2 font-bold bg-base-200 text-base-content/40 border-base-300 peer-checked:bg-blue-700 peer-checked:text-white peer-checked:border-blue-700 transition-all hover:bg-base-300">
                                        <i class="fas fa-calendar-alt text-[10px] opacity-70"></i>
                                        Fri
                                    </div>
                                </label>
                            </div>

                            <label class="label"><span class="label-text font-bold uppercase tracking-wider text-xs">Working Hours <span class="text-error">*</span></span></label>
                            <div class="flex items-center gap-3">
                                <div class="relative flex-1">
                                    <span class="absolute left-3 top-1/2 -translate-y-1/2 text-xs opacity-50 font-bold uppercase">From</span>
                                    <input type="time" id="f_workTimeStart" class="input input-bordered w-full pl-16 focus:outline-primary" required />
                                </div>
                                <span class="font-bold opacity-30">TO</span>
                                <div class="relative flex-1">
                                    <span class="absolute left-3 top-1/2 -translate-y-1/2 text-xs opacity-50 font-bold uppercase">To</span>
                                    <input type="time" id="f_workTimeEnd" class="input input-bordered w-full pl-10 focus:outline-primary" required />
                                </div>
                            </div>
                        </div>

                        <!-- Pricing Guide -->
                        <div class="form-control">
                            <label class="label"><span class="label-text font-bold uppercase tracking-wider text-xs">Pricing - Consultation Fee (৳) <span class="text-error">*</span></span></label>
                            <input type="text" id="f_priceConsult" placeholder="e.g. Free, 500, 1000-2000" class="input input-bordered w-full focus:outline-primary" required />
                        </div>
                        <div class="form-control">
                            <label class="label"><span class="label-text font-bold uppercase tracking-wider text-xs">Pricing - Hourly Labor Fee (৳) <span class="text-error">*</span></span></label>
                            <input type="text" id="f_priceHourly" placeholder="e.g. 500-1000 per hour" class="input input-bordered w-full focus:outline-primary" required />
                        </div>

                        <!-- Categories Selection (Searchable Dropdown) - UPGRADED -->
                        <div class="form-control md:col-span-2 relative" id="categorySearchSection">
                            <label class="label"><span class="label-text font-bold uppercase tracking-wider text-xs">Categories <span class="text-error">*</span></span></label>
                            
                            <div class="join w-full mb-3 shadow-sm">
                                <span class="join-item flex items-center px-4 bg-base-200 border border-base-300 border-r-0"><i class="fas fa-search opacity-50"></i></span>
                                <input type="text" id="categorySearchInput" class="input input-bordered join-item w-full focus:outline-primary border-l-0" placeholder="Search and select categories (e.g. Plumbing)..." autocomplete="off" />
                                <button type="button" class="btn btn-primary join-item text-white" onclick="toggleCategoryDropdown()"><i class="fas fa-chevron-down"></i></button>
                            </div>

                            <!-- Dropdown List -->
                            <div id="categoryDropdown" class="absolute top-[85px] left-0 w-full bg-base-100 border border-base-300 rounded-lg z-[60] hidden">
                                <!-- Category items will be injected here -->
                            </div>

                            <!-- Selected Categories Tags -->
                            <div class="bg-base-200/50 p-4 rounded-xl border border-base-300 flex flex-wrap gap-2 min-h-[4rem] mt-2" id="categoryTagContainer">
                                <span class="text-xs opacity-50 italic py-1 px-1">No categories selected yet. Click search bar to see options.</span>
                            </div>
                            
                            <label class="label"><span class="label-text-alt opacity-70">Search and select all categories that describe the business.</span></label>
                        </div>

                        <!-- Service Areas (Searchable Dropdown) -->

                        <div class="form-control md:col-span-2 relative" id="areaSearchSection">
                            <label class="label"><span class="label-text font-bold uppercase tracking-wider text-xs">Service Areas <span class="text-error">*</span></span></label>
                            
                            <div class="join w-full mb-3 shadow-sm">
                                <span class="join-item flex items-center px-4 bg-base-200 border border-base-300 border-r-0"><i class="fas fa-search opacity-50"></i></span>
                                <input type="text" id="areaSearchInput" class="input input-bordered join-item w-full focus:outline-primary border-l-0" placeholder="Type to search locations (e.g. Halishahar)..." autocomplete="off" />
                                <button type="button" class="btn btn-primary join-item text-white" onclick="toggleAreaDropdown()"><i class="fas fa-chevron-down"></i></button>
                            </div>

                            <!-- Dropdown List -->
                            <div id="areaDropdown" class="absolute top-[85px] left-0 w-full bg-base-100 border border-base-300 rounded-lg z-[60] hidden">
                                <!-- Area items will be injected here -->
                            </div>

                            <!-- Selected Areas Tags -->
                            <div class="bg-base-200/50 p-4 rounded-xl border border-base-300 flex flex-wrap gap-2 min-h-[4rem] mt-2" id="selectedAreasContainer">
                                <span class="text-xs opacity-50 italic py-1 px-1">No areas selected yet. Click search bar to see options.</span>
                            </div>

                            <label class="label"><span class="label-text-alt opacity-70">Search and select all areas where you can provide service.</span></label>
                        </div>

                        <!-- Offered Services Tags -->
                        <div class="form-control md:col-span-2">
                            <label class="label">
                                <span class="label-text font-bold uppercase tracking-wider text-xs">Offered Services <span class="text-error">*</span></span>
                                <span class="label-text-alt opacity-70">Max 6 words per service</span>
                            </label>
                            <div class="join w-full mb-3">
                                <input type="text" id="tagInput" class="input input-bordered join-item w-full focus:outline-primary" placeholder="Type a service and press Add or comma (,)..." />
                                <button type="button" class="btn btn-primary join-item text-white" onclick="processTagInput()"><i class="fas fa-plus"></i> Add</button>
                            </div>
                            <div class="bg-base-200/50 p-4 rounded-xl border border-base-300 flex flex-wrap gap-2 min-h-[4rem] mt-1" id="tagContainer">
                                <span class="text-sm opacity-50 italic py-2">No services added yet.</span>
                            </div>
                            <label class="label"><span class="label-text-alt text-error hidden" id="tagError">Service name cannot exceed 6 words.</span></label>
                        </div>
                        
                        <!-- Why Choose Us -->
                        <div class="form-control md:col-span-2">
                            <label class="label"><span class="label-text font-bold uppercase tracking-wider text-xs">Why Choose Us (Select multiple) <span class="text-error">*</span></span></label>
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-3" id="whyChooseUsContainer">
                                <label class="cursor-pointer label justify-start gap-3 bg-base-200 rounded-lg px-3 py-2 border border-base-300 hover:border-primary/40">
                                    <input type="checkbox" name="chkWhy" value="Professional Grade" class="checkbox checkbox-primary checkbox-sm" />
                                    <span class="label-text text-sm font-medium">Professional Grade</span>
                                </label>
                                <label class="cursor-pointer label justify-start gap-3 bg-base-200 rounded-lg px-3 py-2 border border-base-300 hover:border-primary/40">
                                    <input type="checkbox" name="chkWhy" value="Fixed Pricing" class="checkbox checkbox-primary checkbox-sm" />
                                    <span class="label-text text-sm font-medium">Fixed Pricing</span>
                                </label>
                                <label class="cursor-pointer label justify-start gap-3 bg-base-200 rounded-lg px-3 py-2 border border-base-300 hover:border-primary/40">
                                    <input type="checkbox" name="chkWhy" value="Guaranteed Quality" class="checkbox checkbox-primary checkbox-sm" />
                                    <span class="label-text text-sm font-medium">Guaranteed Quality</span>
                                </label>
                                <label class="cursor-pointer label justify-start gap-3 bg-base-200 rounded-lg px-3 py-2 border border-base-300 hover:border-primary/40">
                                    <input type="checkbox" name="chkWhy" value="Fast Response" class="checkbox checkbox-primary checkbox-sm" />
                                    <span class="label-text text-sm font-medium">Fast Response</span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="flex justify-between mt-8">
                        <button type="button" onclick="goToStep(1)" class="btn btn-ghost font-bold"><i class="fas fa-arrow-left mr-2"></i> Back</button>
                        <button type="button" onclick="goToReview()" class="btn btn-primary text-white font-bold px-8">Review Application</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</template>

<!-- View: Review Application -->
<template id="tmpl-review">
    <div class="card bg-base-100 shadow-sm border border-base-300">
        <div class="card-body p-6 md:p-10">
            <ul class="steps steps-horizontal w-full mb-10 text-sm font-bold opacity-80 overflow-hidden">
                <li class="step step-primary">Company Info</li>
                <li class="step step-primary">Services</li>
                <li class="step step-primary">Review</li>
            </ul>

            <h2 class="text-3xl font-black text-center mb-8 border-b border-base-300 pb-4 text-base-content">Review New Listing</h2>

            <div class="space-y-8">
                <!-- Data will be injected here by renderReview() -->
                <div id="review-content" class="grid grid-cols-1 md:grid-cols-2 gap-x-12 gap-y-8"></div>
            </div>

            <div class="bg-base-200 border border-base-300 rounded-lg p-5 mt-8 flex gap-4 items-center">
                <i class="fas fa-info-circle text-base-content/50 text-2xl"></i>
                <p class="text-sm font-medium text-base-content">
                    This provider will be auto-verified and published out into the live directory immediately after submission.
                </p>
            </div>

            <div class="flex flex-col md:flex-row gap-4 justify-between mt-8 pt-6 border-t border-base-200">
                <button onclick="goToFormFromReview()" class="btn btn-outline font-bold"><i class="fas fa-edit mr-2"></i> Back to Edit</button>
                <button onclick="finalSubmit()" class="btn btn-success text-white font-bold px-10 shadow-lg hover:scale-105 transition-transform">
                    <i class="fas fa-bolt mr-2"></i> Publish Verified Listing
                </button>
            </div>
        </div>
    </div>
</template>

<!-- ========================================== -->
<!-- SCRIPTS                                    -->
<!-- ========================================== -->

<script>
    // State
    let offeredServicesTags = [];
    let categoriesTags = []; // NEW
    let selectedAreas = []; 
    let formCache = {};

    // Initialization
    window.onload = () => {
        startApplication();
        document.body.style.opacity = "1";
    };

    function startApplication() {
        formCache = {}; 
        offeredServicesTags = [];
        categoriesTags = [];
        selectedAreas = [];
        renderForm();
    }

    // Form Logic
    function renderForm() {
        const container = document.getElementById('main-container');
        container.innerHTML = '';
        container.appendChild(document.getElementById('tmpl-form').content.cloneNode(true));
        
        setupTagInput();
        setupAreaSearch();
        setupCategorySearch();
        
        // Pre-fill form if editing
        if(Object.keys(formCache).length > 0) {
            // Part 1
            const typeRadios = document.querySelectorAll('input[name="providerType"]');
            typeRadios.forEach(r => { if(r.value === formCache.type) r.checked = true; });
            document.getElementById('f_businessName').value = formCache.businessName || '';
            document.getElementById('f_phone').value = formCache.phone || '';
            document.getElementById('f_email').value = formCache.email || '';
            document.getElementById('f_about').value = formCache.about || '';
            updateCharCount('f_about', 'wordCountLabel', 300);
            
            // Part 2
            if (formCache.workDays) {
                const dayChecks = document.querySelectorAll('input[name="workDay"]');
                dayChecks.forEach(chk => {
                    chk.checked = formCache.workDays.includes(chk.value);
                });
            }
            if (formCache.workTimeStart) document.getElementById('f_workTimeStart').value = formCache.workTimeStart;
            if (formCache.workTimeEnd) document.getElementById('f_workTimeEnd').value = formCache.workTimeEnd;
            document.getElementById('f_priceConsult').value = formCache.priceConsult || '';
            document.getElementById('f_priceHourly').value = formCache.priceHourly || '';
            
            // Areas
            selectedAreas = [...(formCache.areas || [])];
            refreshAreaSelection();

            // Categories
            categoriesTags = [...(formCache.categories || [])];
            refreshCategoryTags();
            
            // Why Choose us
            if(formCache.whyChooseUs) {
                const checkboxes = document.querySelectorAll('input[name="chkWhy"]');
                checkboxes.forEach(chk => { chk.checked = formCache.whyChooseUs.includes(chk.value); });
            }
            
            refreshTags();
        }
    }

    // Navigation and Logic blocks are in provider-form-core.js (Tag Input, Area Search)
    

    // Form Navigation & Validation
    function goToStep(step) {
        if(step === 2) {
            // Validate Part 1
            const biz = document.getElementById('f_businessName').value.trim();
            const phone = document.getElementById('f_phone').value.trim();
            const email = document.getElementById('f_email').value.trim();
            const about = document.getElementById('f_about').value.trim();
            const aboutWordCount = about ? about.length : 0;

            if(!biz || !phone || !email || !about) {
                Swal.fire({icon:'warning', title:'Required Fields', text:'Please fill all required fields.', customClass: { confirmButton: 'btn btn-primary text-white' }, buttonsStyling: false});
                return;
            }
            if(aboutWordCount > 300) {
                 Swal.fire({icon:'warning', title:'Limit Exceeded', text:'About section cannot exceed 300 characters.', customClass: { confirmButton: 'btn btn-primary text-white' }, buttonsStyling: false});
                 return;
            }

            // Save Part 1 to cache
            formCache.type = document.querySelector('input[name="providerType"]:checked').value;
            formCache.businessName = biz;
            formCache.phone = phone;
            formCache.email = email;
            formCache.about = about;

            document.getElementById('form-part-1').classList.add('hidden');
            document.getElementById('form-part-2').classList.remove('hidden');
            
            // update steps visual
            const steps = document.querySelectorAll('.step');
            steps[1].classList.add('step-primary');
            window.scrollTo(0,0);
        } else if (step === 1) {
            document.getElementById('form-part-2').classList.add('hidden');
            document.getElementById('form-part-1').classList.remove('hidden');
            const steps = document.querySelectorAll('.step');
            steps[1].classList.remove('step-primary');
            window.scrollTo(0,0);
        }
    }

    function goToReview() {
        const dayChecks = document.querySelectorAll('input[name="workDay"]:checked');
        const wStart = document.getElementById('f_workTimeStart').value;
        const wEnd = document.getElementById('f_workTimeEnd').value;
        const pc = document.getElementById('f_priceConsult').value.trim();
        const ph = document.getElementById('f_priceHourly').value.trim();
        const whyBoxes = document.querySelectorAll('input[name="chkWhy"]:checked');

        if(dayChecks.length === 0 || !wStart || !wEnd || !pc || !ph || selectedAreas.length === 0 || categoriesTags.length === 0) {
            Swal.fire({icon:'warning', title:'Required Fields', text:'Please fill all fields (Days, Hours, Pricing, Areas, Categories).', customClass: { confirmButton: 'btn btn-primary text-white' }, buttonsStyling: false});
            return;
        }

        if(offeredServicesTags.length === 0) {
            Swal.fire({icon:'warning', title:'No Services', text:'Add at least one offered service.', customClass: { confirmButton: 'btn btn-primary text-white' }, buttonsStyling: false});
            return;
        }

        // Save Part 2
        formCache.workDays = Array.from(dayChecks).map(chk => chk.value);
        formCache.workTimeStart = wStart;
        formCache.workTimeEnd = wEnd;
        formCache.priceConsult = pc;
        formCache.priceHourly = ph;
        formCache.areas = [...selectedAreas];
        formCache.offeredServices = [...offeredServicesTags];
        formCache.categories = [...categoriesTags];
        formCache.whyChooseUs = Array.from(whyBoxes).map(chk => chk.value);

        // Render Review
        const container = document.getElementById('main-container');
        container.innerHTML = '';
        container.appendChild(document.getElementById('tmpl-review').content.cloneNode(true));
        renderReviewContent();
        window.scrollTo(0,0);
    }

    function renderReviewContent() {
        const c = document.getElementById('review-content');
        const data = formCache;
        
        c.innerHTML = `
            <div class="space-y-6">
                <div>
                    <h3 class="text-xs font-bold uppercase tracking-widest opacity-40 mb-3">Business Information</h3>
                    <div class="space-y-4">
                        <div><p class="text-[10px] font-bold opacity-30 uppercase tracking-tighter">Entity Type</p><p class="font-bold text-lg">${data.type}</p></div>
                        <div><p class="text-[10px] font-bold opacity-30 uppercase tracking-tighter">Business Name</p><p class="font-bold text-lg">${data.businessName}</p></div>
                        <div><p class="text-[10px] font-bold opacity-30 uppercase tracking-tighter">Contact</p><p class="font-bold">${data.phone} | ${data.email}</p></div>
                        <div><p class="text-[10px] font-bold opacity-30 uppercase tracking-tighter mb-1">About</p><p class="text-sm bg-base-200 p-4 rounded-lg border border-base-300 italic">${data.about}</p></div>
                    </div>
                </div>
            </div>
            <div class="space-y-6">
                <div>
                    <h3 class="text-xs font-bold uppercase tracking-widest opacity-40 mb-3">Service Details</h3>
                    <div class="space-y-6">
                         <div><p class="text-[10px] font-bold opacity-30 uppercase tracking-tighter">Categories</p><div class="flex flex-wrap gap-2 mt-1">${data.categories.map(cat => `<span class="badge badge-primary text-white font-bold">${cat}</span>`).join('')}</div></div>
                         <div><p class="text-[10px] font-bold opacity-30 uppercase tracking-tighter">Areas</p><div class="flex flex-wrap gap-2 mt-1">${data.areas.map(a => `<span class="badge badge-outline font-bold border-base-300">${a}</span>`).join('')}</div></div>
                         <div><p class="text-[10px] font-bold opacity-30 uppercase tracking-tighter">Services</p><div class="flex flex-wrap gap-2 mt-1">${data.offeredServices.map(s => `<span class="badge badge-ghost font-bold border-base-300"># ${s}</span>`).join('')}</div></div>
                         <div><p class="text-[10px] font-bold opacity-30 uppercase tracking-tighter">Availability / Pricing</p><p class="font-bold mt-1">${data.workDays.join(', ')} (${data.workTimeStart}-${data.workTimeEnd})<br>৳ ${data.priceConsult} Consult / ৳ ${data.priceHourly} Hourly</p></div>
                    </div>
                </div>
            </div>
        `;
    }

    function goToFormFromReview() {
        renderForm();
        // Skip right to part 2 visually
        document.getElementById('form-part-1').classList.add('hidden');   
        document.getElementById('form-part-2').classList.remove('hidden');
        const steps = document.querySelectorAll('.step');
        steps[1].classList.add('step-primary');
        
    }

    function finalSubmit() {
        Swal.fire({
            title: 'Verified Listing Publishing',
            text: "You are about to publish a pre-verified provider. It will be live immediately.",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonText: 'Yes, Publish Live',
            customClass: { confirmButton: 'btn btn-success text-white ml-2', cancelButton: 'btn btn-ghost' },
            buttonsStyling: false,
            reverseButtons: true
        }).then((result) => {
            if (result.isConfirmed) {
                Swal.fire({
                    title: 'Published Successfully!',
                    text: 'The provider is now auto-verified and live on the website.',
                    icon: 'success',
                    customClass: { confirmButton: 'btn btn-primary text-white' },
                    buttonsStyling: false
                }).then(() => {
                    window.location.href = 'manage-providers.html';
                });
            }
        });
    }

</script>
</body>
</html>
