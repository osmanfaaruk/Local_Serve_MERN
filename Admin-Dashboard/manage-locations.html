<!DOCTYPE html>
<html lang="en" data-theme="sky">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Locations | Admin Modern</title>
    
    <link href="https://cdn.jsdelivr.net/npm/daisyui@3.1.0/dist/full.css" rel="stylesheet" type="text/css" /><script src="https://cdn.tailwindcss.com"></script><script>
        tailwind.config = {
            darkMode: 'class',
            daisyui: {
                themes: ['sky', 'light'],
                darkTheme: 'light'
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --p: 221 70% 41%; /* Dark Blue (blue-700 equivalent) */
            --pf: 221 70% 31%; /* Darker focus */
            --success: 142 76% 36%;
            --error: 0 84% 60%;
            --neutral: 0 0% 10%;
        }
        .btn-primary { background-color: hsl(var(--p)) !important; border-color: hsl(var(--p)) !important; color: white !important; }
        .btn-primary:hover { background-color: hsl(var(--pf)) !important; }
        .text-primary { color: hsl(var(--p)) !important; }
        
        /* Consistent Navbar */
        .navbar {
            background-color: rgba(255, 255, 255, 0.8) !important;
            backdrop-filter: blur(12px) !important;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1) !important;
            position: sticky !important;
            top: 0 !important;
            z-index: 50 !important;
        }
    </style>
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body class="min-h-screen bg-base-200">

    <div class="navbar bg-base-100 shadow-md px-4 md:px-20">
        <div class="flex-1">
            <a href="index.html" class="btn btn-ghost normal-case text-xl font-bold text-primary">LocalServe Admin</a>
        </div>
        <div class="flex-none"><a href="../User-Website/index.html" class="btn btn-ghost btn-sm">Website</a></div>
    </div>

    <div class="flex flex-col lg:flex-row max-w-[1600px] mx-auto">
        <!-- Sidebar (generated by js/sidebar.js) -->
        <aside id="admin-sidebar" class="w-full lg:w-72 bg-base-100 border-r border-base-300 p-6 space-y-2 lg:min-h-screen"></aside>
        <script src="js/sidebar.js"></script>

        <main class="flex-1 p-8">
            <div class="flex items-center justify-between mb-8">
                <h1 class="text-3xl font-extrabold">Service Locations</h1>
                <div class="join shadow-sm">
                    <input id="newLocationInput" class="input input-bordered join-item" placeholder="New Location Name" />
                    <button onclick="promptNewLocation()" class="btn btn-primary join-item text-white">+ Add</button>
                </div>
            </div>

            <div class="card bg-base-100 shadow-sm border border-base-300">
                <div class="overflow-x-auto">
                    <table class="table table-zebra font-medium">
                        <thead>
                            <tr class="bg-base-200">
                                <th>Location Name</th>
                                <th>Providers</th>
                                <th class="text-right">Manage</th>
                            </tr>
                        </thead>
                        <tbody id="locations-table-body">
                            <!-- Rows generated dynamically by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Shared SweetAlert2 Helpers -->
    <script src="js/swal-alerts.js"></script>

    <script>
        // ─── In-memory data store (loaded from JSON) ───
        let locations = [];
        let nextId = 1;

        // ─── Fetch data from JSON and render ───
        // FUTURE: Replace 'data/locations.json' with your API endpoint
        async function loadLocations() {
            try {
                const response = await fetch('data/locations.json');
                locations = await response.json();
                nextId = Math.max(...locations.map(l => l.id)) + 1;
                renderTable();
            } catch (error) {
                console.error('Failed to load locations:', error);
            }
        }

        // ─── Render table rows from in-memory array ───
        function renderTable() {
            const tbody = document.getElementById('locations-table-body');

            if (locations.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="3" class="text-center py-10 text-base-content/40">
                            <i class="fas fa-map-marker-alt text-4xl mb-3 block"></i>
                            <p class="font-bold text-lg">No locations found</p>
                            <p class="text-sm">Add your first location using the form above.</p>
                        </td>
                    </tr>`;
                return;
            }

            tbody.innerHTML = locations.map(loc => `
                <tr>
                    <td class="font-bold">${loc.name}</td>
                    <td class="font-bold text-primary">${loc.providers}</td>
                    <td class="text-right">
                        <button onclick="deleteLocation(${loc.id})" class="btn btn-ghost btn-xs text-error font-bold"><i class="fas fa-trash mr-1"></i> Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        // ─── ADD location ───
        function promptNewLocation() {
            confirmAdd('newLocationInput', 'Location', (name) => {
                // FUTURE: Replace with POST API call
                locations.push({
                    id: nextId++,
                    name: name,
                    providers: 0
                });
                renderTable();
            });
        }

        // ─── EDIT location ───
        function editLocation(id) {
            const loc = locations.find(l => l.id === id);
            if (!loc) return;

            confirmEdit(loc.name, 'Location', (newName) => {
                // FUTURE: Replace with PUT/PATCH API call
                loc.name = newName;
                renderTable();
            });
        }

        // ─── DELETE location ───
        function deleteLocation(id) {
            const loc = locations.find(l => l.id === id);
            if (!loc) return;

            confirmDelete(loc.name, 'Location', () => {
                // FUTURE: Replace with DELETE API call
                locations = locations.filter(l => l.id !== id);
                renderTable();
            });
        }

        // ─── Initialize on page load ───
        loadLocations();
    </script>
    <script>document.body.style.opacity = "1";</script>
</body>

</html>
