<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Locations | Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/daisyui@3.1.0/dist/full.css" rel="stylesheet" type="text/css" />
    <script>
        tailwind.config = {
            darkMode: 'class',
            daisyui: {
                themes: ['sky', 'light'],
                darkTheme: 'light'
            }
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="adminAuth.js"></script>
    <style>
        body, html { font-family: 'Inter', sans-serif !important; }
        :root {
            --p: 221 70% 41%;
            --pf: 221 70% 31%;
            --success: 142 76% 36%;
            --error: 0 84% 60%;
            --neutral: 0 0% 10%;
        }
        .btn-primary { background-color: hsl(var(--p)) !important; border-color: hsl(var(--p)) !important; color: white !important; }
        .btn-primary:hover { background-color: hsl(var(--pf)) !important; }
        .text-primary { color: hsl(var(--p)) !important; }
        
        .navbar {
            background-color: rgba(255, 255, 255, 0.8) !important;
            backdrop-filter: blur(12px) !important;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1) !important;
            position: sticky !important;
            top: 0 !important;
            z-index: 50 !important;
        }
        body { opacity: 0; transition: opacity 0.3s ease; }
    </style>
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <meta name="color-scheme" content="light">
    <style>
        body, html { font-family: 'Inter', sans-serif !important; }
        @media (prefers-color-scheme: dark) {
            :root { color-scheme: light !important; }
        }
        html { theme-transition: none; }
    </style>
</head>

<body class="min-h-screen bg-base-200">

    <!-- navbar section start -->
    <div class="navbar bg-base-100 shadow-md px-4 md:px-20">
        <div class="flex-1">
            <a href="index.html" class="btn btn-ghost normal-case text-xl font-bold text-primary">LocalServe Admin</a>
        </div>
        <div class="flex-none gap-2">
            <a href="/" class="btn btn-ghost btn-sm">Website</a>
            <button onclick="adminLogout()" class="btn btn-ghost btn-sm text-error font-bold">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </div>
    <!-- navbar section end -->

    <!-- sidebar and main section start -->
    <div class="flex flex-col lg:flex-row max-w-[1600px] mx-auto">
        <!-- sidebar section start -->
        <aside id="admin-sidebar" class="w-full lg:w-72 bg-base-100 border-r border-base-300 p-6 space-y-2 lg:min-h-screen">
            <div class="text-xs font-bold text-base-content/40 uppercase px-4 mb-4 mt-4">Main Menu</div>
            <a href="index.html" class="btn btn-ghost btn-md w-full justify-start gap-4 ">
                <i class="fas fa-chart-pie"></i> Dashboard
            </a>
            <a href="manage-providers.html" class="btn btn-ghost btn-md w-full justify-start gap-4 ">
                <i class="fas fa-users-cog"></i> Providers
            </a>
            <a href="add-provider.html" class="btn btn-ghost btn-md w-full justify-start gap-4 ">
                <i class="fas fa-user-plus"></i> Add Provider
            </a>
            <a href="manage-users.html" class="btn btn-ghost btn-md w-full justify-start gap-4 ">
                <i class="fas fa-users"></i> Users
            </a>
            <a href="manage-categories.html" class="btn btn-ghost btn-md w-full justify-start gap-4 ">
                <i class="fas fa-th-large"></i> Categories
            </a>
            <a href="manage-locations.html" class="btn btn-ghost btn-md w-full justify-start gap-4 bg-primary/10 text-primary font-bold">
                <i class="fas fa-map-marker-alt"></i> Locations
            </a>
            <div class="divider"></div>
            <div class="text-xs font-bold text-base-content/40 uppercase px-4 mb-4 mt-4">System</div>
            <a href="settings.html" class="btn btn-ghost btn-md w-full justify-start gap-4 ">
                <i class="fas fa-cog"></i> Settings
            </a>
        </aside>
        <!-- sidebar section end -->

        <!-- main content section start -->
        <main class="flex-1 p-8">
            <div class="flex items-center justify-between mb-8">
                <h1 class="text-3xl font-extrabold">Service Locations</h1>
                <div class="join shadow-sm">
                    <input id="newLocationInput" class="input input-bordered join-item" placeholder="Enter Area Name" />
                    <button onclick="promptNewLocation()" class="btn btn-primary join-item text-white">+ Add Area</button>
                </div>
            </div>

            <!-- locations table section start -->
            <div class="card bg-base-100 shadow-sm border border-base-300">
                <div class="overflow-x-auto">
                    <table class="table table-zebra font-medium">
                        <thead>
                            <tr class="bg-base-200">
                                <th>Location Name</th>
                                <th>Providers</th>
                                <th class="text-right">Manage</th>
                            </tr>
                        </thead>
                        <tbody id="locations-table-body">
                        </tbody>
                    </table>
                </div>
            </div>
            <!-- locations table section end -->
        </main>
        <!-- main content section end -->
    </div>
    <!-- sidebar and main section end -->

    <!-- scripts section start -->
    <script>
        const SWAL_STYLE = {
            confirm: 'btn btn-primary text-white mx-3',
            cancel: 'btn btn-error text-white mx-3',
            success: 'btn btn-success text-white',
            warning: 'btn btn-warning text-white mx-3',
            delete: 'btn btn-error text-white mx-3'
        };

        function confirmAdd(inputFieldId, type, onSuccess) {
            const inputField = document.getElementById(inputFieldId);
            const itemName = inputField.value.trim();

            if (!itemName) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Empty Field!',
                    text: `Please enter a ${type.toLowerCase()} name first!`,
                    customClass: { confirmButton: SWAL_STYLE.confirm },
                    buttonsStyling: false
                });
                return;
            }

            Swal.fire({
                title: 'Are you sure?',
                text: `Do you want to add "${itemName}"?`,
                icon: 'question',
                showCancelButton: true,
                customClass: { confirmButton: SWAL_STYLE.confirm, cancelButton: SWAL_STYLE.cancel },
                buttonsStyling: false,
                confirmButtonText: 'Yes, Add',
                cancelButtonText: 'Cancel'
            }).then((result) => {
                if (result.isConfirmed) {
                    if (onSuccess) onSuccess(itemName);
                    Swal.fire({
                        title: 'Added!',
                        text: `"${itemName}" has been added!`,
                        icon: 'success',
                        customClass: { confirmButton: SWAL_STYLE.success },
                        buttonsStyling: false
                    });
                    inputField.value = '';
                }
            });
        }

        function confirmDelete(itemName, type, onSuccess) {
            Swal.fire({
                title: `Delete ${type}?`,
                text: `Are you sure you want to delete "${itemName}"?`,
                icon: 'warning',
                showCancelButton: true,
                customClass: { confirmButton: SWAL_STYLE.delete, cancelButton: SWAL_STYLE.confirm },
                buttonsStyling: false,
                confirmButtonText: 'Yes, Delete',
                cancelButtonText: 'Cancel'
            }).then((result) => {
                if (result.isConfirmed) {
                    if (onSuccess) onSuccess();
                    Swal.fire({
                        title: 'Deleted!',
                        icon: 'success',
                        customClass: { confirmButton: SWAL_STYLE.success },
                        buttonsStyling: false
                    });
                }
            });
        }

        let locations = [];
        let providers = [];

        async function loadLocations() {
            try {
                const [locRes, provRes] = await Promise.all([
                    fetch('/api/locations'),
                    fetch('/api/providers')
                ]);
                locations = await locRes.json();
                providers = await provRes.json();
                renderTable();
            } catch (error) {
                console.error('Failed to load data:', error);
            }
        }

        function renderTable() {
            const tbody = document.getElementById('locations-table-body');

            if (locations.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="text-center py-10 opacity-40 italic">No locations found.</td></tr>`;
                return;
            }

            tbody.innerHTML = locations.map(loc => {
                const count = providers.filter(p => p.areas && p.areas.includes(loc.name)).length;
                return `
                    <tr>
                        <td class="font-bold">${loc.name}</td>
                        <td class="font-bold text-primary">${count}</td>
                        <td class="text-right">
                            <button onclick="deleteLocation('${loc._id}')" class="btn btn-ghost btn-xs text-error font-bold">
                                <i class="fas fa-trash mr-1"></i> Delete
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function promptNewLocation() {
            confirmAdd('newLocationInput', 'Location', async (name) => {
                try {
                    const res = await fetch('/api/locations', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: name })
                    });
                    if (res.ok) {
                        loadLocations();
                    }
                } catch (e) {
                    console.error(e);
                }
            });
        }

        function deleteLocation(id) {
            const loc = locations.find(l => l._id === id);
            if (!loc) return;
            confirmDelete(loc.name, 'Location', async () => {
                try {
                    const res = await fetch(`/api/locations/${id}`, {
                        method: 'DELETE'
                    });
                    if (res.ok) {
                        loadLocations();
                    }
                } catch (e) {
                    console.error(e);
                }
            });
        }

        window.onload = async () => {
            await requireAdminAuth();
            loadLocations();
            document.body.style.opacity = "1";
        };
    </script>
    <!-- scripts section end -->

</body>
</html>
