<!DOCTYPE html>
<html lang="en" data-theme="sky">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request to Serve | LocalServe</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@3.1.0/dist/full.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            daisyui: {
                themes: ['sky', 'light'],
                darkTheme: 'light'
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../assets/js/provider-form-core.js"></script>
    <style>
        [data-theme] {
            --p: 221 70% 41% !important; /* Dark Blue (blue-700) */
            --pf: 221 70% 31% !important;
            --pc: 0 0% 100% !important;
        }
        body { opacity: 0; transition: opacity 0.3s ease; color: #1a1a1a; }
        
        .text-primary { color: hsl(var(--p)) !important; }
        .btn-primary { background-color: hsl(var(--p)) !important; border-color: hsl(var(--p)) !important; color: white !important; }
        .btn-primary:hover { background-color: hsl(var(--pf)) !important; }
        .badge-primary { background-color: hsl(var(--p)) !important; border-color: hsl(var(--p)) !important; color: white !important; }
        
        .step-primary::before, .step-primary::after { background-color: hsl(var(--p)) !important; color: white !important; }

        /* Consistent Navbar */
        .navbar {
            background-color: rgba(255, 255, 255, 0.8) !important;
            backdrop-filter: blur(12px) !important;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1) !important;
            position: sticky !important;
            top: 0 !important;
            z-index: 50 !important;
        }

        #areaDropdown {
            border-radius: 0.75rem; border: 1px solid #e5e7eb; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }
        .dropdown-item { padding: 0.75rem 1rem; cursor: pointer; transition: background 0.2s; font-weight: 500; }
        .dropdown-item:hover { background: #f3f4f6; color: hsl(var(--p)); }
    </style>
</head>

<body class="min-h-screen bg-base-200">

    <!-- Navbar -->
    <div class="navbar bg-base-100/80 backdrop-blur-md sticky top-0 z-50 px-4 md:px-20 border-b border-base-200">
        <div class="navbar-start">
            <a href="index.html" class="btn btn-ghost normal-case text-2xl font-black text-primary tracking-tighter">LocalServe</a>
        </div>
        <div class="navbar-center hidden lg:flex">
            <ul class="menu menu-horizontal px-1 font-semibold gap-2">
                <li><a href="index.html">Home</a></li>
                <li><a href="search-providers.html">All Providers</a></li>
                <li><a href="request-to-serve.html" class="active">Become a Provider</a></li>
            </ul>
        </div>
        <div class="navbar-end">
                <button onclick="logout()" class="btn btn-ghost btn-xs text-error">Logout</button>
        </div>
    </div>

    <!-- Hero Header -->
    <div class="bg-base-100 border-b border-base-300 py-12">
        <div class="max-w-3xl mx-auto text-center px-4">
            <div class="w-20 h-20 rounded-full bg-primary/10 flex items-center justify-center mx-auto mb-6">
                <i class="fas fa-handshake text-primary text-3xl"></i>
            </div>
            <h1 class="text-4xl md:text-5xl font-extrabold mb-4">Want to be a <span class="text-primary italic">Service Provider?</span></h1>
            <p class="text-lg text-base-content/60 max-w-xl mx-auto">
                Join our growing network of trusted local professionals in Chittagong. 
            </p>
        </div>
    </div>

    <!-- Main Content Container -->
    <div class="max-w-4xl mx-auto px-4 py-8" id="main-container">
        <!-- Content will be injected by JavaScript -->
        <div class="flex justify-center p-12">
            <span class="loading loading-spinner text-primary loading-lg"></span>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer footer-center p-10 bg-base-100 text-base-content border-t border-base-300 mt-10">
        <div>
            <p class="font-bold text-lg">LocalServe</p>
            <p class="text-base-content/50">Chittagong's Trusted Local Service Directory</p>
        </div>
    </footer>

<!-- ========================================== -->
<!-- TEMPLATES (Hidden, used by JS)             -->
<!-- ========================================== -->

<!-- View: Authentication -->
<template id="tmpl-auth">
    <div class="card bg-base-100 shadow-xl border border-base-300 max-w-md mx-auto">
        <div class="card-body">
            <h2 class="card-title justify-center text-2xl font-bold mb-6">Login to Continue</h2>
            <div class="alert alert-info shadow-none bg-blue-50 text-blue-700 mb-6 text-sm">
                <i class="fas fa-info-circle mr-2"></i> For demo, use Username: <strong>Osman</strong>, Password: <strong>1</strong>
            </div>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div class="form-control">
                    <label class="label"><span class="label-text font-bold uppercase tracking-wider text-xs">Username</span></label>
                    <input type="text" id="loginUsername" class="input input-bordered w-full" required />
                </div>
                <div class="form-control">
                    <label class="label"><span class="label-text font-bold uppercase tracking-wider text-xs">Password</span></label>
                    <input type="password" id="loginPassword" class="input input-bordered w-full" required />
                </div>
                <button type="submit" class="btn btn-primary w-full text-white font-bold mt-4 shadow-lg">Login</button>
            </form>
            <div class="divider text-xs opacity-50">OR</div>
            <p class="text-center text-sm">Don't have an account? <a href="#" onclick="alert('Registration not implemented in this demo. Use Osman/1 to login.');" class="text-primary font-bold hover:underline">Register</a></p>
        </div>
    </div>
</template>

<!-- View: Provider Dashboard (Already Applied) -->
<template id="tmpl-dashboard">
    <div class="card bg-base-100 shadow-xl border border-base-300 overflow-hidden">
        <div class="bg-primary/10 p-8 text-center border-b border-base-300">
            <div class="avatar placeholder mb-4">
                <div class="bg-primary text-primary-content rounded-full w-24 outline outline-4 outline-base-100 shadow-sm">
                    <span class="text-3xl font-bold" id="dash-initial"></span>
                </div>
            </div>
            <h2 class="text-3xl font-extrabold" id="dash-company-name"></h2>
            <p class="opacity-70 mt-1 flex items-center justify-center gap-2">
                <i class="fas fa-tag"></i> <span id="dash-type"></span> &bull; <i class="fas fa-clock"></i> Status: <span class="badge badge-warning badge-sm font-bold">Under Review</span>
            </p>
        </div>
        <div class="card-body p-8">
            <div class="alert bg-base-200 border-none mb-6">
                <i class="fas fa-check-circle text-success text-2xl"></i>
                <div>
                    <h3 class="font-bold">Application Received</h3>
                    <div class="text-sm">Authority is currently reviewing your application. They will contact you within 2/3 business days.</div>
                </div>
            </div>
            
            <div class="flex flex-col sm:flex-row gap-4 justify-center mt-4">
                <button onclick="editApplication()" class="btn btn-outline btn-primary shadow-sm hover:shadow-md flex-1 sm:flex-none">
                    <i class="fas fa-edit"></i> Edit Information
                </button>
                <button onclick="terminateService()" class="btn btn-outline btn-error shadow-sm hover:shadow-md flex-1 sm:flex-none">
                    <i class="fas fa-trash-alt"></i> Service Termination
                </button>
            </div>
        </div>
    </div>
</template>

<!-- View: Apply Gateway -->
<template id="tmpl-apply-gateway">
    <div class="text-center py-12">
        <div class="mb-8">
            <i class="fas fa-clipboard-list text-6xl text-base-content/20"></i>
        </div>
        <h2 class="text-2xl font-bold mb-4">Start Your Application</h2>
        <p class="text-base-content/60 max-w-md mx-auto mb-8">
            You haven't submitted a provider profile yet. Create one now to start receiving requests from local customers.
        </p>
        <button onclick="startApplication()" class="btn btn-primary btn-lg text-white shadow-xl hover:-translate-y-1 transition-transform">
            Apply to Become a Service Provider <i class="fas fa-arrow-right ml-2"></i>
        </button>
    </div>
</template>

<!-- View: Application Form -->
<template id="tmpl-form">
    <div class="card bg-base-100 shadow-xl border border-base-300">
        <div class="card-body p-6 md:p-10">
            <!-- Progress Steps -->
            <ul class="steps steps-horizontal w-full mb-10 text-sm font-bold opacity-80 overflow-hidden">
                <li class="step step-primary">Company Info</li>
                <li class="step">Services</li>
                <li class="step">Review</li>
            </ul>

            <form id="providerForm" onsubmit="handleFormNext(event)" class="space-y-8">
                <!-- PART 1: Company Information -->
                <div id="form-part-1">
                    <h2 class="text-xl font-extrabold mb-1 flex items-center gap-2 border-b pb-2 mb-6">
                        <i class="fas fa-building text-primary"></i> Company Information
                    </h2>
                    
                    <div class="form-control mb-6">
                        <label class="label"><span class="label-text font-bold uppercase tracking-wider text-xs">Provider Type <span class="text-error">*</span></span></label>
                        <div class="flex gap-4">
                            <label class="label cursor-pointer justify-start gap-2 bg-base-200 px-4 py-2 rounded-lg border border-base-300 flex-1 hover:border-primary/50 transition-colors">
                                <input type="radio" name="providerType" value="Company" class="radio radio-primary radio-sm" checked />
                                <span class="label-text font-semibold">Company</span>
                            </label>
                            <label class="label cursor-pointer justify-start gap-2 bg-base-200 px-4 py-2 rounded-lg border border-base-300 flex-1 hover:border-primary/50 transition-colors">
                                <input type="radio" name="providerType" value="Self Provider" class="radio radio-primary radio-sm" />
                                <span class="label-text font-semibold">Self Provider (Individual)</span>
                            </label>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                        <div class="form-control md:col-span-2">
                            <label class="label"><span class="label-text font-bold uppercase tracking-wider text-xs">Business / Provider Name <span class="text-error">*</span></span></label>
                            <input type="text" id="f_businessName" class="input input-bordered w-full focus:outline-primary" required />
                        </div>
                        <div class="form-control">
                            <label class="label"><span class="label-text font-bold uppercase tracking-wider text-xs">Contact Number <span class="text-error">*</span></span></label>
                            <input type="tel" id="f_phone" class="input input-bordered w-full focus:outline-primary" required />
                        </div>
                        <div class="form-control">
                            <label class="label"><span class="label-text font-bold uppercase tracking-wider text-xs">Email Address <span class="text-error">*</span></span></label>
                            <input type="email" id="f_email" class="input input-bordered w-full focus:outline-primary" required />
                        </div>
                    </div>

                    <div class="form-control">
                        <label class="label">
                            <span class="label-text font-bold uppercase tracking-wider text-xs">About The Provider <span class="text-error">*</span></span>
                            <span class="label-text-alt text-xs opacity-70" id="wordCountLabel">0 / 300 characters</span>
                        </label>
                        <textarea id="f_about" class="textarea textarea-bordered h-32 focus:outline-primary" placeholder="Write a short bio or company description..." required oninput="updateCharCount('f_about', 'wordCountLabel', 300)"></textarea>
                    </div>

                    <div class="flex justify-end mt-8">
                        <button type="button" onclick="goToStep(2)" class="btn btn-primary text-white font-bold px-8">Next Step <i class="fas fa-arrow-right ml-2"></i></button>
                    </div>
                </div>

                <!-- PART 2: Services Information (Hidden initially) -->
                <div id="form-part-2" class="hidden">
                    <h2 class="text-xl font-extrabold mb-1 flex items-center gap-2 border-b pb-2 mb-6">
                        <i class="fas fa-tools text-primary"></i> Services Information
                    </h2>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-6">
                        <!-- Working Hours (Improved UX) -->
                        <div class="form-control col-span-1 md:col-span-2">
                            <label class="label"><span class="label-text font-bold uppercase tracking-wider text-xs">Working Days <span class="text-error">*</span></span></label>
                            <div class="flex flex-wrap gap-2 mb-4" id="workDayPicker">
                                <label class="cursor-pointer">
                                    <input type="checkbox" name="workDay" value="Sat" class="peer sr-only" />
                                    <span class="badge badge-lg py-4 px-4 font-bold border-base-300 bg-base-200 text-base-content/40 peer-checked:bg-blue-700 peer-checked:text-white peer-checked:border-blue-700 transition-all hover:bg-base-300">Sat</span>
                                </label>
                                <label class="cursor-pointer">
                                    <input type="checkbox" name="workDay" value="Sun" class="peer sr-only" />
                                    <span class="badge badge-lg py-4 px-4 font-bold border-base-300 bg-base-200 text-base-content/40 peer-checked:bg-blue-700 peer-checked:text-white peer-checked:border-blue-700 transition-all hover:bg-base-300">Sun</span>
                                </label>
                                <label class="cursor-pointer">
                                    <input type="checkbox" name="workDay" value="Mon" class="peer sr-only" />
                                    <span class="badge badge-lg py-4 px-4 font-bold border-base-300 bg-base-200 text-base-content/40 peer-checked:bg-blue-700 peer-checked:text-white peer-checked:border-blue-700 transition-all hover:bg-base-300">Mon</span>
                                </label>
                                <label class="cursor-pointer">
                                    <input type="checkbox" name="workDay" value="Tue" class="peer sr-only" />
                                    <span class="badge badge-lg py-4 px-4 font-bold border-base-300 bg-base-200 text-base-content/40 peer-checked:bg-blue-700 peer-checked:text-white peer-checked:border-blue-700 transition-all hover:bg-base-300">Tue</span>
                                </label>
                                <label class="cursor-pointer">
                                    <input type="checkbox" name="workDay" value="Wed" class="peer sr-only" />
                                    <span class="badge badge-lg py-4 px-4 font-bold border-base-300 bg-base-200 text-base-content/40 peer-checked:bg-blue-700 peer-checked:text-white peer-checked:border-blue-700 transition-all hover:bg-base-300">Wed</span>
                                </label>
                                <label class="cursor-pointer">
                                    <input type="checkbox" name="workDay" value="Thu" class="peer sr-only" />
                                    <span class="badge badge-lg py-4 px-4 font-bold border-base-300 bg-base-200 text-base-content/40 peer-checked:bg-blue-700 peer-checked:text-white peer-checked:border-blue-700 transition-all hover:bg-base-300">Thu</span>
                                </label>
                                <label class="cursor-pointer">
                                    <input type="checkbox" name="workDay" value="Fri" class="peer sr-only" />
                                    <span class="badge badge-lg py-4 px-4 font-bold border-base-300 bg-base-200 text-base-content/40 peer-checked:bg-blue-700 peer-checked:text-white peer-checked:border-blue-700 transition-all hover:bg-base-300">Fri</span>
                                </label>
                            </div>

                            <label class="label"><span class="label-text font-bold uppercase tracking-wider text-xs">Working Hours <span class="text-error">*</span></span></label>
                            <div class="flex items-center gap-3">
                                <div class="relative flex-1">
                                    <span class="absolute left-3 top-1/2 -translate-y-1/2 text-xs opacity-50 font-bold uppercase">From</span>
                                    <input type="time" id="f_workTimeStart" class="input input-bordered w-full pl-16 focus:outline-primary" required />
                                </div>
                                <span class="font-bold opacity-30">TO</span>
                                <div class="relative flex-1">
                                    <span class="absolute left-3 top-1/2 -translate-y-1/2 text-xs opacity-50 font-bold uppercase">To</span>
                                    <input type="time" id="f_workTimeEnd" class="input input-bordered w-full pl-10 focus:outline-primary" required />
                                </div>
                            </div>
                        </div>

                        <!-- Pricing Guide -->
                        <div class="form-control">
                            <label class="label"><span class="label-text font-bold uppercase tracking-wider text-xs">Pricing - Consultation Fee (৳) <span class="text-error">*</span></span></label>
                            <input type="text" id="f_priceConsult" placeholder="e.g. Free, 500, 1000-2000" class="input input-bordered w-full focus:outline-primary" required />
                        </div>
                        <div class="form-control">
                            <label class="label"><span class="label-text font-bold uppercase tracking-wider text-xs">Pricing - Hourly Labor Fee (৳) <span class="text-error">*</span></span></label>
                            <input type="text" id="f_priceHourly" placeholder="e.g. 500-1000 per hour" class="input input-bordered w-full focus:outline-primary" required />
                        </div>

                        <!-- Service Areas (Searchable Dropdown) -->
                        <div class="form-control md:col-span-2 relative" id="areaSearchSection">
                            <label class="label"><span class="label-text font-bold uppercase tracking-wider text-xs">Service Areas <span class="text-error">*</span></span></label>
                            
                            <div class="join w-full mb-3 shadow-sm">
                                <span class="join-item flex items-center px-4 bg-base-200 border border-base-300 border-r-0"><i class="fas fa-search opacity-50"></i></span>
                                <input type="text" id="areaSearchInput" class="input input-bordered join-item w-full focus:outline-primary border-l-0" placeholder="Type to search locations (e.g. Halishahar)..." autocomplete="off" />
                                <button type="button" class="btn btn-primary join-item text-white" onclick="toggleAreaDropdown()"><i class="fas fa-chevron-down"></i></button>
                            </div>

                            <!-- Dropdown List -->
                            <div id="areaDropdown" class="absolute top-[85px] left-0 w-full bg-base-100 border border-base-300 rounded-lg z-[60] hidden">
                                <!-- Area items will be injected here -->
                            </div>

                            <!-- Selected Areas Tags -->
                            <div class="bg-base-200/50 p-4 rounded-xl border border-base-300 flex flex-wrap gap-2 min-h-[4rem] mt-2" id="selectedAreasContainer">
                                <span class="text-xs opacity-50 italic py-1 px-1">No areas selected yet. Click search bar to see options.</span>
                            </div>
                            
                            <label class="label"><span class="label-text-alt opacity-70">Search and select all areas where you can provide service.</span></label>
                        </div>

                        <!-- Categories (Searchable Dropdown) - UPGRADED -->
                        <div class="form-control md:col-span-2 relative" id="categorySearchSection">
                            <label class="label"><span class="label-text font-bold uppercase tracking-wider text-xs">Categories <span class="text-error">*</span></span></label>
                            
                            <div class="join w-full mb-3 shadow-sm">
                                <span class="join-item flex items-center px-4 bg-base-200 border border-base-300 border-r-0"><i class="fas fa-search opacity-50"></i></span>
                                <input type="text" id="categorySearchInput" class="input input-bordered join-item w-full focus:outline-primary border-l-0" placeholder="Search and select categories (e.g. Plumbing)..." autocomplete="off" />
                                <button type="button" class="btn btn-primary join-item text-white" onclick="toggleCategoryDropdown()"><i class="fas fa-chevron-down"></i></button>
                            </div>

                            <!-- Dropdown List -->
                            <div id="categoryDropdown" class="absolute top-[85px] left-0 w-full bg-base-100 border border-base-300 rounded-lg z-[60] hidden">
                                <!-- Category items will be injected here -->
                            </div>

                            <!-- Selected Categories Tags -->
                            <div class="bg-base-200/50 p-4 rounded-xl border border-base-300 flex flex-wrap gap-2 min-h-[4rem] mt-2" id="categoryTagContainer">
                                <span class="text-xs opacity-50 italic py-1 px-1">No categories selected yet. Click search bar to see options.</span>
                            </div>
                            
                            <label class="label"><span class="label-text-alt opacity-70">Search and select all categories that describe your business.</span></label>
                        </div>

                        <!-- Offered Services Tags -->
                        <div class="form-control md:col-span-2">
                            <label class="label">
                                <span class="label-text font-bold uppercase tracking-wider text-xs">Offered Services <span class="text-error">*</span></span>
                                <span class="label-text-alt opacity-70">Max 6 words per service</span>
                            </label>
                            <div class="join w-full mb-3">
                                <input type="text" id="tagInput" class="input input-bordered join-item w-full focus:outline-primary" placeholder="Type a service and press Add or comma (,)..." />
                                <button type="button" class="btn btn-primary join-item text-white" onclick="processTagInput()"><i class="fas fa-plus"></i> Add</button>
                            </div>
                            <div class="bg-base-200/50 p-4 rounded-xl border border-base-300 flex flex-wrap gap-2 min-h-[4rem] mt-1" id="tagContainer">
                                <span class="text-sm opacity-50 italic py-2">No services added yet.</span>
                            </div>
                            <label class="label"><span class="label-text-alt text-error hidden" id="tagError">Service name cannot exceed 6 words.</span></label>
                        </div>
                        
                        <!-- Why Choose Us -->
                        <div class="form-control md:col-span-2">
                            <label class="label"><span class="label-text font-bold uppercase tracking-wider text-xs">Why Choose Us (Select multiple) <span class="text-error">*</span></span></label>
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-3" id="whyChooseUsContainer">
                                <label class="cursor-pointer label justify-start gap-3 bg-base-200 rounded-lg px-3 py-2 border border-base-300 hover:border-primary/40">
                                    <input type="checkbox" name="chkWhy" value="Professional Grade" class="checkbox checkbox-primary checkbox-sm" />
                                    <span class="label-text text-sm font-medium">Professional Grade</span>
                                </label>
                                <label class="cursor-pointer label justify-start gap-3 bg-base-200 rounded-lg px-3 py-2 border border-base-300 hover:border-primary/40">
                                    <input type="checkbox" name="chkWhy" value="Fixed Pricing" class="checkbox checkbox-primary checkbox-sm" />
                                    <span class="label-text text-sm font-medium">Fixed Pricing</span>
                                </label>
                                <label class="cursor-pointer label justify-start gap-3 bg-base-200 rounded-lg px-3 py-2 border border-base-300 hover:border-primary/40">
                                    <input type="checkbox" name="chkWhy" value="Guaranteed Quality" class="checkbox checkbox-primary checkbox-sm" />
                                    <span class="label-text text-sm font-medium">Guaranteed Quality</span>
                                </label>
                                <label class="cursor-pointer label justify-start gap-3 bg-base-200 rounded-lg px-3 py-2 border border-base-300 hover:border-primary/40">
                                    <input type="checkbox" name="chkWhy" value="Fast Response" class="checkbox checkbox-primary checkbox-sm" />
                                    <span class="label-text text-sm font-medium">Fast Response</span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="flex justify-between mt-8">
                        <button type="button" onclick="goToStep(1)" class="btn btn-ghost font-bold"><i class="fas fa-arrow-left mr-2"></i> Back</button>
                        <button type="button" onclick="goToReview()" class="btn btn-primary text-white font-bold px-8">Review Application</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</template>

<!-- View: Review Application -->
<template id="tmpl-review">
    <div class="card bg-base-100 shadow-xl border border-base-300">
        <div class="card-body p-6 md:p-10">
            <ul class="steps steps-horizontal w-full mb-10 text-xs font-bold opacity-50">
                <li class="step step-primary">Company Info</li>
                <li class="step step-primary">Services</li>
                <li class="step step-primary">Review</li>
            </ul>

            <h2 class="text-2xl font-black text-center mb-10">Review Your Profile</h2>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-12" id="review-content">
                <!-- Data injected here -->
            </div>

            <div class="mt-12 pt-8 border-t flex flex-col md:flex-row gap-4 justify-between items-center">
                <button onclick="goToFormFromReview()" class="btn btn-ghost font-bold text-xs uppercase tracking-widest"><i class="fas fa-edit mr-2"></i> Edit Application</button>
                <button onclick="finalSubmit()" class="btn btn-primary px-12 font-bold shadow-lg">Submit for Approval <i class="fas fa-paper-plane ml-2"></i></button>
            </div>
        </div>
    </div>
</template>

<!-- ========================================== -->
<!-- SCRIPTS                                    -->
<!-- ========================================== -->
<script src="../assets/js/provider-form-core.js"></script>
<script>
    // State
    const DEMO_USER = "Osman";
    const DEMO_PASS = "1";
    let currentUser = null; 
    let providerData = null; 
    let offeredServicesTags = [];
    let categoriesTags = []; // NEW: Categories state
    let selectedAreas = []; // CRITICAL: Added missing global
    
    // TEMPORARY FORM CACHE
    let formCache = {};

    // Initialization
    window.onload = () => {
        // Load state from local storage simulating a DB
        loadState();
        renderRouter();
        document.body.style.opacity = "1";
    };

    function loadState() {
        const storedUser = localStorage.getItem('ls_currentUser');
        if (storedUser) currentUser = JSON.parse(storedUser);
        
        const storedData = localStorage.getItem('ls_providerData');
        if (storedData) providerData = JSON.parse(storedData);
        
        updateNav();
    }

    function saveState() {
        if (currentUser) localStorage.setItem('ls_currentUser', JSON.stringify(currentUser));
        else localStorage.removeItem('ls_currentUser');
        
        if (providerData) localStorage.setItem('ls_providerData', JSON.stringify(providerData));
        else localStorage.removeItem('ls_providerData');
        
        updateNav();
    }

    function updateNav() {
        const navUserInfo = document.getElementById('nav-user-info');
        const navUsername = document.getElementById('nav-username');
        if(currentUser) {
            if (navUsername) navUsername.innerText = currentUser.username;
            if (navUserInfo) {
                navUserInfo.classList.remove('hidden');
                navUserInfo.classList.add('flex');
            }
        } else {
            if (navUserInfo) {
                navUserInfo.classList.add('hidden');
                navUserInfo.classList.remove('flex');
            }
        }
    }

    // Router Logic
    function renderRouter() {
        const container = document.getElementById('main-container');
        container.innerHTML = '';
        
        if (!currentUser) {
            container.appendChild(document.getElementById('tmpl-auth').content.cloneNode(true));
        } else {
            if (providerData) {
                container.appendChild(document.getElementById('tmpl-dashboard').content.cloneNode(true));
                hydrateDashboard();
            } else {
                // BUG FIX: Check for active draft and restore form automatically if exists
                try {
                    if (localStorage.getItem('ls_formDraft')) {
                        startApplication();
                    } else {
                        const gatewayTmpl = document.getElementById('tmpl-apply-gateway');
                        if (gatewayTmpl) {
                            container.appendChild(gatewayTmpl.content.cloneNode(true));
                        }
                    }
                } catch (err) {
                    console.error("Router error:", err);
                }
            }
        }
    }

    // Auth Actions
    function handleLogin(e) {
        e.preventDefault();
        const u = document.getElementById('loginUsername').value;
        const p = document.getElementById('loginPassword').value;
        if (u === DEMO_USER && p === DEMO_PASS) {
            currentUser = { username: u };
            saveState();
            renderRouter();
        } else {
            Swal.fire({icon: 'error', title: 'Login Failed', text: 'Invalid credentials. Use Osman / 1.', customClass: { confirmButton: 'btn btn-primary text-white' }, buttonsStyling: false});
        }
    }

    function logout() {
        currentUser = null;
        saveState();
        renderRouter();
    }

    // Dashboard Actions
    function hydrateDashboard() {
        if(!providerData) return;
        document.getElementById('dash-company-name').innerText = providerData.businessName;
        document.getElementById('dash-type').innerText = providerData.type;
        document.getElementById('dash-initial').innerText = providerData.businessName.charAt(0).toUpperCase();
    }

    function startApplication() {
        const draft = localStorage.getItem('ls_formDraft');
        if (draft) {
            formCache = JSON.parse(draft);
            offeredServicesTags = formCache.offeredServices || [];
            categoriesTags = formCache.categories || [];
            selectedAreas = formCache.areas || [];
        } else {
            formCache = {}; 
            offeredServicesTags = [];
            categoriesTags = [];
            selectedAreas = [];
        }
        renderForm();
    }

    function editApplication() {
        formCache = {...providerData}; 
        offeredServicesTags = [...(providerData.offeredServices || [])];
        categoriesTags = [...(providerData.categories || [])];
        selectedAreas = [...(providerData.areas || [])];
        renderForm();
    }

    function terminateService() {
        Swal.fire({
            title: 'Terminate Service?',
            text: "Are you sure you want to stop providing services? This will remove your listing.",
            icon: 'warning',
            input: 'textarea',
            inputLabel: 'Reason for deletion (Optional)',
            inputPlaceholder: 'Tell us why you are leaving...',
            showCancelButton: true,
            confirmButtonText: 'Yes, Terminate',
            customClass: { confirmButton: 'btn btn-error text-white ml-2', cancelButton: 'btn btn-ghost' },
            buttonsStyling: false,
            reverseButtons: true
        }).then((result) => {
            if (result.isConfirmed) {
                providerData = null;
                saveState();
                Swal.fire({
                    title:'Terminated!',
                    text: 'Your service provider account has been deleted.',
                    icon: 'success',
                    customClass: { confirmButton: 'btn btn-primary text-white' },
                    buttonsStyling: false
                }).then(()=>{
                    renderRouter();
                });
            }
        });
    }

    // Form Logic
    function saveDraft() {
        const p1 = document.getElementById('form-part-1');
        const p2 = document.getElementById('form-part-2');
        if (!p1 && !p2) return; 

        const draft = { ...formCache };
        if (p2 && !p2.classList.contains('hidden')) draft.currentStep = 2;
        else draft.currentStep = 1;

        const typeEl = document.querySelector('input[name="providerType"]:checked');
        if(typeEl) draft.type = typeEl.value;
        ['businessName', 'phone', 'email', 'about', 'priceConsult', 'priceHourly', 'workTimeStart', 'workTimeEnd'].forEach(id => {
            const el = document.getElementById('f_' + id);
            if(el) draft[id] = el.value;
        });
        
        const dayChecks = document.querySelectorAll('input[name="workDay"]:checked');
        draft.workDays = Array.from(dayChecks).map(chk => chk.value);
        
        draft.areas = [...selectedAreas];
        draft.categories = [...categoriesTags];
        draft.offeredServices = [...offeredServicesTags];
        
        const whyBoxes = document.querySelectorAll('input[name="chkWhy"]:checked');
        draft.whyChooseUs = Array.from(whyBoxes).map(chk => chk.value);

        localStorage.setItem('ls_formDraft', JSON.stringify(draft));
        formCache = draft;
    }

    // Auto-save listeners
    document.addEventListener('input', (e) => {
        if(e.target.closest('#main-container')) saveDraft();
    });
    document.addEventListener('change', (e) => {
        if(e.target.closest('#main-container')) saveDraft();
    });

    function renderForm() {
        const container = document.getElementById('main-container');
        if (!container) return;
        container.innerHTML = '';
        container.appendChild(document.getElementById('tmpl-form').content.cloneNode(true));
        
        setupTagInput();
        setupAreaSearch();
        setupCategorySearch();
        
        if(formCache && Object.keys(formCache).length > 0) {
            try {
                const typeRadios = document.querySelectorAll('input[name="providerType"]');
                typeRadios.forEach(r => { if(r.value === formCache.type) r.checked = true; });
                
                ['businessName', 'phone', 'email', 'about', 'priceConsult', 'priceHourly', 'workTimeStart', 'workTimeEnd'].forEach(id => {
                    const el = document.getElementById('f_' + id);
                    if(el) el.value = formCache[id] || '';
                });

                if(document.getElementById('f_about')) updateCharCount('f_about', 'wordCountLabel', 300);

                const dayChecks = document.querySelectorAll('input[name="workDay"]');
                dayChecks.forEach(chk => { if(formCache.workDays) chk.checked = formCache.workDays.includes(chk.value); });
                    
                selectedAreas = [...(formCache.areas || [])];
                refreshAreaSelection();

                categoriesTags = [...(formCache.categories || [])];
                refreshCategoryTags();

                const checkboxes = document.querySelectorAll('input[name="chkWhy"]');
                checkboxes.forEach(chk => { if(formCache.whyChooseUs) chk.checked = formCache.whyChooseUs.includes(chk.value); });
                
                refreshTags();
            } catch (err) { console.warn("Pre-fill error:", err); }
        }

        if (formCache && formCache.currentStep === 2) {
            document.getElementById('form-part-1').classList.add('hidden');
            document.getElementById('form-part-2').classList.remove('hidden');
            const steps = document.querySelectorAll('.step');
            if(steps[1]) steps[1].classList.add('step-primary');
        }
    }

    // Navigation and Logic blocks are in provider-form-core.js (Tag Input, Area Search)
    

    // Shared logic handled by provider-form-core.js

    // Shared logic handled by provider-form-core.js
    

    // Form Navigation & Validation
    function goToStep(step) {
        if(step === 2) {
            // Validate Part 1
            const biz = document.getElementById('f_businessName').value.trim();
            const phone = document.getElementById('f_phone').value.trim();
            const email = document.getElementById('f_email').value.trim();
            const about = document.getElementById('f_about').value.trim();
            const aboutWordCount = about ? about.length : 0;

            if(!biz || !phone || !email || !about) {
                Swal.fire({icon:'warning', title:'Required Fields', text:'Please fill all required fields.', customClass: { confirmButton: 'btn btn-primary text-white' }, buttonsStyling: false});
                return;
            }
            if(aboutWordCount > 300) {
                 Swal.fire({icon:'warning', title:'Limit Exceeded', text:'About section cannot exceed 300 characters.', customClass: { confirmButton: 'btn btn-primary text-white' }, buttonsStyling: false});
                 return;
            }

            // Save Part 1 to cache
            formCache.type = document.querySelector('input[name="providerType"]:checked').value;
            formCache.businessName = biz;
            formCache.phone = phone;
            formCache.email = email;
            formCache.about = about;

            document.getElementById('form-part-1').classList.add('hidden');
            document.getElementById('form-part-2').classList.remove('hidden');
            
            // update steps visual
            const steps = document.querySelectorAll('.step');
            steps[1].classList.add('step-primary');
            saveDraft();
            window.scrollTo(0,0);
        } else if (step === 1) {
            document.getElementById('form-part-2').classList.add('hidden');
            document.getElementById('form-part-1').classList.remove('hidden');
            const steps = document.querySelectorAll('.step');
            steps[1].classList.remove('step-primary');
            saveDraft();
            window.scrollTo(0,0);
        }
    }

    function goToReview() {
        const dayChecks = document.querySelectorAll('input[name="workDay"]:checked');
        const wStart = document.getElementById('f_workTimeStart').value;
        const wEnd = document.getElementById('f_workTimeEnd').value;
        const pc = document.getElementById('f_priceConsult').value.trim();
        const ph = document.getElementById('f_priceHourly').value.trim();
        const whyBoxes = document.querySelectorAll('input[name="chkWhy"]:checked');

        if(dayChecks.length === 0 || !wStart || !wEnd || !pc || !ph || selectedAreas.length === 0 || categoriesTags.length === 0) {
            Swal.fire({icon:'warning', title:'Required Fields', text:'Please select Days, Hours, Pricing, Areas, and Categories.', customClass: { confirmButton: 'btn btn-primary text-white' }, buttonsStyling: false});
            return;
        }

        if(offeredServicesTags.length === 0) {
            Swal.fire({icon:'warning', title:'No Services Added', text:'Please add at least one offered service.', customClass: { confirmButton: 'btn btn-primary text-white' }, buttonsStyling: false});
            return;
        }

        saveDraft();
        const container = document.getElementById('main-container');
        container.innerHTML = '';
        container.appendChild(document.getElementById('tmpl-review').content.cloneNode(true));
        renderReviewContent();
        window.scrollTo(0,0);
    }

    function renderReviewContent() {
        const c = document.getElementById('review-content');
        const data = formCache;
        
        c.innerHTML = `
            <div class="space-y-6">
                <div>
                    <h3 class="text-xs font-bold uppercase tracking-widest opacity-40 mb-3">Business Information</h3>
                    <div class="space-y-4">
                        <div><p class="text-[10px] font-bold opacity-30 uppercase tracking-tighter">Entity Type</p><p class="font-bold text-lg">${data.type}</p></div>
                        <div><p class="text-[10px] font-bold opacity-30 uppercase tracking-tighter">Business Name</p><p class="font-bold text-lg">${data.businessName}</p></div>
                        <div><p class="text-[10px] font-bold opacity-30 uppercase tracking-tighter">Contact</p><p class="font-bold">${data.phone} | ${data.email}</p></div>
                        <div><p class="text-[10px] font-bold opacity-30 uppercase tracking-tighter mb-1">About</p><p class="text-sm bg-base-200 p-4 rounded-lg border border-base-300 italic">${data.about}</p></div>
                    </div>
                </div>
            </div>
            <div class="space-y-6">
                <div>
                    <h3 class="text-xs font-bold uppercase tracking-widest opacity-40 mb-3">Service Details</h3>
                    <div class="space-y-6">
                         <div><p class="text-[10px] font-bold opacity-30 uppercase tracking-tighter">Categories</p><div class="flex flex-wrap gap-2 mt-1">${data.categories.map(cat => `<span class="badge badge-primary text-white font-bold">${cat}</span>`).join('')}</div></div>
                         <div><p class="text-[10px] font-bold opacity-30 uppercase tracking-tighter">Areas</p><div class="flex flex-wrap gap-2 mt-1">${data.areas.map(a => `<span class="badge badge-outline font-bold border-base-300">${a}</span>`).join('')}</div></div>
                         <div><p class="text-[10px] font-bold opacity-30 uppercase tracking-tighter">Services</p><div class="flex flex-wrap gap-2 mt-1">${data.offeredServices.map(s => `<span class="badge badge-ghost font-bold border-base-300"># ${s}</span>`).join('')}</div></div>
                         <div><p class="text-[10px] font-bold opacity-30 uppercase tracking-tighter">Availability / Pricing</p><p class="font-bold mt-1">${data.workDays.join(', ')} (${data.workTimeStart}-${data.workTimeEnd})<br>৳ ${data.priceConsult} Consult / ৳ ${data.priceHourly} Hourly</p></div>
                    </div>
                </div>
            </div>
        `;
    }

    function goToFormFromReview() {
        renderForm();
        // Skip right to part 2 visually
        document.getElementById('form-part-1').classList.add('hidden');
        document.getElementById('form-part-2').classList.remove('hidden');
        const steps = document.querySelectorAll('.step');
        steps[1].classList.add('step-primary');
    }

    function finalSubmit() {
        Swal.fire({
            title: 'Confirm Submission',
            text: "Are you sure you want to submit this application?",
            icon: 'question',
            showCancelButton: true,
            confirmButtonText: 'Yes, Submit',
            customClass: { confirmButton: 'btn btn-success text-white ml-2', cancelButton: 'btn btn-ghost' },
            buttonsStyling: false,
            reverseButtons: true
        }).then((result) => {
            if (result.isConfirmed) {
                // Save data to mock DB
                providerData = {...formCache};
                localStorage.removeItem('ls_formDraft'); // Clear the ongoing draft
                saveState();

                Swal.fire({
                    title: 'Application Received!',
                    text: 'Authority will review your submitted form and contact you in 2/3 business days.',
                    icon: 'success',
                    customClass: { confirmButton: 'btn btn-primary text-white' },
                    buttonsStyling: false
                }).then(() => {
                    renderRouter();
                });
            }
        });
    }

</script>
    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>
    <script src="js/footer-loader.js"></script>
</body>
</html>
