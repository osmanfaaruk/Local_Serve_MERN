<script>


function updateCharCount(inputId, labelId, maxChars = 300) {
    const input = document.getElementById(inputId);
    if (!input) return;
    const charCount = input.value.length;
    const label = document.getElementById(labelId);
    if (label) {
        label.innerText = `${charCount} / ${maxChars} characters`;
        if (charCount > maxChars) label.classList.add('text-error', 'font-bold');
        else label.classList.remove('text-error', 'font-bold');
    }
}
function setupAreaSearch() {
    const input = document.getElementById('areaSearchInput');
    const dropdown = document.getElementById('areaDropdown');
    const section = document.getElementById('areaSearchSection');
    if(!input || !dropdown || !section) return;
    input.onfocus = () => renderAreaDropdown(input.value);
    input.oninput = () => renderAreaDropdown(input.value);
    if (!window._hasAreaSearchListener) {
        document.addEventListener('click', (e) => {
            const d = document.getElementById('areaDropdown');
            const s = document.getElementById('areaSearchSection');
            if (d && s && !s.contains(e.target)) d.classList.add('hidden');
        });
        window._hasAreaSearchListener = true;
    }
}
function toggleAreaDropdown() { const d = document.getElementById('areaDropdown'); if (d) d.classList.toggle('hidden'); }
function renderAreaDropdown(query = '') {
    const dropdown = document.getElementById('areaDropdown'); if (!dropdown) return;
    dropdown.innerHTML = '';
    const filtered = allAvailableAreas.filter(a => a.toLowerCase().includes(query.toLowerCase())).sort((a, b) => {
        const am = a.toLowerCase().startsWith(query.toLowerCase()), bm = b.toLowerCase().startsWith(query.toLowerCase());
        if (am && !bm) return -1; if (!am && bm) return 1; return a.localeCompare(b);
    });
    if (filtered.length === 0) { dropdown.innerHTML = '<div class="p-4 text-center text-sm opacity-50 italic">No locations found</div>'; } 
    else {
        filtered.slice(0, 6).forEach(area => {
            const isSel = selectedAreas.includes(area);
            const div = document.createElement('div');
            div.className = `dropdown-item ${isSel ? 'opacity-30 pointer-events-none' : 'cursor-pointer'}`;
            div.innerHTML = `<div class="px-1"><span class="${isSel ? 'line-through opacity-50' : 'font-medium'}">${area}</span></div>`;
            if (!isSel) div.onclick = () => selectArea(area);
            dropdown.appendChild(div);
        });
    }
    dropdown.classList.remove('hidden');
}
function selectArea(area) { if (!selectedAreas.includes(area)) { selectedAreas.push(area); refreshAreaSelection(); renderAreaDropdown(document.getElementById('areaSearchInput').value); } }
function removeArea(area) { selectedAreas = selectedAreas.filter(a => a !== area); refreshAreaSelection(); if (document.getElementById('areaSearchInput')) renderAreaDropdown(document.getElementById('areaSearchInput').value); }
function refreshAreaSelection() {
    const container = document.getElementById('selectedAreasContainer'); if (!container) return;
    container.innerHTML = '';
    if (selectedAreas.length === 0) { container.innerHTML = '<span class="text-xs opacity-50 italic py-2">No areas selected yet.</span>'; return; }
    selectedAreas.forEach(area => {
        const badge = document.createElement('div');
        badge.className = 'badge bg-blue-700 text-white border-none badge-lg py-4 px-4 gap-2 font-bold shadow-sm';
        badge.innerHTML = `<i class="fas fa-map-marker-alt text-xs opacity-70"></i> ${area} <i class="fas fa-times cursor-pointer hover:text-white/70 ml-1" onclick="removeArea('${area}')"></i>`;
        container.appendChild(badge);
    });
    if (typeof saveDraft === 'function') saveDraft();
}
function setupTagInput() {
    const input = document.getElementById('tagInput'); if(!input) return;
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); processTagInput(); } });
}
function processTagInput() {
    const input = document.getElementById('tagInput'); if (!input) return;
    const values = input.value.split(','); let hasError = false;
    const errorLabel = document.getElementById('tagError');
    values.forEach(val => {
        val = val.trim(); if (!val) return;
        if (val.split(/\s+/).length > 6) hasError = true;
        else if (!offeredServicesTags.includes(val)) offeredServicesTags.push(val);
    });
    if (errorLabel) { if (hasError) errorLabel.classList.remove('hidden'); else errorLabel.classList.add('hidden'); }
    if (!hasError) input.value = '';
    refreshTags();
    if (typeof saveDraft === 'function') saveDraft();
}
function removeTag(index) { offeredServicesTags.splice(index, 1); refreshTags(); if (typeof saveDraft === 'function') saveDraft(); }
function refreshTags() {
    const container = document.getElementById('tagContainer'); if (!container) return;
    container.innerHTML = '';
    if (offeredServicesTags.length === 0) { container.innerHTML = '<span class="text-sm opacity-50 italic py-2">No services added yet.</span>'; return; }
    offeredServicesTags.forEach((t, i) => {
        const badge = document.createElement('div');
        badge.className = 'badge bg-blue-700 text-white border-none badge-lg py-4 px-4 gap-2 font-bold shadow-sm';
        badge.innerHTML = `<i class="fas fa-tag text-[10px] opacity-70"></i> ${t} <i class="fas fa-times cursor-pointer hover:text-white/70 ml-1" onclick="removeTag(${i})"></i>`;
        container.appendChild(badge);
    });
}


async function fetchCategories(pathPrefix = '') {
    if (allAvailableCategories && allAvailableCategories.length > 0) return allAvailableCategories;
    try {
        const response = await fetch('http://localhost:5000/api/categories');
        const data = await response.json();
        allAvailableCategories = Array.isArray(data) ? data : [];
        return allAvailableCategories;
    } catch (error) {
        console.error("Category fetch failed:", error);
        allAvailableCategories = [{ name: "Home Repairs" }, { name: "Cleaning" }, { name: "Plumbing" }, { name: "Electrical" }];
        return allAvailableCategories;
    }
}
async function setupCategorySearch(pathPrefix = '') {
    const input = document.getElementById('categorySearchInput');
    const dropdown = document.getElementById('categoryDropdown');
    const section = document.getElementById('categorySearchSection');
    if(!input || !dropdown || !section) return;
    await fetchCategories(pathPrefix);
    input.onfocus = () => renderCategoryDropdown(input.value);
    input.oninput = () => renderCategoryDropdown(input.value);
    if (!window._hasCategorySearchListener) {
        document.addEventListener('click', (e) => {
            const d = document.getElementById('categoryDropdown');
            const s = document.getElementById('categorySearchSection');
            if (d && s && !s.contains(e.target)) d.classList.add('hidden');
        });
        window._hasCategorySearchListener = true;
    }
}

function toggleCategoryDropdown() { const d = document.getElementById('categoryDropdown'); if (d) d.classList.toggle('hidden'); }
function renderCategoryDropdown(query = '') {
    const dropdown = document.getElementById('categoryDropdown'); if (!dropdown) return;
    dropdown.innerHTML = '';
    const filtered = (allAvailableCategories || []).filter(c => c.name.toLowerCase().includes(query.toLowerCase())).sort((a, b) => a.name.localeCompare(b.name));
    if (filtered.length === 0) { dropdown.innerHTML = '<div class="p-4 text-center text-sm opacity-50 italic">No categories found</div>'; }
    else {
        filtered.slice(0, 6).forEach(cat => {
            const isSel = categoriesTags.includes(cat.name); const div = document.createElement('div');
            div.className = `dropdown-item ${isSel ? 'opacity-30 pointer-events-none' : 'cursor-pointer'}`;
            div.innerHTML = `<div class="px-1"><span class="${isSel ? 'line-through opacity-50' : 'font-medium'}">${cat.name}</span></div>`;
            if (!isSel) div.onclick = () => selectCategory(cat.name);
            dropdown.appendChild(div);
        });
    }
    dropdown.classList.remove('hidden');
}
function selectCategory(c) { if (!categoriesTags.includes(c)) { categoriesTags.push(c); refreshCategoryTags(); renderCategoryDropdown(document.getElementById('categorySearchInput').value); } }
function removeCategoryTag(c) { categoriesTags = categoriesTags.filter(x => x !== c); refreshCategoryTags(); if (document.getElementById('categorySearchInput')) renderCategoryDropdown(document.getElementById('categorySearchInput').value); if (typeof saveDraft === 'function') saveDraft(); }
function refreshCategoryTags() {
    const container = document.getElementById('categoryTagContainer'); if (!container) return;
    container.innerHTML = '';
    if (categoriesTags.length === 0) { container.innerHTML = '<span class="text-xs opacity-50 italic py-2">No categories selected yet.</span>'; return; }
    categoriesTags.forEach(t => {
        const badge = document.createElement('div');
        badge.className = 'badge bg-blue-700 text-white border-none badge-lg py-4 px-4 gap-2 font-bold shadow-sm';
        badge.innerHTML = `<i class="fas fa-th-large text-[10px] opacity-70"></i> ${t} <i class="fas fa-times cursor-pointer hover:text-white/70 ml-1" onclick="removeCategoryTag('${t}')"></i>`;
        container.appendChild(badge);
    });
    if (typeof saveDraft === 'function') saveDraft();
}
let allAvailableAreas = [];
let allAvailableCategories = [];
const DEMO_USER = "Osman";
const DEMO_PASS = "1";
let currentUser = null;
let providerData = null;
let offeredServicesTags = [];
let categoriesTags = [];
let selectedAreas = [];
let formCache = {};
window.onload = async () => {
    try {
        const locRes = await fetch('http://localhost:5000/api/locations');
        const locData = await locRes.json();
        allAvailableAreas = Array.isArray(locData) ? locData.map(l => l.name) : ["Chittagong"];
    } catch (e) {
        console.error("Location fetch failed:", e);
        allAvailableAreas = ["Chittagong"];
    }

    loadState();
    renderRouter();
    document.body.style.opacity = "1";
};

function loadState() {
    const storedUser = localStorage.getItem('ls_currentUser');
    if (storedUser) currentUser = JSON.parse(storedUser);
    const storedData = localStorage.getItem('ls_providerData');
    if (storedData) providerData = JSON.parse(storedData);
}

function saveState() {
    if (currentUser) localStorage.setItem('ls_currentUser', JSON.stringify(currentUser));
    else localStorage.removeItem('ls_currentUser');
    if (providerData) localStorage.setItem('ls_providerData', JSON.stringify(providerData));
    else localStorage.removeItem('ls_providerData');
}

function logout() {
    currentUser = null;
    saveState();
    window.location.href = 'login.html';
}
function renderRouter() {
    if (!currentUser) {
        window.location.href = 'login.html';
        return;
    }

    const container = document.getElementById('main-container');
    container.innerHTML = '';
    container.appendChild(document.getElementById('tmpl-provider-layout').content.cloneNode(true));
    document.getElementById('profile-username-display').innerText = currentUser.username;
    const editMode = localStorage.getItem('ls_editMode');
    if (editMode === 'edit' && providerData) {
        formCache = {...providerData};
        offeredServicesTags = [...(providerData.offeredServices || [])];
        categoriesTags = [...(providerData.categories || [])];
        selectedAreas = [...(providerData.areas || [])];
        localStorage.removeItem('ls_editMode');
    } else {
        const draft = localStorage.getItem('ls_formDraft');
        if (draft) {
            formCache = JSON.parse(draft);
            offeredServicesTags = formCache.offeredServices || [];
            categoriesTags = formCache.categories || [];
            selectedAreas = formCache.areas || [];
        } else {
            formCache = {};
            offeredServicesTags = [];
            categoriesTags = [];
            selectedAreas = [];
        }
    }

    renderForm();
}
function renderForm() {
    const contentArea = document.getElementById('dashboard-content-area');
    if (!contentArea) return;
    contentArea.innerHTML = '';
    const template = document.getElementById('tmpl-form');
    if (!template) return;
    contentArea.appendChild(template.content.cloneNode(true));
    
    const p1 = document.getElementById('form-part-1');
    const p2 = document.getElementById('form-part-2');
    const steps = document.querySelectorAll('.step');
    if (formCache && (formCache.currentStep == 2)) {
        if(p1) p1.classList.add('hidden');
        if(p2) p2.classList.remove('hidden');
        if(steps[1]) steps[1].classList.add('step-primary');
    } else {
        if(p1) p1.classList.remove('hidden');
        if(p2) p2.classList.add('hidden');
        if(steps[1]) steps[1].classList.remove('step-primary');
    }

    setupTagInput();
    setupAreaSearch();
    setupCategorySearch();
    if (formCache && Object.keys(formCache).length > 0) {
        try {
            const typeRadios = document.querySelectorAll('input[name="providerType"]');
            typeRadios.forEach(r => { if(r.value === formCache.type) r.checked = true; });
            
            ['businessName', 'phone', 'email', 'experience', 'about', 'priceConsult', 'priceHourly', 'workTimeStart', 'workTimeEnd'].forEach(id => {
                const el = document.getElementById('f_' + id);
                if(el) el.value = formCache[id] || '';
            });

            if(document.getElementById('f_about')) updateCharCount('f_about', 'wordCountLabel', 300);

            const dayChecks = document.querySelectorAll('input[name="workDay"]');
            dayChecks.forEach(chk => { 
                if(Array.isArray(formCache.workDays)) chk.checked = formCache.workDays.includes(chk.value); 
            });
                
            selectedAreas = Array.isArray(formCache.areas) ? [...formCache.areas] : [];
            refreshAreaSelection();

            categoriesTags = Array.isArray(formCache.categories) ? [...formCache.categories] : [];
            refreshCategoryTags();

            const checkboxes = document.querySelectorAll('input[name="chkWhy"]');
            checkboxes.forEach(chk => { 
                if(Array.isArray(formCache.whyChooseUs)) chk.checked = formCache.whyChooseUs.includes(chk.value); 
            });
            
            refreshTags();
        } catch (err) { console.warn("Pre-fill error:", err); }
    }
}
function saveDraft() {
    const p1 = document.getElementById('form-part-1');
    const p2 = document.getElementById('form-part-2');
    if (!p1 && !p2) return;

    const draft = { ...formCache };
    if (p2 && !p2.classList.contains('hidden')) draft.currentStep = 2;
    else draft.currentStep = 1;

    const typeEl = document.querySelector('input[name="providerType"]:checked');
    if(typeEl) draft.type = typeEl.value;
    ['businessName', 'phone', 'email', 'experience', 'about', 'priceConsult', 'priceHourly', 'workTimeStart', 'workTimeEnd'].forEach(id => {
        const el = document.getElementById('f_' + id);
        if(el) draft[id] = el.value;
    });
    
    const dayChecks = document.querySelectorAll('input[name="workDay"]:checked');
    draft.workDays = Array.from(dayChecks).map(chk => chk.value);
    
    draft.areas = [...selectedAreas];
    draft.categories = [...categoriesTags];
    draft.offeredServices = [...offeredServicesTags];
    
    const whyBoxes = document.querySelectorAll('input[name="chkWhy"]:checked');
    draft.whyChooseUs = Array.from(whyBoxes).map(chk => chk.value);

    localStorage.setItem('ls_formDraft', JSON.stringify(draft));
    formCache = draft;
}

document.addEventListener('input', (e) => { if(e.target.closest('#main-container')) saveDraft(); });
document.addEventListener('change', (e) => { if(e.target.closest('#main-container')) saveDraft(); });
function goToStep(step) {
    if(step===2){
        const biz = document.getElementById('f_businessName').value.trim(),
        phone=document.getElementById('f_phone').value.trim(),
        email=document.getElementById('f_email').value.trim(),
        experience=document.getElementById('f_experience').value.trim(),
        about=document.getElementById('f_about').value.trim();

        if(!biz||!phone||!email||!experience||!about){Swal.fire({icon:'warning',title:'Required Fields',text:'Please fill all required fields.',customClass:{confirmButton:'btn btn-primary text-white'},buttonsStyling:false});return;}

        if(about.length>300){Swal.fire({icon:'warning',title:'Limit Exceeded',text:'About section cannot exceed 300 characters.',customClass:{confirmButton:'btn btn-primary text-white'},buttonsStyling:false});return;}
        formCache.type=document.querySelector('input[name="providerType"]:checked').value;
        formCache.businessName=biz;formCache.phone=phone;formCache.email=email;formCache.experience=experience;formCache.about=about;
        document.getElementById('form-part-1').classList.add('hidden');
        document.getElementById('form-part-2').classList.remove('hidden');
        document.querySelectorAll('.step')[1].classList.add('step-primary');
        saveDraft();window.scrollTo(0,0);
    } else {
        document.getElementById('form-part-2').classList.add('hidden');
        document.getElementById('form-part-1').classList.remove('hidden');
        document.querySelectorAll('.step')[1].classList.remove('step-primary');
        saveDraft();window.scrollTo(0,0);
    }
}

function goToReview() {
    const dayChecks=document.querySelectorAll('input[name="workDay"]:checked');
    if(dayChecks.length===0||!document.getElementById('f_workTimeStart').value||!document.getElementById('f_workTimeEnd').value||!document.getElementById('f_priceConsult').value.trim()||!document.getElementById('f_priceHourly').value.trim()||selectedAreas.length===0||categoriesTags.length===0){
        Swal.fire({icon:'warning',title:'Required Fields',text:'Please select Days, Hours, Pricing, Areas, and Categories.',customClass:{confirmButton:'btn btn-primary text-white'},buttonsStyling:false});return;
    }
    if(offeredServicesTags.length===0){Swal.fire({icon:'warning',title:'No Services Added',text:'Please add at least one offered service.',customClass:{confirmButton:'btn btn-primary text-white'},buttonsStyling:false});return;}
    saveDraft();
    const contentArea=document.getElementById('dashboard-content-area');
    contentArea.innerHTML='';contentArea.appendChild(document.getElementById('tmpl-review').content.cloneNode(true));
    renderReviewContent();window.scrollTo(0,0);
}

    const c=document.getElementById('review-content'),data=formCache;
    c.innerHTML=`
        <div class="space-y-6"><div><h3 class="text-xs font-bold uppercase tracking-widest opacity-40 mb-3">Business Information</h3><div class="space-y-4">

        </div></div></div>`;
}

function goToFormFromReview() {
    renderForm();
    document.getElementById('form-part-1').classList.add('hidden');
    document.getElementById('form-part-2').classList.remove('hidden');
    document.querySelectorAll('.step')[1].classList.add('step-primary');
}

function finalSubmit() {
    Swal.fire({title:'Confirm Submission',text:"Are you sure you want to submit this application?",icon:'question',showCancelButton:true,confirmButtonText:'Yes, Submit',
        customClass:{confirmButton:'btn btn-success text-white ml-2',cancelButton:'btn btn-ghost'},buttonsStyling:false,reverseButtons:true
    }).then(async (result) => {
        if(result.isConfirmed){
            try {
                const currentUser = JSON.parse(localStorage.getItem('ls_currentUser') || '{}');
                const payload = { ...formCache, status: 'Under Review', isApplied: true, userId: currentUser.id };
                const isUpdate = !!payload._id;
                const url = isUpdate ? `http://localhost:5000/api/providers/${payload._id}` : 'http://localhost:5000/api/user-provider/form/submit';
                const method = isUpdate ? 'PUT' : 'POST';

                const res = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (!res.ok) {
                    const errData = await res.json();
                    throw new Error(errData.message || 'Submission failed');
                }
                
                const savedData = await res.json();
                
                providerData = savedData;
                localStorage.setItem('ls_providerData', JSON.stringify(providerData));
                localStorage.removeItem('ls_formDraft');
                
                Swal.fire({title:'Application Received!',text:'Authority will review your submitted form and contact you in 2/3 business days.',icon:'success',
                    customClass:{confirmButton:'btn btn-primary text-white'},buttonsStyling:false
                }).then(()=>{ window.location.href='dashboard.html'; });
            } catch (error) {
                console.error("Error submitting form:", error);
                Swal.fire('Error', error.message || 'Could not submit application. Ensure the server is running.', 'error');
            }
        }
    });
}
