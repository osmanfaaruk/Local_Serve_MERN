<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | LocalServe</title>
        <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='100' fill='%231d4ed8'/><path fill='white' d='M448 176L256 88L64 176l192 88l192-88zm-192 112l160-73.3v60L256 348L96 274.7v-60l160 73.3zm0 96l160-73.3v60L256 444l-160-73.3v-60l160 73.3z'/></svg>">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@3.1.0/dist/full.css" rel="stylesheet" type="text/css" />
    <script>
        tailwind.config = {
            darkMode: 'class',
            daisyui: {
                themes: ['sky', 'light'],
                darkTheme: 'light'
            }
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        [data-theme] {
            --p: 221 70% 41% !important;
            --pf: 221 70% 31% !important;
            --pc: 0 0% 100% !important;
        }
        body { opacity: 0; transition: opacity 0.3s ease; color: #1a1a1a; }
        
        .text-primary { color: hsl(var(--p)) !important; }
        .btn-primary { background-color: hsl(var(--p)) !important; border-color: hsl(var(--p)) !important; color: white !important; }
        .btn-primary:hover { background-color: hsl(var(--pf)) !important; }
    </style>
    
    <meta name="color-scheme" content="light">
    <style>
        @media (prefers-color-scheme: dark) {
            :root { color-scheme: light !important; }
        }
        html { theme-transition: none; }
    </style>
</head>

<body class="min-h-screen bg-base-200">

    
    <!-- navbar section start -->
    <div class="navbar bg-base-100/80 backdrop-blur-md sticky top-0 z-50 px-4 md:px-20 border-b border-base-200">
        <div class="navbar-start">
            <a href="../index.html" class="flex items-center gap-2 group">
                <div class="w-9 h-9 bg-blue-700 rounded-lg flex items-center justify-center text-white shadow-lg shadow-blue-700/20 group-hover:scale-110 transition-transform">
                    <i class="fas fa-layer-group text-sm"></i>
                </div>
                <span class="text-2xl font-black text-primary tracking-tighter">LocalServe</span>
            </a>
        </div>
        <div class="navbar-center hidden lg:flex">
            <ul class="menu menu-horizontal px-1 font-semibold gap-2">
                <li><a href="../index.html">Home</a></li>
                <li><a href="../search-providers.html">All Providers</a></li>
                <li id="nav-provider-link"><a href="login.html">Become a Provider</a></li>
            </ul>
        </div>
        <div class="navbar-end" id="nav-user-profile">
            
        </div>
    </div>
    <!-- navbar section end -->

    
    <!-- header section start -->
    <div class="bg-base-100 border-b border-base-300 py-12">
        <div class="max-w-3xl mx-auto text-center px-4">
            <div class="w-20 h-20 rounded-full bg-primary/10 flex items-center justify-center mx-auto mb-6">
                <i class="fas fa-user-plus text-primary text-3xl"></i>
            </div>
            <h1 class="text-3xl md:text-4xl font-extrabold mb-4">Create your Account</h1>
            <p class="text-lg text-base-content/60 max-w-xl mx-auto">
                Join our growing network of trusted local professionals in Chittagong. 
            </p>
        </div>
    </div>
    <!-- header section end -->

    
    <!-- register form section start -->
    <div class="max-w-4xl mx-auto px-4 py-12">
        <div class="card bg-base-100 shadow-xl border border-base-300 max-w-md mx-auto">
            <div class="card-body">
                <h2 class="card-title justify-center text-2xl font-bold mb-6">Register</h2>
                
                <form id="registerForm" class="space-y-4">
                    <div class="form-control">
                        <label class="label"><span class="label-text font-bold uppercase tracking-wider text-xs">Email Address</span></label>
                        <input type="email" id="regEmail" class="input input-bordered w-full" placeholder="you@example.com" required />
                    </div>
                    <div class="form-control">
                        <label class="label"><span class="label-text font-bold uppercase tracking-wider text-xs">Username</span></label>
                        <input type="text" id="regUsername" class="input input-bordered w-full" placeholder="Choose a username" required />
                    </div>
                    <div class="form-control">
                        <label class="label"><span class="label-text font-bold uppercase tracking-wider text-xs">Password</span></label>
                        <input type="password" id="regPassword" class="input input-bordered w-full" placeholder="Create a password" required />
                    </div>
                    <button type="submit" class="btn btn-primary w-full text-white font-bold mt-4 shadow-lg">Sign Up</button>
                </form>
                
                <div class="divider text-xs opacity-50">OR</div>
                <p class="text-center text-sm">Already have an account? <a href="login.html" class="text-primary font-bold hover:underline">Login</a></p>
            </div>
        </div>
    </div>
    <!-- register form section end -->

    <!-- scripts section start -->
    <script>
        document.body.style.opacity = "1";

        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = document.getElementById('regEmail').value;
            const username = document.getElementById('regUsername').value;
            const password = document.getElementById('regPassword').value;
            const btn = document.querySelector('#registerForm button[type="submit"]');

            btn.disabled = true;
            btn.innerHTML = '<span class="loading loading-spinner loading-sm"></span> Creating account...';

            try {
                const res = await fetch('/api/user-provider/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, username, password })
                });
                const data = await res.json();

                if (res.ok) {
                    Swal.fire({
                        icon: 'success',
                        title: 'Account Created!',
                        text: 'Registration successful! You can now login.',
                        customClass: { confirmButton: 'btn btn-primary text-white' },
                        buttonsStyling: false
                    }).then(() => {
                        window.location.href = 'login.html';
                    });
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Registration Failed',
                        text: data.message,
                        customClass: { confirmButton: 'btn btn-primary text-white' },
                        buttonsStyling: false
                    });
                }
            } catch (err) {
                Swal.fire({ icon: 'error', title: 'Error', text: 'Could not connect to server.', customClass: { confirmButton: 'btn btn-primary text-white' }, buttonsStyling: false });
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Sign Up';
            }
        });
    </script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const userJson = localStorage.getItem('ls_currentUser');
            if (userJson) {
                try {
                    const user = JSON.parse(userJson);
                    const providerLink = document.getElementById('nav-provider-link');
                    if (providerLink) {
                        providerLink.innerHTML = `<a href="dashboard.html">Account</a>`;
                    }
                    const userProfile = document.getElementById('nav-user-profile');
                    if (userProfile) {
                        userProfile.innerHTML = `<a href="dashboard.html" class="btn btn-ghost btn-sm font-bold text-primary"><i class="fas fa-user-circle mr-1 text-lg"></i> ${user.username}</a>`;
                    }
                } catch(e){}
            }
        });
    </script>
    <!-- scripts section end -->
</body>
</html>
