<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Providers | LocalServe Modern</title>
    

    <link href="https://cdn.jsdelivr.net/npm/daisyui@3.1.0/dist/full.css" rel="stylesheet" type="text/css" />
    <script>
        tailwind.config = {
            darkMode: 'class',
            daisyui: {
                themes: ['sky', 'light'],
                darkTheme: 'light'
            }
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    

    <style>
        [data-theme] {
            --p: 221 70% 41% !important; /* Dark Blue (blue-700) */
            --pf: 221 70% 31% !important;
            --pc: 0 0% 100% !important;
        }
        .text-primary { color: hsl(var(--p)) !important; }
        .btn-primary { background-color: hsl(var(--p)) !important; border-color: hsl(var(--p)) !important; color: white !important; }
        .btn-primary:hover { background-color: hsl(var(--pf)) !important; }
        .badge-primary { background-color: hsl(var(--p)) !important; border-color: hsl(var(--p)) !important; color: white !important; }
        
    </style>

    <!-- Light Theme -->
    <meta name="color-scheme" content="light">
    <style>
        @media (prefers-color-scheme: dark) {
            :root { color-scheme: light !important; }
        }
        html { theme-transition: none; }
    </style>
</head>

<body class="min-h-screen bg-base-200 overflow-x-hidden">


     <div class="navbar bg-base-100/80 backdrop-blur-md sticky top-0 z-50 px-4 md:px-20 border-b border-base-200">
        <div class="navbar-start">
            <a href="index.html" class="btn btn-ghost normal-case text-2xl font-black text-primary tracking-tighter">LocalServe</a>
        </div>
        <div class="navbar-center hidden lg:flex">
            <ul class="menu menu-horizontal px-1 font-semibold gap-2">
                <li><a href="index.html" >Home</a></li>
                <li><a href="search-providers.html" class="active">All Providers</a></li>
                <li><a href="user-provider/login.html">Become a Provider</a></li>
            </ul>
        </div>
        <div class="navbar-end">
            <a href="../Admin-Dashboard/index.html" class="btn btn-ghost btn-sm hidden md:flex">Admin Portal</a>
        </div>
    </div>



    <div class="max-w-7xl mx-auto px-4 py-8 relative z-10">
        <div class="flex flex-col lg:flex-row gap-8">

            <!-- Filter Sidebar -->
            <aside class="w-full lg:w-80 space-y-6">
                <div class="card bg-base-100 shadow-sm border border-base-300 sticky top-24 rounded-3xl">
                    <div class="card-body p-8">
                        <h2 class="card-title text-xl font-black mb-6">Filter Results</h2>

                        <!-- Search Within -->
                        <div class="form-control mb-4">
                            <label class="label"><span class="label-text font-bold">Search</span></label>
                            <div class="relative">
                                <i
                                    class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-base-content/40"></i>
                                <input type="text" id="sidebarSearch" placeholder="e.g. Plumber"
                                    class="input input-bordered w-full pl-10" />
                            </div>
                        </div>

                        <div class="form-control mb-4">
                            <label class="label"><span class="label-text font-bold">Category</span></label>
                            <select id="categoryFilter" class="select select-bordered w-full">
                                <option>All Categories</option>
                            </select>
                        </div>

                        <!-- Location Filter -->
                        <div class="form-control mb-4">
                            <label class="label"><span class="label-text font-bold">Location</span></label>
                            <select id="locationFilter" class="select select-bordered w-full">
                                <option value="">All Locations</option>
                            </select>
                        </div>

                        <!-- Filter Action -->
                        <div class="mt-6">
                            <button onclick="handleFilter()" class="btn btn-primary w-full rounded-xl shadow-lg shadow-primary/20 font-bold">
                                <i class="fas fa-filter mr-2"></i> Filter Results
                            </button>
                        </div>
                    </div>
                </div>
            </aside>

            <!-- Main Listing Area -->
            <main class="flex-1">
                <!-- Results Section -->
                <div class="mb-4">
                    <p class="text-sm font-bold opacity-50">Showing best matches for your search</p>
                </div>

                <!-- Grid of Results -->
                <div id="results-grid" class="grid grid-cols-1 gap-6">
                    <!-- Dynamic results will be injected here -->
                </div>

                <!-- Pagination -->
                <div class="flex justify-center mt-12 pb-12">
                    <div class="join shadow-xl rounded-2xl bg-base-100 p-2 border border-base-300">
                        <button class="join-item btn btn-ghost btn-sm hover:text-primary transition-colors">«</button>
                        <button class="join-item btn btn-primary btn-sm px-6 rounded-xl shadow-lg shadow-primary/20">1</button>
                        <button class="join-item btn btn-ghost btn-sm hover:text-primary transition-colors">2</button>
                        <button class="join-item btn btn-ghost btn-sm hover:text-primary transition-colors">3</button>
                        <button class="join-item btn btn-ghost btn-sm hover:text-primary transition-colors">»</button>
                    </div>
                </div>
            </main>
        </div>
    </div>
    

    <script>
        let allProviders = [];

        async function initializePage() {
            try {
                // 1. Fetch Categories
                const catRes = await fetch('http://localhost:5000/api/categories');
                const categories = await catRes.json();
                const categorySelect = document.getElementById('categoryFilter');
                categories.forEach(cat => {
                    const option = document.createElement('option');
                    option.value = cat.name;
                    option.textContent = cat.name;
                    categorySelect.appendChild(option);
                });

                // 2. Fetch Locations
                const locRes = await fetch('http://localhost:5000/api/locations');
                const locations = await locRes.json();
                const locationSelect = document.getElementById('locationFilter');
                locations.forEach(loc => {
                    const option = document.createElement('option');
                    option.value = loc.name;
                    option.textContent = loc.name;
                    locationSelect.appendChild(option);
                });

                // 3. Fetch Providers
                const provRes = await fetch('http://localhost:5000/api/providers');
                const data = await provRes.json();
                allProviders = data.filter(p => p.status === 'Approved');

                // Check URL for category pre-selection
                const urlParams = new URLSearchParams(window.location.search);
                const initialCategory = urlParams.get('category');
                if (initialCategory) {
                    categorySelect.value = initialCategory;
                }

                renderProviders(allProviders);
            } catch (error) {
                console.error('Error initializing page:', error);
            }
        }

        function handleFilter() {
            const searchQuery = document.getElementById('sidebarSearch').value.toLowerCase();
            const category = document.getElementById('categoryFilter').value;
            const location = document.getElementById('locationFilter').value;

            const filtered = allProviders.filter(p => {
                const matchesSearch = p.businessName.toLowerCase().includes(searchQuery) || 
                                      p.about.toLowerCase().includes(searchQuery) ||
                                      (p.offeredServices && p.offeredServices.join(' ').toLowerCase().includes(searchQuery));
                
                const matchesCategory = category === 'All Categories' || category === '' || (p.categories && p.categories.includes(category));
                const matchesLocation = location === 'All Locations' || location === '' || (p.areas && p.areas.includes(location));

                return matchesSearch && matchesCategory && matchesLocation;
            });

            renderProviders(filtered);
        }

        function renderProviders(providers) {
            const grid = document.getElementById('results-grid');
            grid.innerHTML = '';

            if (providers.length === 0) {
                grid.innerHTML = '<div class="text-center p-10 text-base-content/50">No providers found matching your criteria.</div>';
                return;
            }

            providers.forEach(p => {
                const categoryBadge = p.categories && p.categories.length > 0 ? p.categories[0] : 'Service';
                const areaText = p.areas && p.areas.length > 0 ? p.areas[0] : 'Chittagong';
                const price = p.priceConsult || p.priceHourly || 'Contact for price';

                const card = document.createElement('div');
                card.className = "card bg-base-100 shadow-sm border border-base-300 transition-all cursor-pointer group rounded-3xl overflow-hidden";
                card.onclick = () => window.location.href = `provider-details.html?id=${p._id}`;
                card.innerHTML = `
                    <div class="card-body p-0 flex-row">
                        <div class="w-1/3 min-w-[120px] bg-primary/5 flex items-center justify-center transition-colors group-hover:bg-primary group-hover:text-white">
                            <i class="fas fa-user-tie text-5xl text-primary/20 group-hover:text-white transition-colors"></i>
                        </div>
                        <div class="w-2/3 p-6">
                            <div class="badge badge-primary badge-outline font-bold text-[10px] py-2 px-3 mb-2">${categoryBadge}</div>
                            <h3 class="text-xl font-bold transition-colors group-hover:text-primary">${p.businessName}</h3>
                            <p class="text-sm text-base-content/60 mt-1 flex items-center gap-1">
                                <i class="fas fa-map-marker-alt text-primary/50"></i> ${areaText}
                            </p>
                            <p class="text-[10px] uppercase font-bold text-base-content/20 mt-1 tracking-widest">Verified Provider</p>
                            <div class="mt-4 flex items-center justify-between border-t border-base-200 pt-4">
                                <div class="font-bold text-primary text-lg">${price} <span class="text-xs opacity-50 font-normal"></span></div>
                                <button class="btn btn-primary btn-circle btn-sm shadow-lg shadow-primary/20"><i class="fas fa-chevron-right text-xs"></i></button>
                            </div>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Attach event listeners for live search
        document.getElementById('sidebarSearch').addEventListener('input', handleFilter);
        document.getElementById('categoryFilter').addEventListener('change', handleFilter);
        document.getElementById('locationFilter').addEventListener('change', handleFilter);

        // Start
        window.onload = initializePage;
    </script>
</body>

</html>
