<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Providers | LocalServe Modern</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@3.1.0/dist/full.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        [data-theme] {
            --p: 221 70% 41% !important;
            --pf: 221 70% 31% !important;
            --pc: 0 0% 100% !important;
        }
        
        body, html {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
        }

        .text-primary { color: hsl(var(--p)) !important; }
        .btn-primary { background-color: hsl(var(--p)) !important; border-color: hsl(var(--p)) !important; color: white !important; }
        .btn-primary:hover { background-color: hsl(var(--pf)) !important; }
        .badge-primary { background-color: hsl(var(--p)) !important; border-color: hsl(var(--p)) !important; color: white !important; }
        .card { transform: none !important; transition: none !important; }
    </style>
</head>

<body class="min-h-screen bg-base-200 overflow-x-hidden">

    <!-- navbar section start -->
    <div class="navbar bg-base-100/80 backdrop-blur-md sticky top-0 z-50 px-4 md:px-20 border-b border-base-200">
        <div class="navbar-start">
            <a href="index.html" class="btn btn-ghost normal-case text-2xl font-black text-primary tracking-tighter">LocalServe</a>
        </div>
        <div class="navbar-center hidden lg:flex">
            <ul class="menu menu-horizontal px-1 font-semibold gap-2">
                <li><a href="index.html">Home</a></li>
                <li><a href="search-providers.html" class="active">All Providers</a></li>
                <li id="nav-provider-link"><a href="user-provider/login.html">Become a Provider</a></li>
            </ul>
        </div>
        <div class="navbar-end" id="nav-user-profile">
            
        </div>
    </div>
    <!-- navbar section end -->

    <!-- content section start -->
    <div class="max-w-7xl mx-auto px-4 md:px-20 py-8 relative z-10">
        <div class="flex flex-col lg:flex-row gap-8">

            
            <aside class="w-full lg:w-80 shrink-0">
                <div class="card bg-base-100 shadow-sm border border-base-300 sticky top-24 rounded-3xl">
                    <div class="card-body p-8">
                        <h2 class="text-xl font-black mb-8">Filter Results</h2>

                        <div class="form-control mb-6">
                            <label class="label pt-0"><span class="label-text text-[11px] uppercase font-black text-slate-400">Search Keywords</span></label>
                            <div class="relative">
                                <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-primary/40"></i>
                                <input type="text" id="sidebarSearch" placeholder="Electrician, Plumbing"
                                    class="input input-bordered w-full pl-12 h-12 rounded-2xl bg-base-200/50 border-none focus:bg-base-100 transition-all font-medium" />
                            </div>
                        </div>

                        <div class="form-control mb-6">
                            <label class="label pt-0"><span class="label-text text-[11px] uppercase font-black text-slate-400">Service Category</span></label>
                            <select id="categoryFilter" class="select select-bordered w-full h-12 rounded-2xl bg-base-200/50 border-none focus:bg-base-100 transition-all font-bold">
                                <option value="All">All Categories</option>
                            </select>
                        </div>

                        <div class="form-control mb-8">
                            <label class="label pt-0"><span class="label-text text-[11px] uppercase font-black text-slate-400">Service Area</span></label>
                            <select id="areaFilter" class="select select-bordered w-full h-12 rounded-2xl bg-base-200/50 border-none focus:bg-base-100 transition-all font-bold">
                                <option value="All">All Locations</option>
                            </select>
                        </div>

                        <div class="pt-4">
                            <button onclick="clearFilters()"
                                class="btn btn-outline btn-primary w-full h-12 rounded-2xl font-bold text-xs uppercase hover:text-white transition-all">
                                <i class="fas fa-undo-alt mr-2"></i> Clear All Filters
                            </button>
                        </div>
                    </div>
                </div>
            </aside>

            
            <main class="flex-1">
                <div class="flex items-center justify-between mb-8 px-2">
                    <div id="resultsCount" class="text-sm font-bold opacity-40 uppercase">
                        FOUND 0 RESULTS
                    </div>
                </div>

                <div id="providersGrid" class="space-y-6 min-h-[400px]">
                    
                </div>

                
                <div id="pagination" class="mt-12 flex items-center justify-center gap-2 pb-20">
                    <button id="prevBtn" class="btn btn-circle btn-ghost btn-sm hover:bg-primary/10">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <div id="pageNumbers" class="flex items-center gap-1"></div>
                    <button id="nextBtn" class="btn btn-circle btn-ghost btn-sm hover:bg-primary/10">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
            </main>
        </div>
    </div>
    <!-- content section end -->

    <!-- scripts section start -->
    <script>
        let allProviders = [];
        let filteredProviders = [];
        let currentPage = 1;
        const itemsPerPage = 5;

        document.addEventListener('DOMContentLoaded', init);

        async function init() {
            try {
                const [pRes, cRes, lRes] = await Promise.all([
                    fetch('/api/providers'),
                    fetch('/api/categories'),
                    fetch('/api/locations')
                ]);

                allProviders = (await pRes.json()).filter(p => p.status === 'Approved');
                const categories = await cRes.json();
                const locations = await lRes.json();

                
                const catFilter = document.getElementById('categoryFilter');
                categories.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c.name;
                    opt.innerText = c.name;
                    catFilter.appendChild(opt);
                });

                const areaFilter = document.getElementById('areaFilter');
                locations.forEach(l => {
                    const opt = document.createElement('option');
                    opt.value = l.name;
                    opt.innerText = l.name;
                    areaFilter.appendChild(opt);
                });

                document.getElementById('sidebarSearch').addEventListener('input', handleFilter);
                document.getElementById('categoryFilter').addEventListener('change', handleFilter);
                document.getElementById('areaFilter').addEventListener('change', handleFilter);

                const urlParams = new URLSearchParams(window.location.search);
                if (urlParams.get('service')) document.getElementById('sidebarSearch').value = urlParams.get('service');
                if (urlParams.get('category')) document.getElementById('categoryFilter').value = urlParams.get('category');
                if (urlParams.get('area')) document.getElementById('areaFilter').value = urlParams.get('area');

                handleFilter();
            } catch (err) { console.error('Init Error:', err); }
        }

        function handleFilter() {
            const query = document.getElementById('sidebarSearch').value.toLowerCase();
            const cat = document.getElementById('categoryFilter').value;
            const area = document.getElementById('areaFilter').value;

            filteredProviders = allProviders.filter(p => {
                const matchesSearch = !query || (p.businessName.toLowerCase().includes(query) || 
                                     (p.categories && p.categories.some(c => c.toLowerCase().includes(query))) ||
                                     (p.about && p.about.toLowerCase().includes(query)));
                const matchesCat = cat === 'All' || (p.categories && p.categories.includes(cat));
                const matchesArea = area === 'All' || (p.areas && p.areas.includes(area));
                return matchesSearch && matchesCat && matchesArea;
            });

            currentPage = 1;
            renderProviders();
        }

        function renderProviders() {
            const grid = document.getElementById('providersGrid');
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const paginatedItems = filteredProviders.slice(start, end);
            const totalPages = Math.ceil(filteredProviders.length / itemsPerPage);

            document.getElementById('resultsCount').innerText = `FOUND ${filteredProviders.length} RESULT${filteredProviders.length !== 1 ? 'S' : ''}`;

            if (filteredProviders.length === 0) {
                grid.innerHTML = `
                    <div class="bg-white rounded-[2.5rem] border border-slate-200 p-20 text-center shadow-sm">
                        <div class="w-20 h-20 bg-slate-50 rounded-full flex items-center justify-center mx-auto mb-6">
                            <i class="fas fa-search text-3xl text-slate-200"></i>
                        </div>
                        <h3 class="text-xl font-bold text-slate-800 mb-2">No professionals found</h3>
                        <p class="text-slate-400">Try adjusting your filters or search keywords</p>
                    </div>`;
                document.getElementById('pagination').classList.add('hidden');
                return;
            }

            grid.innerHTML = paginatedItems.map(p => `
                <div class="card bg-white border border-slate-200 overflow-hidden rounded-[2.5rem] cursor-pointer shadow-md hover:shadow-xl transition-all duration-300"
                    onclick="window.location.href='provider-details.html?id=${p._id}'">
                    <div class="card-body p-8 flex-col md:flex-row gap-8 items-center">
                        <div class="w-28 h-28 rounded-2xl bg-slate-50 flex items-center justify-center text-slate-300 shrink-0">
                            <i class="fas ${p.type === 'Company' ? 'fa-building' : 'fa-user-tie'} text-4xl"></i>
                        </div>
                        <div class="flex-1">
                            <div class="flex items-center gap-2 mb-3 overflow-hidden">
                                <span class="px-3 py-1.5 bg-blue-700 text-white rounded-lg text-[11px] font-bold uppercase whitespace-nowrap shadow-sm shadow-blue-700/20">${p.categories && p.categories[0] ? p.categories[0] : 'Service'}</span>
                                <span class="px-3 py-1.5 bg-slate-100 text-slate-600 border border-slate-200 rounded-lg text-[11px] font-bold uppercase whitespace-nowrap">${p.type === 'Company' ? 'Company' : 'Self Provider'}</span>
                                <span class="px-3 py-1.5 bg-emerald-50 text-emerald-700 border border-emerald-100 rounded-lg text-[11px] font-bold uppercase whitespace-nowrap">Verified</span>
                            </div>
                            <h3 class="text-3xl font-bold text-slate-900 mb-2 leading-tight tracking-tight">${p.businessName}</h3>
                            <div class="flex items-center gap-6 text-sm font-bold text-slate-500 mb-4 overflow-hidden">
                                <span class="flex items-center gap-2 whitespace-nowrap"><i class="fas fa-map-marker-alt opacity-30 text-xs"></i> ${p.areas && p.areas[0] ? p.areas[0] : 'Chittagong'}</span>
                                <span class="flex items-center gap-2 whitespace-nowrap"><i class="fas fa-history opacity-30 text-xs"></i> ${p.experience || 'N/A'}</span>
                            </div>
                            <p class="text-slate-600 text-sm leading-relaxed line-clamp-2 font-medium">${p.about || 'Professional service provider.'}</p>
                        </div>
                        <div class="w-full md:w-64 text-center md:text-right md:pl-8 flex flex-col justify-end md:self-end pb-2">
                            <div class="text-xs font-bold text-slate-400 uppercase mb-1 tracking-widest">Hourly Labor</div>
                            <div class="text-3xl font-bold text-blue-700 whitespace-nowrap">${p.priceHourly || p.priceConsult || 'Contact'} TK</div>
                        </div>
                    </div>
                </div>
            `).join('');

            updatePagination(totalPages);
        }

        function updatePagination(totalPages) {
            const paginationEl = document.getElementById('pagination');
            if (totalPages > 1) {
                paginationEl.classList.remove('hidden');
                document.getElementById('prevBtn').disabled = currentPage === 1;
                document.getElementById('nextBtn').disabled = currentPage === totalPages;
                
                const pageNumbersEl = document.getElementById('pageNumbers');
                pageNumbersEl.innerHTML = '';
                for(let i=1; i<=totalPages; i++) {
                    const btn = document.createElement('button');
                    btn.className = `w-8 h-8 rounded-lg font-black text-[10px] transition-all ${i === currentPage ? 'bg-primary text-white shadow-lg shadow-primary/30' : 'hover:bg-primary/10 text-slate-400'}`;
                    btn.innerText = i;
                    btn.onclick = () => { currentPage = i; renderProviders(); window.scrollTo({top: 0, behavior: 'smooth'}); };
                    pageNumbersEl.appendChild(btn);
                }
            } else {
                paginationEl.classList.add('hidden');
            }
        }

        function clearFilters() {
            document.getElementById('sidebarSearch').value = '';
            document.getElementById('categoryFilter').value = 'All';
            document.getElementById('areaFilter').value = 'All';
            handleFilter();
        }

        document.getElementById('prevBtn').onclick = () => { if(currentPage > 1) { currentPage--; renderProviders(); window.scrollTo({top: 0, behavior: 'smooth'}); } };
        document.getElementById('nextBtn').onclick = () => { if(currentPage < Math.ceil(filteredProviders.length/itemsPerPage)) { currentPage++; renderProviders(); window.scrollTo({top: 0, behavior: 'smooth'}); } };
    </script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const userJson = localStorage.getItem('ls_currentUser');
            if (userJson) {
                try {
                    const user = JSON.parse(userJson);
                    const providerLink = document.getElementById('nav-provider-link');
                    if (providerLink) providerLink.innerHTML = `<a href="user-provider/dashboard.html">Account</a>`;
                    
                    const userProfile = document.getElementById('nav-user-profile');
                    if (userProfile) userProfile.innerHTML = `<a href="user-provider/dashboard.html" class="btn btn-ghost btn-sm font-bold text-primary"><i class="fas fa-user-circle mr-1 text-lg"></i> ${user.username}</a>`;
                } catch(e){}
            }
        });
    </script>
    <!-- scripts section end -->
</body>

</html>
