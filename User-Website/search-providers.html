<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Providers | LocalServe Modern</title>
    

    <link href="https://cdn.jsdelivr.net/npm/daisyui@3.1.0/dist/full.css" rel="stylesheet" type="text/css" />
    <script>
        tailwind.config = {
            darkMode: 'class',
            daisyui: {
                themes: ['sky', 'light'],
                darkTheme: 'light'
            }
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    

    <style>
        [data-theme] {
            --p: 221 70% 41% !important; /* Dark Blue (blue-700) */
            --pf: 221 70% 31% !important;
            --pc: 0 0% 100% !important;
        }
        .text-primary { color: hsl(var(--p)) !important; }
        .btn-primary { background-color: hsl(var(--p)) !important; border-color: hsl(var(--p)) !important; color: white !important; }
        .btn-primary:hover { background-color: hsl(var(--pf)) !important; }
        .badge-primary { background-color: hsl(var(--p)) !important; border-color: hsl(var(--p)) !important; color: white !important; }
        
    </style>

    <!-- Light Theme -->
    <meta name="color-scheme" content="light">
    <style>
        @media (prefers-color-scheme: dark) {
            :root { color-scheme: light !important; }
        }
        html { theme-transition: none; }
    </style>
</head>

<body class="min-h-screen bg-base-200 overflow-x-hidden">


     <div class="navbar bg-base-100/80 backdrop-blur-md sticky top-0 z-50 px-4 md:px-20 border-b border-base-200">
        <div class="navbar-start">
            <a href="index.html" class="btn btn-ghost normal-case text-2xl font-black text-primary tracking-tighter">LocalServe</a>
        </div>
        <div class="navbar-center hidden lg:flex">
            <ul class="menu menu-horizontal px-1 font-semibold gap-2">
                <li><a href="index.html" >Home</a></li>
                <li><a href="search-providers.html" class="active">All Providers</a></li>
                <li><a href="user-provider/login.html">Become a Provider</a></li>
            </ul>
        </div>
        <div class="navbar-end">
            <a href="../Admin-Dashboard/index.html" class="btn btn-ghost btn-sm hidden md:flex">Admin Portal</a>
        </div>
    </div>



    <div class="max-w-7xl mx-auto px-4 py-8 relative z-10">
        <div class="flex flex-col lg:flex-row gap-8">

            <!-- Filter Sidebar -->
            <aside class="w-full lg:w-80 space-y-6">
                <div class="card bg-base-100 shadow-sm border border-base-300 sticky top-24 rounded-3xl">
                    <div class="card-body p-8">
                        <h2 class="card-title text-xl font-black mb-6">Filter Results</h2>

                        <!-- Search Within -->
                        <div class="form-control mb-5">
                            <label class="label pt-0"><span class="label-text text-[10px] uppercase font-black tracking-widest opacity-50">Search Keywords</span></label>
                            <div class="relative">
                                <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-primary/40"></i>
                                <input type="text" id="sidebarSearch" placeholder="e.g. Electrician, Plumbing"
                                    class="input input-bordered w-full pl-12 h-12 rounded-2xl bg-base-200/50 border-none focus:bg-base-100 transition-all font-medium" />
                            </div>
                        </div>

                        <div class="form-control mb-5">
                            <label class="label pt-0"><span class="label-text text-[10px] uppercase font-black tracking-widest opacity-50">Service Category</span></label>
                            <select id="categoryFilter" class="select select-bordered w-full h-12 rounded-2xl bg-base-200/50 border-none focus:bg-base-100 transition-all font-bold">
                                <option value="">All Categories</option>
                            </select>
                        </div>

                        <!-- Location Filter -->
                        <div class="form-control mb-5">
                            <label class="label pt-0"><span class="label-text text-[10px] uppercase font-black tracking-widest opacity-50">Service Area</span></label>
                            <select id="locationFilter" class="select select-bordered w-full h-12 rounded-2xl bg-base-200/50 border-none focus:bg-base-100 transition-all font-bold">
                                <option value="">All Locations</option>
                            </select>
                        </div>

                        <!-- Filter Action -->
                        <div class="mt-8 space-y-3">
                            <button onclick="handleFilter()" class="btn btn-primary w-full h-12 rounded-2xl shadow-xl shadow-primary/20 font-black tracking-tight">
                                <i class="fas fa-sliders-h mr-2"></i> Apply Filters
                            </button>
                            <button onclick="clearFilters()" class="btn btn-ghost btn-sm w-full font-bold opacity-50 hover:opacity-100">
                                Clear All Filters
                            </button>
                        </div>
                    </div>
                </div>
            </aside>

            <!-- Main Listing Area -->
            <main class="flex-1">
                <!-- Results Section -->
                <div class="mb-4">
                <p class="text-sm font-bold opacity-50" id="results-count">Showing all providers</p>
                </div>

                <!-- Grid of Results -->
                <div id="results-grid" class="grid grid-cols-1 gap-6">
                    <!-- Dynamic results will be injected here -->
                </div>

                <!-- Pagination -->
                <div class="flex justify-center mt-12 pb-12">
                    <div class="join shadow-xl rounded-2xl bg-base-100 p-2 border border-base-300">
                        <button class="join-item btn btn-ghost btn-sm hover:text-primary transition-colors">«</button>
                        <button class="join-item btn btn-primary btn-sm px-6 rounded-xl shadow-lg shadow-primary/20">1</button>
                        <button class="join-item btn btn-ghost btn-sm hover:text-primary transition-colors">2</button>
                        <button class="join-item btn btn-ghost btn-sm hover:text-primary transition-colors">3</button>
                        <button class="join-item btn btn-ghost btn-sm hover:text-primary transition-colors">»</button>
                    </div>
                </div>
            </main>
        </div>
    </div>
    

    <script>
        let allProviders = [];

        async function initializePage() {
            try {
                // 1. Fetch Categories
                const catRes = await fetch('http://localhost:5000/api/categories');
                const categories = await catRes.json();
                const categorySelect = document.getElementById('categoryFilter');
                categories.forEach(cat => {
                    const option = document.createElement('option');
                    option.value = cat.name;
                    option.textContent = cat.name;
                    categorySelect.appendChild(option);
                });

                // 2. Fetch Locations
                const locRes = await fetch('http://localhost:5000/api/locations');
                const locations = await locRes.json();
                const locationSelect = document.getElementById('locationFilter');
                locations.forEach(loc => {
                    const option = document.createElement('option');
                    option.value = loc.name;
                    option.textContent = loc.name;
                    locationSelect.appendChild(option);
                });

                // 3. Fetch Providers
                const provRes = await fetch('http://localhost:5000/api/providers');
                const data = await provRes.json();
                allProviders = data.filter(p => p.status === 'Approved');

                // Read URL params from homepage search and pre-fill sidebar
                const urlParams = new URLSearchParams(window.location.search);
                const initialService = urlParams.get('service') || '';
                const initialCategory = urlParams.get('category') || '';
                const initialArea = urlParams.get('area') || '';

                if (initialService) {
                    document.getElementById('sidebarSearch').value = initialService;
                }
                if (initialCategory) {
                    categorySelect.value = initialCategory;
                }
                if (initialArea) {
                    document.getElementById('locationFilter').value = initialArea;
                }

                // Auto-run filter if any param is present
                if (initialService || initialCategory || initialArea) {
                    handleFilter();
                } else {
                    renderProviders(allProviders);
                    document.getElementById('results-count').textContent = `Showing all ${allProviders.length} providers`;
                }
            } catch (error) {
                console.error('Error initializing page:', error);
            }
        }

        function clearFilters() {
            document.getElementById('sidebarSearch').value = '';
            document.getElementById('categoryFilter').value = '';
            document.getElementById('locationFilter').value = '';
            handleFilter();
        }

        function handleFilter() {
            const serviceQuery = document.getElementById('sidebarSearch').value.toLowerCase().trim();
            const category = document.getElementById('categoryFilter').value;
            const location = document.getElementById('locationFilter').value;

            const filtered = allProviders.filter(p => {
                // Multi-field service match: checks categories, offeredServices, businessName, about
                const serviceMatch = !serviceQuery || (
                    (p.categories && p.categories.some(c => c.toLowerCase().includes(serviceQuery))) ||
                    (p.offeredServices && p.offeredServices.some(s => s.toLowerCase().includes(serviceQuery))) ||
                    (p.businessName && p.businessName.toLowerCase().includes(serviceQuery)) ||
                    (p.about && p.about.toLowerCase().includes(serviceQuery))
                );

                const matchesCategory = !category || category === 'All Categories' || 
                    (p.categories && p.categories.some(c => c.toLowerCase() === category.toLowerCase()));

                const matchesLocation = !location || location === 'All Locations' || 
                    (p.areas && p.areas.some(a => a.toLowerCase() === location.toLowerCase()));

                return serviceMatch && matchesCategory && matchesLocation;
            });

            const count = document.getElementById('results-count');
            if (filtered.length === allProviders.length && !serviceQuery && !category && !location) {
                count.textContent = `Showing all ${filtered.length} providers`;
            } else {
                count.textContent = `Found ${filtered.length} result${filtered.length !== 1 ? 's' : ''} for your search`;
            }

            renderProviders(filtered);
        }

        function renderProviders(providers) {
            const grid = document.getElementById('results-grid');
            grid.innerHTML = '';

            if (providers.length === 0) {
                grid.innerHTML = `
                    <div class="flex flex-col items-center justify-center p-20 text-center bg-base-100 rounded-[3rem] border border-dashed border-base-300">
                        <div class="w-24 h-24 rounded-full bg-base-200 flex items-center justify-center mb-6">
                            <i class="fas fa-search text-4xl opacity-20"></i>
                        </div>
                        <h3 class="text-2xl font-black mb-2">No Professionals Found</h3>
                        <p class="text-base-content/50 max-w-xs mx-auto">We couldn't find any providers matching your current filters. Try adjusting your search or clear all filters.</p>
                        <button onclick="clearFilters()" class="btn btn-primary btn-outline rounded-xl mt-8 px-8">Clear All Filters</button>
                    </div>
                `;
                return;
            }

            providers.forEach(p => {
                const categoryBadge = p.categories && p.categories.length > 0 ? p.categories[0] : 'Service';
                const areaText = p.areas && p.areas.length > 0 ? p.areas[0] : 'Chittagong';
                const price = p.priceHourly || p.priceConsult || 'Contact for price';

                const card = document.createElement('div');
                card.className = "card bg-base-100 border border-base-200 cursor-pointer rounded-3xl overflow-hidden";
                card.onclick = () => window.location.href = `provider-details.html?id=${p._id}`;
                
                const aboutText = p.about || 'No description available.';
                const expHtml = p.experience ? `<span class="flex items-center gap-1"><i class="fas fa-briefcase text-primary/50"></i> ${p.experience}</span>` : '';
                
                card.innerHTML = `
                    <div class="card-body p-6 flex-col sm:flex-row gap-6 items-start">
                        <div class="w-20 h-20 rounded-2xl bg-gradient-to-br from-primary/10 to-primary/5 flex items-center justify-center shrink-0 border border-primary/10">
                            <i class="fas fa-user-tie text-3xl text-primary/40"></i>
                        </div>
                        <div class="flex-1 w-full">
                            <div class="flex justify-between items-start mb-2">
                                <div class="badge badge-primary font-black text-xs py-3 px-4 shadow-sm border-none">${categoryBadge}</div>
                                <div class="badge badge-ghost text-xs font-bold gap-1 py-3 px-4"><i class="fas fa-check-circle text-success"></i> Verified</div>
                            </div>
                            <h3 class="text-xl font-bold text-base-content mb-1">${p.businessName}</h3>
                            
                            <div class="flex flex-wrap gap-x-4 gap-y-2 text-sm text-base-content/60 mb-3">
                                <span class="flex items-center gap-1"><i class="fas fa-map-marker-alt text-primary/50"></i> ${areaText}</span>
                                ${expHtml}
                            </div>
                            
                            <p class="text-sm text-base-content/70 line-clamp-2 mb-4 italic">"${aboutText}"</p>
                            
                            <div class="flex items-center justify-between border-t border-base-200 pt-4 mt-auto">
                                <div>
                                    <span class="text-[10px] uppercase font-bold tracking-wider text-base-content/40 block mb-0.5">Hourly Labor</span>
                                    <div class="font-black text-primary text-lg">${price === 'Free' || price === '0' ? 'Free' : price + ' TK'}</div>
                                </div>
                                <button class="btn btn-primary btn-sm px-6 rounded-xl font-bold">View Profile</button>
                            </div>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Attach event listeners for live search
        document.getElementById('sidebarSearch').addEventListener('input', handleFilter);
        document.getElementById('categoryFilter').addEventListener('change', handleFilter);
        document.getElementById('locationFilter').addEventListener('change', handleFilter);

        // Start
        window.onload = initializePage;
    </script>
</body>

</html>
