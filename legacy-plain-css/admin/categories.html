<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Categories | Admin</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body style="background: #f1f5f9;">

    <header>
        <div class="container">
            <nav>
                <a href="../index.html" class="logo">LocalServe <span
                        style="font-size: 0.8rem; vertical-align: middle; color: var(--secondary);">ADMIN</span></a>
                <div class="nav-links">
                    <a href="../index.html">View Site</a>
                    <a href="index.html" style="font-weight: bold; color: var(--primary);">Logout</a>
                </div>
            </nav>
        </div>
    </header>

    <div class="admin-container">
        <aside class="admin-sidebar">
            <a href="index.html" class="admin-nav-item">
                <i class="fas fa-chart-line"></i> Dashboard
            </a>
            <a href="providers.html" class="admin-nav-item">
                <i class="fas fa-users"></i> Providers
            </a>
            <a href="categories.html" class="admin-nav-item active">
                <i class="fas fa-folder"></i> Categories
            </a>
            <a href="locations.html" class="admin-nav-item">
                <i class="fas fa-map-marker-alt"></i> Locations
            </a>
        </aside>

        <main class="admin-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <h2>Manage Categories</h2>
                <div style="display: flex; gap: 1rem;">
                    <input type="text" class="form-control" placeholder="New category name" style="width: 250px;">
                    <button class="btn btn-primary">+ Add Category</button>
                </div>
            </div>

            <div
                style="background: white; border-radius: var(--radius); border: 1px solid var(--border); padding: 1.5rem;">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Category Name</th>
                            <th>Total Providers</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Plumbing</td>
                            <td>24</td>
                            <td>
                                <button class="btn btn-outline" style="padding: 0.25rem 0.5rem; font-size: 0.75rem;"><i
                                        class="fas fa-edit"></i></button>
                                <button class="btn btn-danger" style="padding: 0.25rem 0.5rem; font-size: 0.75rem;"><i
                                        class="fas fa-trash"></i></button>
                            </td>
                        </tr>
                        <tr>
                            <td>Electrical</td>
                            <td>18</td>
                            <td>
                                <button class="btn btn-outline" style="padding: 0.25rem 0.5rem; font-size: 0.75rem;"><i
                                        class="fas fa-edit"></i></button>
                                <button class="btn btn-danger" style="padding: 0.25rem 0.5rem; font-size: 0.75rem;"><i
                                        class="fas fa-trash"></i></button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

</body>

</html>
