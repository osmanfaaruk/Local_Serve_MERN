<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalServe - Project Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #3b82f6;
            --accent: #2563eb;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-sub: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .hub-container {
            max-width: 900px;
            width: 100%;
            text-align: center;
        }

        .hub-header {
            margin-bottom: 40px;
        }

        .hub-header h1 {
            font-size: 2.5rem;
            font-weight: 600;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
        }

        .hub-header p {
            color: var(--text-sub);
            font-size: 1.1rem;
        }

        .portal-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
        }

        .portal-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 24px;
            text-decoration: none;
            color: inherit;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(226, 232, 240, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .portal-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            border-color: var(--primary);
        }

        .portal-card .icon {
            font-size: 3rem;
            margin-bottom: 20px;
        }

        .portal-card h2 {
            font-size: 1.5rem;
            margin-bottom: 12px;
            color: var(--text-main);
        }

        .portal-card p {
            color: var(--text-sub);
            line-height: 1.6;
        }

        .badge {
            margin-top: 20px;
            padding: 6px 16px;
            border-radius: 999px;
            font-size: 0.875rem;
            font-weight: 600;
            background: #eff6ff;
            color: var(--primary);
        }

        footer {
            margin-top: 60px;
            color: var(--text-sub);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="hub-container">
        <header class="hub-header">
            <h1>LocalServe Hub</h1>
            <p>Select your workspace to continue</p>
        </header>

        <div class="portal-grid">
            <a href="./User-Website/index.html" class="portal-card">
                <div class="icon">🌍</div>
                <h2>User Website</h2>
                <p>Browse services, search providers, and explore the public platform for users.</p>
                <span class="badge">Go Live</span>
            </a>

            <a href="./Admin-Dashboard/index.html" class="portal-card">
                <div class="icon">🛡️</div>
                <h2>Admin Dashboard</h2>
                <p>Manage provider listings, categories, and locations behind the scenes.</p>
                <span class="badge">Manage Portal</span>
            </a>
        </div>

        <footer>
            Built with ❤️ for LocalServe Platform
        </footer>
    </div>
</body>
</html>
